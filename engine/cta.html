<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts/fonts.css">
<style>
  /* kapanış kartı: şeffaf zemin, ortada beğen + takip et çağrısı. ?dil=tr|en */
  html,body{margin:0;width:1080px;height:1920px;background:transparent}
  .k{position:absolute;left:110px;right:110px;top:640px;padding:70px 60px;border-radius:56px;background:rgba(18,16,30,.82);text-align:center;color:#FFF3DC;font-family:Archivo;font-stretch:90%}
  .b{font-weight:800;font-size:84px;line-height:1.05;margin:0 0 26px}
  .s{font-weight:500;font-size:52px;line-height:1.2;margin:0 0 54px;opacity:.9}
  .r{display:flex;gap:30px;justify-content:center}
  .r div{display:flex;align-items:center;gap:18px;padding:22px 40px;border-radius:999px;font-weight:800;font-size:50px}
  .l{background:#FF4D6D}.t{background:#FFC94A;color:#1A1614}
</style></head><body>
<div class="k"><p class="b" id="b"></p><p class="s" id="s"></p>
<div class="r"><div class="l"><svg width="56" height="56" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 5.3 3.1 1.7-1.9 3.2-3.1 5.3-3.1 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z" fill="#fff"/></svg><span id="l"></span></div>
<div class="t"><svg width="56" height="56" viewBox="0 0 24 24"><circle cx="9" cy="8" r="4" fill="#1A1614"/><path d="M1.5 20c0-4 3.4-6.5 7.5-6.5s7.5 2.5 7.5 6.5z" fill="#1A1614"/><path d="M19 7v8M15 11h8" stroke="#1A1614" stroke-width="2.6" stroke-linecap="round"/></svg><span id="t"></span></div></div></div>
<script>
const M = { tr: ['Beğendiyseniz', 'beğenip takip etmeyi unutmayın!', 'Beğen', 'Takip et'], en: ['Enjoyed this?', "Don't forget to like and follow!", 'Like', 'Follow'] };
const m = M[new URLSearchParams(location.search).get('dil') || 'tr'];
['b', 's', 'l', 't'].forEach((id, i) => document.getElementById(id).textContent = m[i]);
</script></body></html>
