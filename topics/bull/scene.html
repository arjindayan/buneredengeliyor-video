<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../engine/fonts/fonts.css">
<style>
  /* STİL KARTI: gün batımında arena, tombul boğa + minik matador */
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#2A1A33}
  svg{position:absolute;inset:0}
  #altyazi{position:absolute;left:60px;right:60px;top:210px;text-align:center;font:400 92px/1.08 'Patrick Hand';color:#FFF3DC;text-shadow:0 4px 0 rgba(30,10,20,.6)}
  .lbl{font-family:'Fredoka';font-weight:600;paint-order:stroke;stroke-linejoin:round}
</style>
</head>
<body>
<svg viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <linearGradient id="gok" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A1A33"/><stop offset=".45" stop-color="#7A3550"/><stop offset=".75" stop-color="#E07A4F"/><stop offset="1" stop-color="#F6B26B"/></linearGradient>
  </defs>
  <g id="arka"></g>
  <g id="dunya"></g>
  <g id="ust"></g>
</svg>
<div id="altyazi"></div>
<script src="../../engine/lib.js"></script>
<script src="../../engine/cute.js"></script>
<script>
window.FONTS = ['400 80px "Patrick Hand"', '600 80px Fredoka'];
const ZEMIN = 1560;

function boga(x, y, s, yon, t, o = {}) {
  const kos = o.kos || 0, adim = sin(t * 0.5) * 22 * kos;
  let g = `<g transform="translate(${f2(x)},${f2(y)}) scale(${f2(s * yon)},${f2(s)})">`;
  // bacaklar
  [[-110, adim], [-60, -adim], [60, adim], [110, -adim]].forEach(([lx, a]) => g += `<rect x="${lx - 18}" y="40" width="36" height="${110}" rx="16" fill="#5E3620" transform="rotate(${f2(a)} ${lx} 40)"/><rect x="${lx - 20}" y="135" width="40" height="22" rx="8" fill="#2A1A14" transform="rotate(${f2(a)} ${lx} 40)"/>`);
  g += `<path d="M-170 -20 q-60 20 -50 90" stroke="#5E3620" stroke-width="12" fill="none" stroke-linecap="round" transform="rotate(${f2(sin(t * .2) * 8)} -170 -20)"/><circle cx="-220" cy="72" r="14" fill="#2A1A14"/>`;
  g += `<ellipse cx="0" cy="0" rx="180" ry="115" fill="#7B4A2E"/><ellipse cx="-20" cy="35" rx="120" ry="60" fill="#8E5A3A"/>`;
  // kafa
  const kb = o.otur ? 20 : -(o.egil || 0) * 30;
  g += `<g transform="translate(150,${f2(-50 + kb)}) rotate(${f2((o.egil || 0) * 18)})">`;
  g += `<path d="M-50 -60 Q-110 -110 -95 -150 Q-70 -100 -30 -80Z M50 -60 Q110 -110 95 -150 Q70 -100 30 -80Z" fill="#FFF1D6" stroke="#C9B48A" stroke-width="4"/>`;
  g += `<circle r="92" fill="#7B4A2E"/><ellipse cx="25" cy="45" rx="70" ry="48" fill="#F2C7A5"/><ellipse cx="10" cy="45" rx="9" ry="12" fill="#7A3B2A"/><ellipse cx="45" cy="45" rx="9" ry="12" fill="#7A3B2A"/>`;
  g += `<path d="M-90 -20 q-40 -10 -50 20 q30 5 50 0Z" fill="#6A3D24"/>`;
  const gz = o.bored ? `<path d="M-35 -18 h28 M25 -18 h28" stroke="#2A1A14" stroke-width="7" stroke-linecap="round"/>` : `<circle cx="-22" cy="-18" r="${o.sur ? 18 : 15}" fill="#fff"/><circle cx="38" cy="-18" r="${o.sur ? 18 : 15}" fill="#fff"/><circle cx="-18" cy="-16" r="8" fill="#2A1A14"/><circle cx="42" cy="-16" r="8" fill="#2A1A14"/>`;
  g += gz;
  if (o.kizgin) g += `<path d="M-45 -48 l40 16 M65 -48 l-40 16" stroke="#2A1A14" stroke-width="8" stroke-linecap="round"/>`;
  if (o.wink) g += `<rect x="20" y="-40" width="40" height="30" fill="#7B4A2E"/><path d="M22 -18 q16 -12 32 0" stroke="#2A1A14" stroke-width="6" fill="none" stroke-linecap="round"/>`;
  g += `<path d="M-20 75 q15 ${o.gul ? 14 : 6} 30 0" stroke="#7A3B2A" stroke-width="5" fill="none" stroke-linecap="round"/><ellipse cx="-50" cy="20" rx="14" ry="8" fill="#FF8FA3" opacity=".5"/>`;
  g += `<circle cx="28" cy="88" r="16" fill="none" stroke="#E0B84A" stroke-width="7"/>`;
  g += '</g>';
  if (o.buhar) for (let k = 0; k < 3; k++) { const u = ((t * .05 + k / 3) % 1); g += `<circle cx="${f2(220 + u * 90)}" cy="${f2(-10 + kb + 10 - u * 40)}" r="${f2(12 + u * 22)}" fill="#fff" opacity="${f2(o.buhar * (1 - u) * .8)}"/>`; }
  return g + '</g>';
}
function pelerin(x, y, renk, dalga, t, s = 1) {
  // direk + kumaş; dalga 0 durgun, 1 savruluyor
  const w = sin(t * .45) * 60 * dalga, w2 = sin(t * .45 + 1.3) * 40 * dalga;
  return `<g transform="translate(${x},${y}) scale(${s})"><path d="M0 0 V-260" stroke="#6D4C35" stroke-width="12" stroke-linecap="round"/><path d="M-110 -250 H110" stroke="#6D4C35" stroke-width="10" stroke-linecap="round"/>` +
    `<path d="M-110 -250 H110 Q${f2(120 + w)} -120 ${f2(100 + w2)} -10 Q${f2(w)} ${f2(20 + w2 * .3)} ${f2(-100 + w2)} -10 Q${f2(-120 + w)} -120 -110 -250Z" fill="${renk}" stroke="#2A1A14" stroke-width="5" stroke-linejoin="round"/></g>`;
}
function matador(x, y, s, t, sallar) {
  const b = sin(t * .1) * 4, w = sin(t * .45) * 70 * sallar;
  let g = `<g transform="translate(${x},${f2(y + b)}) scale(${s})">`;
  g += `<path d="M-30 0 v60 M30 0 v60" stroke="#E7D6A8" stroke-width="22" stroke-linecap="round"/>`;
  g += `<rect x="-60" y="-140" width="120" height="150" rx="45" fill="#C43C3C"/><path d="M-60 -100 h120" stroke="#F2C14E" stroke-width="10"/><path d="M-40 -140 v120 M40 -140 v120" stroke="#F2C14E" stroke-width="6"/>`;
  g += `<circle cy="-190" r="58" fill="#F2C9A0"/><circle cx="-20" cy="-195" r="7" fill="#2A1A14"/><circle cx="20" cy="-195" r="7" fill="#2A1A14"/><path d="M-14 -170 q14 12 28 0" stroke="#2A1A14" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  g += `<path d="M-70 -230 Q-60 -280 0 -270 Q60 -280 70 -230 Q0 -250 -70 -230Z" fill="#1E1E2A"/><circle cx="-62" cy="-232" r="16" fill="#1E1E2A"/><circle cx="62" cy="-232" r="16" fill="#1E1E2A"/>`;
  // pelerin elde, sola doğru
  g += `<path d="M-50 -90 L-120 -110" stroke="#F2C9A0" stroke-width="18" stroke-linecap="round"/>`;
  g += `<path d="M-120 -120 Q-220 ${f2(-150 + w * .3)} ${f2(-300 + w * .4)} ${f2(-110 + w * .5)} Q${f2(-290 + w * .2)} ${f2(20 + w * .4)} ${f2(-180 + w * .3)} 40 Q-140 -20 -120 -120Z" fill="#D62B2B" stroke="#2A1A14" stroke-width="5" stroke-linejoin="round"/>`;
  return g + '</g>';
}

let K = null;
function kur() {
  const S = T.seg, c = cue, E = T.total;
  K = { cam: [[0, [580, 1420, 1.4]], [S.test.start, [580, 1420, 1.4]], [S.test.start + 14, [540, 1420, 1.12]], [S.why.start, [540, 1420, 1.12]], [S.why.start + 14, [580, 1420, 1.4]], [E, [580, 1420, 1.4]]] };
}

window.renderFrame = function (f) {
  if (!K) kur();
  const S = T.seg, c = cue, t = f;
  const [cx, cy, s] = kf(f, K.cam);
  // arka plan
  let a = `<rect width="1080" height="1920" fill="url(#gok)"/><circle cx="820" cy="900" r="120" fill="#FFD27A" opacity=".85"/>`;
  a += `<g transform="translate(540,1250) scale(${f2(1 + (s - 1) * .3)}) translate(-540,-1250)">`;
  a += `<rect x="-60" y="1060" width="1200" height="330" fill="#8C3B3B"/><rect x="-60" y="1060" width="1200" height="22" fill="#5E2626"/>`;
  for (let r = 0; r < 4; r++) for (let k = 0; k < 24; k++) { const x = -40 + k * 50 + (r % 2) * 25, y = 1110 + r * 50; a += `<circle cx="${x}" cy="${f2(y + sin(t * .2 + k + r) * 3)}" r="16" fill="${['#F2C9A0', '#C68B59', '#8D5524', '#E0AC69'][(k + r) % 4]}"/><rect x="${x - 18}" y="${y + 12}" width="36" height="26" rx="10" fill="${['#3E6BD6', '#E8505B', '#F2C14E', '#4CAF7A'][(k * 3 + r) % 4]}"/>`; }
  a += `<rect x="-60" y="1330" width="1200" height="60" fill="#F1E3C6"/><path d="M-60 1330 H1140" stroke="#B8484F" stroke-width="12"/>`;
  a += '</g>';
  a += `<rect x="0" y="1390" width="1080" height="600" fill="#E9C489"/>`;
  for (let k = 0; k < 20; k++) a += `<ellipse cx="${f2(rastgele(k) * 1080)}" cy="${f2(1420 + rastgele(k + 7) * 480)}" rx="${f2(8 + rastgele(k + 3) * 14)}" ry="4" fill="#D2A86C" opacity=".7"/>`;
  $('arka').innerHTML = a;

  let w = '';
  // pelerin / matador / test direkleri
  const mv = c('move', 'movement'), wh = c('move', 'whips');
  const testO = kf(f, [[0, 0], [S.test.start, 0], [S.test.start + 10, 1], [S.why.start, 1], [S.why.start + 10, 0]]);
  const bl = c('test', 'blue'), wt = c('test', 'white'), ig = c('test', 'ignored');
  let bx = 300, kos = 0, egil = 0, otur = 0, bored = 0;
  // kanca ve hareket: matador sağda, boğa solda
  if (testO < .5) {
    kos = kf(f, [[0, 0], [wh, 0], [wh + 6, 1], [S.move.end, 1], [S.move.end + 10, 0]]);
    bx = kf(f, [[0, 380], [wh, 380], [wh + 40, 560], [S.move.end, 540], [S.test.start, 380], [S.son.start, 380]]);
    egil = Math.max(kos, kf(f, [[0, 0], [c('hook', 'hate'), 0], [c('hook', 'hate') + 6, 1], [c('hook', 'well'), 1], [c('hook', 'well') + 8, 0]]));
    const sall = kf(f, [[0, .3], [wh - 4, .3], [wh + 4, 1], [S.move.end, 1], [S.move.end + 10, .3]]);
    w += `<g opacity="${f2(1 - testO)}">${matador(kf(f, [[0, 840], [wh, 840], [wh + 40, 900]]), ZEMIN - 60, 1, t, sall)}</g>`;
  }
  if (testO > .01) {
    w += `<g opacity="${f2(testO)}">${pelerin(220, ZEMIN, '#3E6BD6', f >= bl - 4 && f < wt ? 1 : .15, t, .8)}${pelerin(540, ZEMIN, '#F7F3EA', f >= wt - 4 && f < ig ? 1 : .15, t + 9, .8)}${pelerin(860, ZEMIN, '#D62B2B', 0, t, .8)}</g>`;
    const hedef = kf(f, [[0, 540], [S.test.start, 540], [bl, 540], [bl + 20, 300], [wt, 300], [wt + 20, 620], [ig, 620], [ig + 20, 640]]);
    kos = (f >= bl && f < bl + 22) || (f >= wt && f < wt + 22) ? 1 : 0;
    bx = hedef - 80; egil = kos; bored = f >= ig + 10 && f < S.why.start + 4 ? 1 : 0; otur = bored;
    w += etiket('CHARGE!', 220, 1180, f, bl + 18, S.why.start, 56, '#7CE0A3', 'middle', '#2A1A14');
    w += etiket('CHARGE!', 540, 1180, f, wt + 18, S.why.start, 56, '#7CE0A3', 'middle', '#2A1A14');
    w += etiket('meh', 860, 1180, f, ig + 10, S.why.start, 70, '#FFF3DC', 'middle', '#2A1A14');
  }
  // toz
  if (kos > .2) for (let k = 0; k < 6; k++) { const u = ((t * .06 + k / 6) % 1); w += `<circle cx="${f2(bx - 200 - u * 120)}" cy="${f2(ZEMIN + 20 - u * 60)}" r="${f2(16 + u * 30)}" fill="#E9D3A6" opacity="${f2(kos * (1 - u) * .8)}"/>`; }
  const kizgin = (f >= c('hook', 'hate') && f < c('hook', 'well')) || kos > .5;
  const sur = f >= c('hook', 'well') && f < c('hook', 'well') + 26;
  const sonF = f >= S.son.start;
  w += boga(bx, ZEMIN - 135, .8, 1, t, { kos, egil, kizgin, sur, buhar: kizgin ? 1 : 0, bored, otur, wink: sonF && f >= c('son', 'honestly'), gul: sonF });
  // gözlük: renk körlüğü sahnesi
  $('dunya').setAttribute('transform', `translate(540,1250) scale(${s.toFixed(4)}) translate(${f2(-cx)},${f2(-cy)})`);
  $('dunya').innerHTML = w;

  // ekran katmanı
  let u = '';
  if (f >= S.eyes.start - 2 && f < S.move.start + 6) {
    const o = klamp((f - S.eyes.start + 2) / 8) * (1 - klamp((f - S.move.start) / 6)), m = klamp((f - c('eyes', 'muddy')) / 10);
    const p1 = backOut((f - c('eyes', 'red') + 4) / 12), p2 = backOut((f - c('eyes', 'bull')) / 12);
    u += `<g opacity="${f2(o)}"><rect width="1080" height="1920" fill="#1E1220" opacity=".7"/>`;
    u += `<g transform="translate(300,900) scale(${f2(p1)})"><circle r="180" fill="#2A1A33" stroke="#FFF3DC" stroke-width="10"/><path d="M-100 -110 H100 Q120 0 90 110 Q0 130 -90 110 Q-120 0 -100 -110Z" fill="#D62B2B"/><text class="lbl" y="250" text-anchor="middle" font-size="64" fill="#FFF3DC" stroke="#1E1220" stroke-width="10">you see</text></g>`;
    u += `<g transform="translate(780,900) scale(${f2(p2)})"><circle r="180" fill="#2A1A33" stroke="#FFF3DC" stroke-width="10"/><path d="M-100 -110 H100 Q120 0 90 110 Q0 130 -90 110 Q-120 0 -100 -110Z" fill="${mix('#9C8F55', '#857B62', m)}"/><text class="lbl" y="250" text-anchor="middle" font-size="64" fill="#FFF3DC" stroke="#1E1220" stroke-width="10">bull sees</text></g>`;
    u += `<text class="lbl" x="540" y="1340" text-anchor="middle" font-size="56" fill="#FFD27A" stroke="#1E1220" stroke-width="9" opacity="${f2(klamp((f - S.eyes.start) / 8))}">red-green colorblind</text></g>`;
  }
  u += etiket('RED = ANGRY?', 540, 760, f, c('hook', 'red'), c('hook', 'well') + 4, 80, '#FF6B6B', 'middle', '#2A1A33');
  u += etiket('it\'s the MOVEMENT', 540, 760, f, mv, S.move.end + 4, 76, '#FFD27A', 'middle', '#2A1A33');
  u += etiket('tradition', 540, 720, f, c('why', 'tradition'), S.why.end + 4, 76, '#FFD27A', 'middle', '#2A1A33');
  u += etiket('+ hides stains', 540, 820, f, c('why', 'hides'), S.why.end + 4, 56, '#FFF3DC', 'middle', '#2A1A33');
  u += etiket('just don\'t wave at me', 540, 760, f, c('son', 'waved'), T.total, 60, '#FFF3DC', 'middle', '#2A1A33');
  $('ust').innerHTML = u;
  altyazi(f, $('altyazi'));
};
</script>
</body>
</html>
