<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../engine/fonts/fonts.css">
<style>
  /* STİL KARTI: sokak lezzeti afişi. Kömür siyahı, alev turuncusu, hardal; dar ve kalın Archivo. Bkz. style.md */
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#1A1614}
  svg{position:absolute;inset:0}
  #altyazi{position:absolute;left:70px;right:70px;top:1500px;text-align:center;font:800 84px/1.04 'Archivo';font-stretch:75%;color:#F6EBD9;text-transform:none}
  .bas{font-family:'Archivo';font-weight:900;font-stretch:62%}
</style>
</head>
<body>
<svg viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <pattern id="gren" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#F6EBD9" opacity=".06"/><circle cx="6" cy="5" r=".8" fill="#000" opacity=".2"/></pattern>
    <linearGradient id="et" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6E2F16"/><stop offset=".5" stop-color="#B5562A"/><stop offset="1" stop-color="#7A3418"/></linearGradient>
    <radialGradient id="kor" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FF8A2A" stop-opacity=".55"/><stop offset="1" stop-color="#FF6A1A" stop-opacity="0"/></radialGradient>
  </defs>
  <g id="zemin"></g>
  <g id="sahne"></g>
  <g id="ust"></g>
</svg>
<div id="altyazi"></div>
<script src="../../engine/lib.js"></script>
<script src="../../engine/tr.js"></script>
<script>
window.FONTS = ['900 100px Archivo', '800 80px Archivo'];
window.ALT = { soluk: 'rgba(246,235,217,.3)', aktif: '#F2B705', normal: '#F6EBD9' };
const KOM = '#1A1614', ALV = '#FF6A1A', HAR = '#F2B705', KRM = '#F6EBD9', KIR = '#D7263D';

function yazi(txt, x, y, size, renk = KRM, anchor = 'middle', op = 1, ls = 0, rot = 0) {
  return `<text class="bas" x="${x}" y="${y}" font-size="${size}" fill="${renk}" text-anchor="${anchor}" opacity="${f2(op)}" letter-spacing="${ls}" transform="rotate(${rot} ${x} ${y})">${txt}</text>`;
}
const gir = (f, f0, d = 12) => sm((f - f0) / d);

// döner konisi: yerel eksende dikey; rot ile yatırılır. donus: şeritlerin kayma fazı. yanik/cig: 0..1 (yatay sorun)
function koni(x, y, s, rot, donus, yanik = 0) {
  let g = `<g transform="translate(${f2(x)},${f2(y)}) rotate(${f2(rot)}) scale(${f2(s)})">`;
  g += `<rect x="-8" y="-380" width="16" height="760" fill="#9A9A9A"/>`;
  g += `<path d="M-150 -300 L150 -300 L120 300 L-120 300Z" fill="url(#et)"/>`;
  // dönme şeritleri
  for (let k = 0; k < 16; k++) { const u = ((k / 16 + donus) % 1), xx = -150 + u * 300; g += `<path d="M${f2(xx)} -300 L${f2(xx * .8)} 300" stroke="#5A230F" stroke-width="5" opacity="${f2(.25 + .35 * sin(u * P))}"/>`; }
  for (let k = 0; k < 9; k++) g += `<path d="M${-150 + k * 3} ${-270 + k * 64} H${150 - k * 3}" stroke="#E08A4A" stroke-width="4" opacity=".35"/>`;
  if (yanik > .01) g += `<path d="M-150 -300 L-40 -300 L-30 300 L-120 300Z" fill="#1E0E06" opacity="${f2(yanik * .85)}"/><path d="M40 -300 L150 -300 L120 300 L30 300Z" fill="#F2A3A0" opacity="${f2(yanik * .75)}"/>`;
  g += `<path d="M-150 -300 L150 -300 L120 300 L-120 300Z" fill="none" stroke="${KOM}" stroke-width="6"/>`;
  g += `<rect x="-60" y="-330" width="120" height="30" rx="8" fill="#BDBDBD"/><circle cy="380" r="22" fill="#BDBDBD"/>`;
  return g + '</g>';
}
function alev(x, y, s, t, k = 0) {
  const a = sin(t * .35 + k) * 8, b = cos(t * .45 + k) * 6;
  return `<g transform="translate(${f2(x)},${f2(y)}) scale(${f2(s)})"><path d="M0 0 C-50 -40 -40 ${f2(-110 + b)} ${f2(-10 + a)} -170 C-6 -110 30 -100 34 -60 C50 -90 40 -120 46 -130 C80 -80 60 -20 0 0Z" fill="${ALV}"/><path d="M0 -6 C-24 -26 -18 -70 ${f2(4 + a * .6)} -100 C10 -70 34 -50 20 -14Z" fill="${HAR}"/></g>`;
}
function damla(x, y, s, o) { return `<path d="M${f2(x)} ${f2(y - 18 * s)} C${f2(x + 10 * s)} ${f2(y - 4 * s)} ${f2(x + 10 * s)} ${f2(y + 8 * s)} ${f2(x)} ${f2(y + 8 * s)} C${f2(x - 10 * s)} ${f2(y + 8 * s)} ${f2(x - 10 * s)} ${f2(y - 4 * s)} ${f2(x)} ${f2(y - 18 * s)}Z" fill="${HAR}" opacity="${f2(o)}"/>`; }
function dilim(x, y, r, s = 1) { return `<g transform="translate(${f2(x)},${f2(y)}) rotate(${f2(r)}) scale(${s})"><path d="M-60 -10 Q0 -26 60 -10 Q64 6 60 12 Q0 0 -60 12 Q-64 6 -60 -10Z" fill="#A9461E" stroke="#5A230F" stroke-width="3"/></g>`; }

const SAHNE = {
  hook(f, S, t) {
    let g = `<circle cx="540" cy="1050" r="520" fill="url(#kor)"/>`;
    g += koni(540, 1050, .95, 90, t * .004);
    g += yazi('EN BİLİNEN', 540, 520, 150, KRM, 'middle', gir(f, 0, 14), 2);
    g += yazi('TÜRK YEMEĞİ', 540, 660, 150, HAR, 'middle', gir(f, 12, 14), 2);
    g += yazi('YAN YATIYORDU', 540, 1380, 120, ALV, 'middle', gir(f, cue('hook', 'yan') - 4, 10), 2);
    return g;
  },
  yatay(f, S, t) {
    const L = f - S.yatay.start;
    let g = '';
    const d = cue('yatay', 'döner') - S.yatay.start;
    g += yazi('DÖNER', 540, 640, 330, HAR, 'middle', gir(L, d - 4, 10) * (1 - gir(L, cue('yatay', 'yüzyıllarca') - S.yatay.start, 10) * .75));
    // yatay şiş ateş önünde
    g += koni(540, 1000, .8, 90, t * .006);
    for (let k = 0; k < 6; k++) g += alev(240 + k * 120, 1310, .9, t, k);
    g += yazi('YATAY', 540, 1420, 0, KRM);
    g += `<g opacity="${f2(gir(L, cue('yatay', 'yatay') - S.yatay.start - 4, 10))}"><path d="M200 780 H880" stroke="${KRM}" stroke-width="8" stroke-dasharray="20 14"/><path d="M860 760 l24 20 l-24 20" stroke="${KRM}" stroke-width="8" fill="none"/></g>`;
    return g;
  },
  sorun(f, S, t) {
    const L = f - S.sorun.start;
    const y = gir(L, cue('sorun', 'bir') - S.sorun.start, 30);
    let g = koni(540, 960, .8, 90, t * .004, y);
    for (let k = 0; k < 6; k++) g += alev(240 + k * 120, 1290, .8, t, k);
    // yağ birikintisi
    const ya = gir(L, cue('sorun', 'yağında') - S.sorun.start, 30);
    g += `<ellipse cx="540" cy="1110" rx="${f2(230 * ya)}" ry="${f2(26 * ya)}" fill="${HAR}" opacity=".7"/>`;
    for (let k = 0; k < 5; k++) { const u = ((L / 22) + k / 5) % 1; g += damla(360 + k * 90, 1080 + u * 30, 1.2, ya * (1 - u)); }
    g += yazi('YANIK', 300, 640, 140, '#3A2A22', 'middle', y, 2) + yazi('ÇİĞ', 800, 640, 140, '#F2A3A0', 'middle', gir(L, cue('sorun', 'çiğ') - S.sorun.start - 4, 10), 2);
    g += `<path d="M300 700 L360 820" stroke="#3A2A22" stroke-width="8" opacity="${f2(y)}"/><path d="M800 700 L740 820" stroke="#F2A3A0" stroke-width="8" opacity="${f2(y)}"/>`;
    return g;
  },
  iskender(f, S, t) {
    const L = f - S.iskender.start;
    let g = yazi("1860'LAR · BURSA", 540, 520, 120, HAR, 'middle', gir(L, 0, 12), 3);
    // aşçı silueti
    const p = gir(L, cue('iskender', 'iskender') - S.iskender.start - 6, 14);
    g += `<g transform="translate(250,1300) scale(${f2(p)})" fill="${KRM}"><rect x="-70" y="-300" width="140" height="300" rx="50"/><circle cy="-350" r="58" fill="#E3B48A"/><path d="M-70 -400 C-90 -480 -20 -500 0 -470 C20 -510 100 -480 70 -400Z"/><rect x="-62" y="-410" width="124" height="26" rx="8"/></g>`;
    g += yazi('İSKENDER EFENDİ', 250, 1390, 66, KRM, 'middle', p, 2);
    // şiş ayağa kalkar
    const k0 = cue('iskender', 'kaldırdı') - S.iskender.start, r = 90 - 90 * sm(klamp((L - k0 + 14) / 26));
    g += koni(700, 1000, .7, r, t * .005);
    g += yazi('ailesinin anlattığına göre', 540, 1440, 44, '#BFB3A0', 'middle', gir(L, 0, 10) * .9, 2);
    if (L >= k0 - 4) { const q = backOut((L - k0 + 4) / 12); g += `<g transform="translate(900,700) scale(${f2(q)})"><path d="M0 60 V-60 M-30 -30 L0 -60 L30 -30" stroke="${ALV}" stroke-width="16" fill="none" stroke-linecap="round"/></g>`; }
    return g;
  },
  dikey(f, S, t) {
    const L = f - S.dikey.start;
    let g = `<circle cx="760" cy="1000" r="380" fill="url(#kor)"/>`;
    for (let k = 0; k < 6; k++) g += alev(840, 820 + k * 90, .55, t, k);
    g += koni(500, 1000, .95, 0, t * .006);
    const ya = gir(L, cue('dikey', 'yağ') - S.dikey.start - 4, 10);
    for (let k = 0; k < 6; k++) { const u = ((L / 20) + k / 6) % 1; g += damla(400 + k * 40, 1000 + u * 330, 1.1, ya * (1 - u)); }
    // bıçak ve dilimler
    const bi = cue('dikey', 'bıçak') - S.dikey.start;
    if (L >= bi - 4) {
      const bx = 330 + sin(L * .25) * 10, by = 900 + ((L - bi) * 6) % 260;
      g += `<g transform="translate(${f2(bx)},${f2(by)}) rotate(-80)"><path d="M0 0 L240 -10 L250 10 L0 20Z" fill="#E6E6E6" stroke="${KOM}" stroke-width="4"/><rect x="-110" y="-6" width="110" height="32" rx="10" fill="#5A3A22"/></g>`;
      for (let k = 0; k < 6; k++) { const u = klamp((L - bi - k * 8) / 26); if (u > 0) g += dilim(300 - u * 60 + k * 12, 1000 + u * 330 - k * 6, -20 + k * 8, .9); }
    }
    g += yazi('EŞİT ATEŞ', 540, 520, 120, ALV, 'middle', gir(L, cue('dikey', 'ateş') - S.dikey.start - 4, 10), 2);
    g += yazi('İNCE · ÇITIR', 540, 640, 110, HAR, 'middle', gir(L, cue('dikey', 'ince') - S.dikey.start - 4, 10), 2);
    return g;
  },
  isim(f, S, t) {
    const L = f - S.isim.start;
    const de = cue('isim', 'dönen') - S.isim.start, dn = cue('isim', 'döner') - S.isim.start;
    let g = koni(540, 1060, .6, 0, t * .01);
    g += yazi('DÖNEN ET', 540, 660, 200, KRM, 'middle', gir(L, de - 4, 8) * (1 - gir(L, dn - 2, 8)), 2);
    const q = backOut((L - dn + 2) / 12);
    if (L >= dn - 2) g += `<g transform="translate(540,640) scale(${f2(q)})">${yazi('DÖNER', 0, 0, 300, HAR, 'middle', 1, 4)}</g>`;
    return g;
  },
  kebap(f, S, t) {
    const L = f - S.kebap.start;
    let g = `<ellipse cx="540" cy="1100" rx="400" ry="150" fill="#EDE3D2" stroke="#C9BBA2" stroke-width="10"/><ellipse cx="540" cy="1090" rx="320" ry="110" fill="#F6EBD9"/>`;
    // pide küpleri
    for (let k = 0; k < 7; k++) g += `<rect x="${330 + k * 55}" y="${1080 + (k % 2) * 16}" width="56" height="40" rx="10" fill="#D9A55A" stroke="#9A6A2A" stroke-width="3"/>`;
    for (let k = 0; k < 9; k++) g += dilim(360 + k * 40, 1060 - (k % 3) * 10, -10 + k * 3, .9);
    // domates sosu
    g += `<path d="M330 1040 Q540 1000 760 1040" stroke="${KIR}" stroke-width="18" fill="none" stroke-linecap="round" opacity=".85"/>`;
    // tereyağı dökülür
    const te = cue('kebap', 'tereyağı') - S.kebap.start;
    if (L >= te - 6) { const u = klamp((L - te + 6) / 24); g += `<path d="M640 620 Q620 ${f2(700 + u * 160)} 560 ${f2(620 + u * 420)}" stroke="${HAR}" stroke-width="22" fill="none" stroke-linecap="round" stroke-dasharray="${f2(600 * u)} 900"/><path d="M600 560 h120 l-20 60 h-80Z" fill="#A8A8A8"/>`; }
    const yo = cue('kebap', 'yoğurtla') - S.kebap.start;
    if (L >= yo - 4) { const q = backOut((L - yo + 4) / 12); g += `<g transform="translate(780,1080) scale(${f2(q)})"><path d="M-70 10 C-80 -40 -30 -70 0 -60 C40 -70 80 -40 70 10Z" fill="#FFFFFF" stroke="#DDD" stroke-width="4"/></g>`; }
    g += yazi('İSKENDER', 540, 600, 200, HAR, 'middle', gir(L, cue('kebap', 'iskender') - S.kebap.start - 4, 10), 4);
    return g;
  },
  berlin(f, S, t) {
    const L = f - S.berlin.start;
    let g = '';
    // Berlin TV kulesi silueti
    g += `<g opacity="${f2(gir(L, cue('berlin', 'berlin') - S.berlin.start - 6, 14) * .9)}" fill="#3A302A"><rect x="836" y="500" width="28" height="900"/><circle cx="850" cy="760" r="70"/><rect x="845" y="380" width="10" height="140"/><rect x="700" y="1100" width="300" height="300"/><rect x="560" y="1200" width="160" height="200"/></g>`;
    g += yazi('ALMANYA', 540, 520, 150, KRM, 'middle', gir(L, 0, 12), 3);
    g += yazi('→ BERLİN', 540, 660, 130, HAR, 'middle', gir(L, cue('berlin', 'berlin') - S.berlin.start - 4, 10), 3);
    // ekmek arası
    const ek = cue('berlin', 'ekmeğin') - S.berlin.start;
    if (L >= ek - 6) {
      const q = backOut((L - ek + 6) / 14);
      g += `<g transform="translate(440,1100) rotate(-8) scale(${f2(q)})"><path d="M-260 0 Q-260 -150 0 -160 Q260 -150 260 0Z" fill="#E2B06A" stroke="#9A6A2A" stroke-width="6"/>`;
      for (let k = 0; k < 8; k++) g += dilim(-190 + k * 54, -40 + (k % 2) * 10, -10 + k * 4, .9);
      g += `<path d="M-230 -10 q30 -40 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0" stroke="#5FAE3A" stroke-width="16" fill="none"/><circle cx="-100" cy="-70" r="22" fill="${KIR}"/><circle cx="60" cy="-80" r="22" fill="${KIR}"/>`;
      g += `<path d="M-270 0 Q-270 110 0 120 Q270 110 270 0Z" fill="#E2B06A" stroke="#9A6A2A" stroke-width="6"/></g>`;
    }
    g += yazi('SOKAK LEZZETİ', 540, 1380, 90, ALV, 'middle', gir(L, cue('berlin', 'sokak') - S.berlin.start - 4, 10), 3);
    return g;
  },
  dunya(f, S, t) {
    const L = f - S.dunya.start;
    let g = `<g transform="translate(540,1000)"><circle r="300" fill="#24486B"/><path d="M-200 -120 q80 -60 160 -10 q60 40 20 100 q-60 60 -140 20Z M60 -220 q90 10 120 80 q-50 40 -100 10Z M60 60 q100 -20 160 60 q-40 110 -140 90Z" fill="#3E7A4A"/></g>`;
    for (let k = 0; k < 14; k++) {
      const a = rastgele(k) * P * 2, r = 120 + rastgele(k + 30) * 380, q = backOut((L - 10 - k * 4) / 12);
      if (q > 0) g += koni(540 + cos(a) * r, 1000 + sin(a) * r * .8, .1 * q, 0, t * .01 + k);
    }
    g += yazi('DÜNYANIN DÖRT', 540, 500, 120, KRM, 'middle', gir(L, 0, 12), 3) + yazi('BİR YANINDA', 540, 620, 120, HAR, 'middle', gir(L, 8, 12), 3);
    g += yazi('BURSA', 540, 1420, 110, ALV, 'middle', gir(L, cue('dunya', 'bursa') - S.dunya.start - 4, 10), 4);
    return g;
  },
  son(f, S, t) {
    const L = f - S.son.start;
    let g = yazi('HANGİ TARAFTASIN?', 540, 560, 120, KRM, 'middle', gir(L, 0, 10), 2);
    const ek = cue('son', 'ekmek') - S.son.start, po = cue('son', 'porsiyon') - S.son.start;
    const kart = (x, f0, ad, renk, ic) => { const q = backOut((L - f0 + 4) / 12); return L < f0 - 4 ? '' : `<g transform="translate(${x},1050) scale(${f2(q)})"><rect x="-210" y="-260" width="420" height="520" rx="30" fill="${renk}"/>${ic}<text class="bas" y="200" font-size="70" fill="${KOM}" text-anchor="middle" letter-spacing="2">${ad}</text></g>`; };
    const ekmek = `<path d="M-150 0 Q-150 -110 0 -116 Q150 -110 150 0Z" fill="#E2B06A" stroke="#9A6A2A" stroke-width="5"/>${[0, 1, 2, 3, 4].map(k => dilim(-110 + k * 55, -26, k * 5, .7)).join('')}<path d="M-160 0 Q-160 80 0 86 Q160 80 160 0Z" fill="#E2B06A" stroke="#9A6A2A" stroke-width="5"/>`;
    const porsiyon = `<ellipse cy="0" rx="170" ry="70" fill="#FFFFFF" stroke="#C9BBA2" stroke-width="6"/>${[0, 1, 2, 3, 4, 5].map(k => dilim(-100 + k * 40, -10 - (k % 2) * 8, k * 6, .7)).join('')}`;
    g += kart(290, ek, 'EKMEK ARASI', HAR, ekmek) + kart(790, po, 'PORSİYON', ALV, porsiyon);
    return g;
  },
};

window.renderFrame = function (f) {
  const S = T.seg, t = f, adlar = Object.keys(SAHNE);
  $('zemin').innerHTML = `<rect width="1080" height="1920" fill="${KOM}"/><rect width="1080" height="1920" fill="url(#gren)"/>`;
  let g = '';
  adlar.forEach((ad, i) => {
    const bas = i ? S[ad].start - 4 : 0, son = i + 1 < adlar.length ? S[adlar[i + 1]].start - 4 : T.total + 10;
    if (f < bas - 2 || f > son + 8) return;
    const o = (i ? klamp((f - bas) / 6) : 1) * (1 - klamp((f - son) / 6));
    const x = (1 - (i ? sm((f - bas) / 10) : 1)) * 80;
    g += `<g opacity="${f2(o)}" transform="translate(${f2(x)},0)">${SAHNE[ad](f, S, t)}</g>`;
  });
  $('sahne').innerHTML = g;
  $('ust').innerHTML = `<rect x="40" y="1470" width="1000" height="230" rx="10" fill="${KOM}" opacity=".8"/><rect x="40" y="1470" width="14" height="230" fill="${ALV}"/>`;
  altyazi(f, $('altyazi'));
};
</script>
</body>
</html>
