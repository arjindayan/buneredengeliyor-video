<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../engine/fonts/fonts.css">
<style>
  /* STİL KARTI: İstanbul sabahı. Şafak pembesi + Boğaz turkuazı + pekmez kahvesi + susam altını; simit maskotu, martı tepkici; Archivo. Bkz. style.md */
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#F6C9A8}
  svg{position:absolute;inset:0}
  #altyazi{position:absolute;left:60px;right:60px;top:1500px;text-align:center;font:800 70px/1.16 'Archivo';font-stretch:92%;color:#FFF5E6}
  .lbl{paint-order:stroke;stroke-linejoin:round;font-weight:800}
</style>
</head>
<body>
<svg viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <linearGradient id="gok" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6A7FC2"/><stop offset=".45" stop-color="#F29E9E"/><stop offset=".75" stop-color="#FFD3A0"/><stop offset="1" stop-color="#2A8A9A"/></linearGradient>
    <radialGradient id="simit" cx=".4" cy=".3" r=".8"><stop offset="0" stop-color="#D98A3A"/><stop offset=".6" stop-color="#A8561E"/><stop offset="1" stop-color="#6E3412"/></radialGradient>
    <linearGradient id="deniz" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3AA8B0"/><stop offset="1" stop-color="#1A5A70"/></linearGradient>
    <linearGradient id="altband" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A1408" stop-opacity="0"/><stop offset=".25" stop-color="#2A1408" stop-opacity=".88"/><stop offset="1" stop-color="#1A0C04" stop-opacity=".96"/></linearGradient>
  </defs>
  <g id="arka"></g><g id="sahne"></g><g id="ust"></g>
</svg>
<div id="altyazi"></div>
<script src="../../engine/lib.js"></script>
<script src="../../engine/tr.js"></script>
<script src="../../engine/vinyet.js"></script>
<script>
window.FONTS = ['800 70px Archivo', '400 40px Archivo'];
window.ETIKET_FONT = 'Archivo';
window.ALT = { soluk: 'rgba(255,245,230,.35)', aktif: '#FFC94A', normal: '#FFF5E6' };
const c = cue, INK = '#2A1408', SUS = '#F7E3A8', TUR = '#2A8A9A';
const L = (txt, x, y, f, f0, f1, s = 80, r = '#FFF5E6') => etiket(txt, x, y, f, f0, f1, s, r, 'middle', INK);

function simit(t, o = {}) {
  const r = 220, ic = 80;
  let g = `<path d="M${r} 0 A${r} ${r} 0 1 1 ${-r} 0 A${r} ${r} 0 1 1 ${r} 0Z M${ic} 0 A${ic} ${ic} 0 1 0 ${-ic} 0 A${ic} ${ic} 0 1 0 ${ic} 0Z" fill="${o.ham ? '#F2DDB8' : 'url(#simit)'}" fill-rule="evenodd" stroke="${INK}" stroke-width="8"/>`;
  // burgu çizgileri
  for (let k = 0; k < 14; k++) { const a = k * P / 7; g += `<path d="M${f2(cos(a) * (ic + 10))} ${f2(sin(a) * (ic + 10))} Q${f2(cos(a + .25) * 150)} ${f2(sin(a + .25) * 150)} ${f2(cos(a + .1) * (r - 10))} ${f2(sin(a + .1) * (r - 10))}" stroke="${INK}" stroke-width="4" fill="none" opacity=".25"/>`; }
  const sus = o.susam === undefined ? 1 : o.susam;
  for (let k = 0; k < 70 * sus; k++) { const a = rastgele(k) * 2 * P, rr = ic + 14 + rastgele(k + 70) * (r - ic - 28); g += `<ellipse cx="${f2(cos(a) * rr)}" cy="${f2(sin(a) * rr)}" rx="7" ry="4" fill="${SUS}" transform="rotate(${f2(rastgele(k + 9) * 180)} ${f2(cos(a) * rr)} ${f2(sin(a) * rr)})"/>`; }
  if (o.yuz !== false) g += yuz(0, -150, .6, t, { seed: o.seed || 0, sur: o.sur, kapali: o.kapali, uzgun: o.uzgun, cizgi: INK });
  return g;
}
function marti(x, y, s, t, yon = 1) {
  const k = sin(t * .25) * 20;
  return at(x, y, s, `<g transform="scale(${yon},1)"><path d="M0 0 C-60 ${f2(-40 - k)} -120 ${f2(-30 - k)} -170 ${f2(-10 - k)}" stroke="${INK}" stroke-width="8" fill="#fff"/><path d="M0 0 C60 ${f2(-40 - k)} 120 ${f2(-30 - k)} 170 ${f2(-10 - k)}" stroke="${INK}" stroke-width="8" fill="#fff"/><ellipse rx="60" ry="30" fill="#fff" stroke="${INK}" stroke-width="6"/><circle cx="50" cy="-16" r="26" fill="#fff" stroke="${INK}" stroke-width="6"/><path d="M72 -14 l30 6 -30 6Z" fill="#F2A21B"/><circle cx="56" cy="-22" r="5" fill="${INK}"/></g>`);
}
function defter(x, y, s, r, baslik, yil, satir = 7) {
  let g = `<rect x="-280" y="-340" width="560" height="680" rx="8" fill="#F2E2C2" stroke="${INK}" stroke-width="8"/><rect x="-250" y="-310" width="500" height="620" fill="none" stroke="#B8875A" stroke-width="4"/>`;
  g += `<text text-anchor="middle" y="-230" font-family="Archivo" font-weight="800" font-size="40" fill="${INK}">${baslik}</text><text text-anchor="middle" y="-160" font-family="Archivo" font-weight="800" font-size="64" fill="#B8462A">${yil}</text>`;
  for (let k = 0; k < satir; k++) g += `<path d="M-200 ${-90 + k * 52} q50 -14 100 0 t100 0 t100 0 t90 0" stroke="${INK}" stroke-width="5" fill="none" opacity=".35"/>`;
  return at(x, y, s, g, r);
}

const SAHNE = {
  hook(f, S, t) {
    let g = at(540, 1050, 1, simit(t, { seed: 1, sur: f >= c('hook', 'devlet') }));
    // mühür: fiyat etiketi
    if (f >= c('hook', 'fiyatını')) g += at(820, 760, pop(f, c('hook', 'fiyatını')), `<g transform="rotate(12)"><path d="M-140 -60 H100 L150 0 L100 60 H-140Z" fill="#FFD25A" stroke="${INK}" stroke-width="8"/><circle cx="100" r="12" fill="${INK}"/><text text-anchor="middle" x="-20" y="22" font-family="Archivo" font-weight="800" font-size="60" fill="${INK}">? akçe</text></g>`);
    if (f >= c('hook', 'devlet')) g += at(260, 760, pop(f, c('hook', 'devlet')), `<circle r="100" fill="none" stroke="#B8462A" stroke-width="10"/><circle r="80" fill="none" stroke="#B8462A" stroke-width="4"/><text text-anchor="middle" dy="16" font-family="Archivo" font-weight="800" font-size="40" fill="#B8462A">DEVLET</text>`, -12);
    g += L('500 yıl önce', 540, 560, f, c('hook', 'beş'), c('hook', 'fiyatını') - 2, 80, '#FFF5E6');
    return g;
  },
  s2(f, S, t) {
    let g = at(540, 1020, 1.1, simit(t, { seed: 2 }));
    g += marti(240 + sin(t * .02) * 40, 640, .7, t, 1);
    g += L('SİMİT', 540, 600, f, c('s2', 'simit'), S.s3.start - 2, 120, '#FFD25A');
    g += L('en eski sokak lezzeti', 540, 1380, f, c('s2', 'eski'), S.s3.start - 2, 64);
    return g;
  },
  s3(f, S, t) {
    let g = defter(540, 1000, 1, -3, 'ÜSKÜDAR KADI SİCİLİ', '1525');
    const p = gir(f, c('s3', 'üsküdar'), 20);
    g += `<ellipse cx="540" cy="1080" rx="${f2(200 * p)}" ry="${f2(60 * p)}" fill="none" stroke="#B8462A" stroke-width="10"/>`;
    g += at(540, 1080, p * .25, simit(t, { yuz: false }));
    g += L('en eski kayıt', 540, 560, f, c('s3', 'kayıtlardan'), S.s4.start - 2, 80, '#FFD25A');
    return g;
  },
  s4(f, S, t) {
    let g = '';
    // terazi: simit vs ağırlık; fiyat etiketi
    const eg = sin(t * .05) * 3;
    g += `<g transform="translate(540,1000)"><path d="M0 -200 V300" stroke="${INK}" stroke-width="16"/><path d="M-160 300 H160" stroke="${INK}" stroke-width="20" stroke-linecap="round"/><g transform="rotate(${f2(eg)} 0 -200)"><path d="M-320 -200 H320" stroke="${INK}" stroke-width="14" stroke-linecap="round"/><path d="M-320 -200 L-400 0 H-240Z M320 -200 L240 0 H400Z" fill="none" stroke="${INK}" stroke-width="5"/><path d="M-420 0 H-220 Q-320 60 -420 0Z M220 0 H420 Q320 60 220 0Z" fill="#C9A06A" stroke="${INK}" stroke-width="6"/>${at(-320, -50, .3, simit(t, { yuz: false }))}<rect x="270" y="-60" width="100" height="60" rx="8" fill="#7A7A8A" stroke="${INK}" stroke-width="6"/><text x="320" y="-18" text-anchor="middle" font-family="Archivo" font-weight="800" font-size="30" fill="#fff">DİRHEM</text></g></g>`;
    g += L('1640 · NARH', 540, 560, f, c('s4', '1640'), c('s4', 'ağırlığını') - 2, 84, '#FFD25A');
    g += L('ağırlık + fiyat', 540, 560, f, c('s4', 'ağırlığını'), S.s5.start - 2, 84, '#FFF5E6');
    return g;
  },
  s5(f, S, t) {
    let g = '';
    // hafif simit + fırıncı + ceza mühürü
    g += at(320, 1040, .7, simit(t, { seed: 3, uzgun: true }), 0, .9);
    g += at(760, 1060, 1, `<path d="M-140 300 C-150 140 -110 60 0 60 C110 60 150 140 140 300Z" fill="#F2F0E8" stroke="${INK}" stroke-width="8"/><circle cy="-40" r="110" fill="#F2D2B0" stroke="${INK}" stroke-width="8"/><path d="M-100 -110 C-90 -200 90 -200 100 -110Z" fill="#fff" stroke="${INK}" stroke-width="7"/><path d="M-50 40 q50 20 100 0" stroke="#4A3426" stroke-width="16" fill="none" stroke-linecap="round"/>` + yuz(0, -30, .55, t, { seed: 5, sur: f >= c('s5', 'ceza'), cizgi: INK }));
    if (f >= c('s5', 'ceza')) g += at(540, 700, pop(f, c('s5', 'ceza')), `<g transform="rotate(-8)"><rect x="-200" y="-80" width="400" height="160" rx="16" fill="none" stroke="#C8372D" stroke-width="12"/><text text-anchor="middle" dy="30" font-family="Archivo" font-weight="800" font-size="96" fill="#C8372D">CEZA</text></g>`);
    g += L('hafif = suç', 320, 1340, f, c('s5', 'hafif'), S.s6.start - 2, 64, '#FFD25A');
    return g;
  },
  s6(f, S, t) {
    let g = '';
    // üretim bandı: hamur halka → pekmez kasesi → susam → fırın → tabla
    const a = kf(f, [[0, 0], [c('s6', 'pekmeze'), 0], [c('s6', 'pekmeze') + 30, 1], [c('s6', 'susama'), 1], [c('s6', 'susama') + 30, 2], [c('s6', 'fırından'), 2], [c('s6', 'fırından') + 30, 3]]);
    const x = 180 + a * 240;
    g += `<ellipse cx="420" cy="1220" rx="140" ry="40" fill="#5A2A10" stroke="${INK}" stroke-width="6"/><text x="420" y="1320" text-anchor="middle" font-family="Archivo" font-weight="800" font-size="42" fill="#FFF5E6">pekmez</text>`;
    g += `<ellipse cx="660" cy="1220" rx="140" ry="40" fill="${SUS}" stroke="${INK}" stroke-width="6"/><text x="660" y="1320" text-anchor="middle" font-family="Archivo" font-weight="800" font-size="42" fill="#FFF5E6">susam</text>`;
    g += `<path d="M820 1260 V1060 a110 110 0 0 1 220 0 V1260Z" fill="#8A4A2A" stroke="${INK}" stroke-width="7"/><path d="M870 1260 V1110 a60 60 0 0 1 120 0 V1260Z" fill="#FF8A3A"/>`;
    g += at(x, 1060, .45, simit(t, { seed: 4, ham: a < 1, susam: klamp(a - 1), sur: a > 2.9 }));
    // tablaya dizilen simitler
    if (f >= c('s6', 'tablalarla')) { const p = pop(f, c('s6', 'tablalarla')); g += at(540, 720, p, `<ellipse rx="300" ry="70" fill="#C9A06A" stroke="${INK}" stroke-width="7"/>` + [-180, -60, 60, 180].map((xx, i) => at(xx, -20, .26, simit(t, { yuz: false }))).join('')); }
    return g;
  },
  s7(f, S, t) {
    let g = '';
    // simitçi: başında tabla, ses dalgaları
    g += `<g transform="translate(540,1180)"><path d="M-140 260 C-150 100 -110 30 0 30 C110 30 150 100 140 260Z" fill="#4A6A9A" stroke="${INK}" stroke-width="8"/><circle cy="-70" r="110" fill="#F2D2B0" stroke="${INK}" stroke-width="8"/><path d="M-50 -20 q50 20 100 0" stroke="#4A3426" stroke-width="14" fill="none" stroke-linecap="round"/>${yuz(0, -70, .55, t, { seed: 6, sur: f >= c('s7', 'taze') && f < c('s7', 'taze') + 40, cizgi: INK })}`;
    g += `<g transform="translate(0,-200) rotate(${f2(sin(t * .06) * 3)})"><ellipse rx="320" ry="60" fill="#C9A06A" stroke="${INK}" stroke-width="7"/>${[-220, -110, 0, 110, 220].map((xx, i) => at(xx, -30 - (i % 2) * 20, .24, simit(t, { yuz: false }))).join('')}</g></g>`;
    if (f >= c('s7', 'taze')) { for (let k = 0; k < 3; k++) { const u = ((f - c('s7', 'taze')) * .03 + k / 3) % 1; g += `<path d="M${f2(700 + u * 200)} ${f2(1080 - u * 80)} q30 -60 0 -120" stroke="#FFF5E6" stroke-width="10" fill="none" opacity="${f2(1 - u)}" stroke-linecap="round"/>`; } g += at(800, 820, pop(f, c('s7', 'taze')), `<path d="M-220 -70 h440 v130 h-300 l-40 40 v-40 h-100Z" fill="#FFF5E6" stroke="${INK}" stroke-width="7"/><text text-anchor="middle" y="16" font-family="Archivo" font-weight="800" font-size="62" fill="#B8462A">TAZE SİMİT!</text>`); }
    g += L('sabah alarmı', 300, 620, f, c('s7', 'alarmı'), S.s8.start - 2, 72, '#FFD25A');
    return g;
  },
  s8(f, S, t) {
    let g = `<rect y="1180" width="1080" height="300" fill="url(#deniz)"/>`;
    for (let k = 0; k < 5; k++) g += `<path d="M${f2((t * 2 + k * 260) % 1300 - 120)} ${1220 + k * 40} q30 -14 60 0 t60 0" stroke="#BFF0F0" stroke-width="6" fill="none" opacity=".7"/>`;
    // vapur
    g += at(560 + sin(t * .01) * 20, 1150, 1, `<path d="M-300 0 H300 L250 90 H-260Z" fill="#F2F0E8" stroke="${INK}" stroke-width="8"/><rect x="-220" y="-110" width="400" height="110" fill="#F2F0E8" stroke="${INK}" stroke-width="7"/>${[0, 1, 2, 3, 4].map(i => `<rect x="${-200 + i * 76}" y="-90" width="50" height="50" rx="8" fill="#7FC6D0" stroke="${INK}" stroke-width="4"/>`).join('')}<rect x="-40" y="-230" width="70" height="120" fill="#E8C24A" stroke="${INK}" stroke-width="7"/><rect x="-40" y="-230" width="70" height="30" fill="${INK}"/>`);
    // martı simit kapıyor
    const u = gir(f, c('s8', 'martılara'), 40);
    g += marti(840 - u * 200, 700 + u * 120, .7, t, -1);
    if (u > 0) g += at(840 - u * 120, 900 - u * 80, .18, simit(t, { yuz: false }), t * 4);
    if (f >= c('s8', 'çayın')) g += at(200, 760, pop(f, c('s8', 'çayın')) * .8, `<path d="M-40 -110 C-40 -60 -14 -40 -18 -8 C-22 22 -44 46 -40 84 H40 C44 46 22 22 18 -8 C14 -40 40 -60 40 -110Z" fill="#C8402A" stroke="${INK}" stroke-width="6"/><ellipse cy="92" rx="90" ry="16" fill="#F2F0E8" stroke="${INK}" stroke-width="5"/>`);
    g += L('en ucuz kahvaltı', 540, 560, f, c('s8', 'ucuz'), S.s9.start - 2, 80, '#FFD25A');
    return g;
  },
  s9(f, S, t) {
    // iki simit: 1525 ve bugün, eşittir
    let g = at(290, 1020, .55, simit(t, { seed: 7 }));
    g += at(790, 1020, .55, simit(t, { seed: 8 }));
    g += `<text x="290" y="1260" text-anchor="middle" font-family="Archivo" font-weight="800" font-size="60" fill="#FFF5E6">1525</text><text x="790" y="1260" text-anchor="middle" font-family="Archivo" font-weight="800" font-size="60" fill="#FFF5E6">bugün</text>`;
    if (f >= c('s9', 'hiç')) g += at(540, 1020, pop(f, c('s9', 'hiç')), `<text text-anchor="middle" dy="40" font-family="Archivo" font-weight="800" font-size="160" fill="#FFD25A" stroke="${INK}" stroke-width="10" class="lbl">=</text>`);
    return g;
  },
  son(f, S, t) {
    let g = at(540, 1040, 1, simit(t, { seed: 9, kapali: f > T.total - 24 }));
    if (f >= c('son', 'peynirle')) g += at(220, 760, pop(f, c('son', 'peynirle')), `<path d="M-110 40 L110 40 L80 -60 L-110 -20Z" fill="#FFF6D6" stroke="${INK}" stroke-width="7"/><circle cx="-40" cy="10" r="14" fill="#F2E2A8"/><circle cx="30" cy="-10" r="10" fill="#F2E2A8"/>`);
    if (f >= c('son', 'çayla')) g += at(860, 760, pop(f, c('son', 'çayla')), `<path d="M-40 -110 C-40 -60 -14 -40 -18 -8 C-22 22 -44 46 -40 84 H40 C44 46 22 22 18 -8 C14 -40 40 -60 40 -110Z" fill="#C8402A" stroke="${INK}" stroke-width="6"/><ellipse cy="92" rx="90" ry="16" fill="#F2F0E8" stroke="${INK}" stroke-width="5"/>`);
    return g;
  },
};

window.renderFrame = function (f) {
  let a = `<rect width="1080" height="1920" fill="url(#gok)"/>`;
  a += `<circle cx="820" cy="640" r="${f2(90 + sin(f * .02) * 4)}" fill="#FFE8B0" opacity=".85"/>`;
  // İstanbul silueti: kubbeler + minareler + Galata
  let d = 'M-20 1300 V1180';
  [[60, 60], [220, 110], [400, 80], [600, 130], [820, 90], [980, 70]].forEach(([x, r]) => { d += ` L${x - r} 1180 A${r} ${r} 0 0 1 ${x + r} 1180`; });
  d += ' L1100 1180 V1300Z';
  a += `<path d="${d}" fill="#8A5A7A" opacity=".55"/>`;
  [[140, 260], [320, 300], [700, 320], [900, 280]].forEach(([x, h]) => { a += `<path d="M${x - 10} 1180 V${1180 - h} L${x} ${1150 - h} L${x + 10} ${1180 - h} V1180Z" fill="#8A5A7A" opacity=".55"/>`; });
  a += `<path d="M500 1180 V900 H560 V1180Z M490 900 L530 820 L570 900Z" fill="#7A4A6A" opacity=".6"/>`;
  a += `<rect y="1180" width="1080" height="740" fill="url(#deniz)" opacity=".9"/>`;
  $('arka').innerHTML = a;
  vinyetler(f, SAHNE, $('sahne'));
  $('ust').innerHTML = `<rect y="1420" width="1080" height="500" fill="url(#altband)"/>`;
  altyazi(f, $('altyazi'));
};
</script>
</body>
</html>
