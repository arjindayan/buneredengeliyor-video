<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../engine/fonts/fonts.css">
<style>
  /* STİL KARTI: ECG monitörü / fosfor CRT; yalnız Arjin paleti + beyaz. Bkz. style.md */
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#28301C}
  #zemin{position:absolute;inset:0;width:1080px;height:1920px}
  svg{position:absolute;inset:0}
  #alt{position:absolute;left:70px;right:70px;top:120px;font:600 56px/1.3 'IBM Plex Mono';color:#D2CF9A;text-align:center}
  #alt span{padding:0 6px;border-radius:4px}
  .vt{font-family:'VT323'}
  .pm{font-family:'IBM Plex Mono';font-weight:600}
</style>
</head>
<body>
<img id="zemin" src="img/bg.jpg">
<svg viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <filter id="parilti" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="izgara" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0 H0 V60" fill="none" stroke="#9A7E3B" stroke-width="1.5" opacity=".35"/></pattern>
    <pattern id="tarama" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.6" fill="#28301C" opacity=".35"/></pattern>
    <g id="clips"></g>
  </defs>
  <g id="sahne"></g><g id="ust"></g>
  <rect width="1080" height="1920" fill="url(#tarama)" pointer-events="none"/>
</svg>
<div id="alt"></div>
<script src="../../engine/lib.js"></script>
<script src="../../engine/cute.js"></script>
<script src="../../engine/vinyet.js"></script>
<script>
window.FONTS = ['400 60px VT323', '600 60px "IBM Plex Mono"'];
const INK = '#28301C', GREEN = '#323D25', GOLD = '#9A7E3B', KHAKI = '#D2CF9A', WHITE = '#FFFFFF';
const c = cue, ac = (f, f0, d = 8) => f < f0 ? 0 : klamp((f - f0) / d);
const yazi = (txt, x, y, s, o = {}) => `<text x="${f2(x)}" y="${f2(y)}" class="${o.cls || 'vt'}" font-size="${s}" fill="${o.renk || KHAKI}" text-anchor="${o.a || 'middle'}" letter-spacing="${o.ls || 0}" opacity="${f2(o.op ?? 1)}">${txt}</text>`;
const kazi = (f, f0, ic, x = 540, y = 960, d = 8) => f < f0 ? '' : `<g opacity="${f2(ac(f, f0, d * .6))}" transform="translate(${x},${y}) scale(${(1 + .05 * (1 - EASE.dolly(ac(f, f0, d)))).toFixed(3)}) translate(${-x},${-y})">${ic}</g>`;
const yaz = (f, f0, txt, x, y, s, o = {}) => { const n = Math.min(txt.length, Math.floor((f - f0) * (o.hiz || 1.2))); return f < f0 ? '' : yazi(txt.slice(0, n) + (n < txt.length && f % 8 < 4 ? '_' : ''), x, y, s, o); };
const levha = (f, f0, txt, x, y, s = 80) => f < f0 ? '' : kazi(f, f0, `<rect x="${f2(x - txt.length * s * .3 - 44)}" y="${f2(y - s * .7)}" width="${f2(txt.length * s * .6 + 88)}" height="${f2(s * 1.1)}" rx="8" fill="${KHAKI}"/>` + yazi(txt, x, y + s * .16, s, { renk: INK, ls: 4 }), x, y);

// kalp atışı: beat listesi bir kez kurulur (mutlak kareler)
let BEATS = null;
function kur() {
  const fl0 = c('hook', 'stop'), fl1 = c('hook', 'sneeze') + 26, land = c('beat', 'land'), thump = c('beat', 'thumps');
  BEATS = []; let t = 14, amp = 1, gec = false;
  while (t < T.total + 60) {
    if (t >= fl0 && t < fl1) { t = fl1; continue; }
    BEATS.push({ t, a: amp }); amp = 1;
    let d = 28;
    if (!gec && t >= land - 6) { d = 40; gec = 'bekle'; }
    else if (gec === 'bekle') { amp = 1.9; d = 24; gec = true; }
    t += d;
  }
}
// tek vuruş: P dalgası, QRS dikeni, T dalgası (dt kare cinsinden vuruştan beri)
function darbe(dt, a) {
  if (dt < -8 || dt > 22) return 0;
  const g = (m, s, h) => h * Math.exp(-((dt - m) ** 2) / (2 * s * s));
  return g(-5, 1.8, .12 * a) + g(0, .7, 1 * a) - g(1.6, .8, .22 * a) + g(10, 2.6, .2 * a);
}
const sinyal = fr => { let v = 0; for (const b of BEATS) { const dt = fr - b.t; if (dt > -9 && dt < 23) v += darbe(dt, b.a); } return v; };
// monitör: ekran çerçevesi, ızgara, süpüren iz. y0 = ekranın üstü, h = yüksekliği
function monitor(f, o = {}) {
  const x0 = 60, w = 960, y0 = o.y0 ?? 540, h = o.h ?? 760, mid = y0 + h * .55, genlik = h * .3, hiz = 6, uz = 880;
  let g = `<rect x="${x0 - 14}" y="${y0 - 14}" width="${w + 28}" height="${h + 28}" rx="34" fill="${INK}" stroke="${GOLD}" stroke-width="8"/><rect x="${x0}" y="${y0}" width="${w}" height="${h}" rx="22" fill="${GREEN}"/><rect x="${x0}" y="${y0}" width="${w}" height="${h}" rx="22" fill="url(#izgara)"/>`;
  const hx = ((f * hiz) % uz), pts = []; let d = '';
  for (let x = 0; x <= uz; x += 6) {
    const gec = (hx - x + uz) % uz; if (gec < 70 || gec > uz - 2) { d += ''; pts.push(null); continue; }
    const fr = f - gec / hiz; pts.push([x0 + 40 + x, mid - genlik * sinyal(fr)]);
  }
  let seg = '', acik = false;
  pts.forEach(p => { if (!p) { acik = false; return; } seg += `${acik ? 'L' : 'M'}${f2(p[0])} ${f2(p[1])} `; acik = true; });
  g += `<path d="${seg}" fill="none" stroke="${KHAKI}" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" filter="url(#parilti)"/><path d="${seg}" fill="none" stroke="${WHITE}" stroke-width="2.5" stroke-linejoin="round" opacity=".7"/>`;
  const hy = mid - genlik * sinyal(f); g += `<circle cx="${x0 + 40 + hx}" cy="${f2(hy)}" r="9" fill="${WHITE}" filter="url(#parilti)"/>`;
  return g + `<g>${o.durum || ''}</g>`;
}
const durum = (sol, sag, y) => yazi(sol, 110, y, 52, { a: 'start' }) + yazi(sag, 970, y, 52, { a: 'end', renk: WHITE });

const SAHNE = {
  hook(f) {
    const sn = c('hook', 'sneeze'), st = c('hook', 'stop'), bl = c('hook', 'bless');
    const duz = f >= st && f < sn + 26, jit = f >= sn && f < sn + 8 ? 8 * sin(f * 3) : 0;
    let g = `<g transform="translate(${f2(jit)},0)">${monitor(f, { durum: durum('HEART RATE', duz ? 'BPM --' : 'BPM 66', 1250) })}</g>`;
    g += kazi(f, c('hook', 'heart'), yazi('DOES IT STOP?', 540, 470, 110, { ls: 4 }), 540, 440);
    if (duz && f >= st + 6) g += yazi('FLATLINE?', 540, 800, 120, { renk: WHITE, op: .5 + .5 * sin(f * .5) });
    if (f >= sn && f < sn + 22) g += `<g transform="translate(540,760) rotate(-6) scale(${(1 + .3 * (1 - EASE.dolly(ac(f, sn, 6)))).toFixed(3)})"><rect x="-330" y="-100" width="660" height="150" fill="${KHAKI}"/>${yazi('AH-CHOO!', 0, 28, 130, { renk: INK, ls: 4 })}</g>`;
    g += kazi(f, bl, yazi('"BLESS YOU"', 540, 1560, 130, { renk: WHITE }), 540, 1530);
    return `<g transform="translate(0,110)">${g}</g>`;
  },
  beat(f) {
    const dn = c('beat', 'doesn\'t'), pr = c('beat', 'pressure'), la = c('beat', 'land'), th = c('beat', 'thumps'), sk = c('beat', 'skip');
    const bas = ac(f, pr, 30), bar = 640 * bas;
    let g = monitor(f, { durum: durum('HEART RATE', 'BPM 66', 1250) });
    g += kazi(f, dn, yazi('STILL BEATING', 540, 470, 110, { ls: 4 }), 540, 440);
    g += yazi('CHEST PRESSURE', 110, 1400, 50, { a: 'start', renk: GOLD }) + `<rect x="110" y="1430" width="860" height="60" fill="none" stroke="${GOLD}" stroke-width="6"/><rect x="116" y="1436" width="${f2(Math.max(0, 848 * bas))}" height="48" fill="${KHAKI}"/>`;
    g += kazi(f, la, yazi('LATE', 300, 1180, 90, { renk: WHITE }), 300, 1160) + kazi(f, th, yazi('THUMP!', 800, 1180, 90, { renk: WHITE }), 800, 1160);
    g += kazi(f, sk, `<rect x="140" y="1590" width="800" height="130" fill="${KHAKI}"/>` + yazi('THE "SKIP" YOU FEEL', 540, 1680, 80, { renk: INK, ls: 2 }), 540, 1650);
    return `<g transform="translate(0,110)">${g}</g>`;
  },
  pope(f) {
    const pl = c('pope', 'plague'), go = c('pope', 'gregory'), yr = c('pope', '590'), hi = c('pope', 'historians'), sto = c('pope', 'story', 1);
    let g = `<rect x="80" y="520" width="920" height="900" rx="24" fill="${GREEN}" stroke="${GOLD}" stroke-width="8"/><rect x="80" y="520" width="920" height="900" rx="24" fill="url(#izgara)"/>`;
    g += yazi('> archive.log', 130, 610, 54, { a: 'start', renk: GOLD });
    g += yaz(f, go - 4, '> POPE GREGORY I', 130, 720, 66, { a: 'start', hiz: 1.4 });
    g += yaz(f, pl - 6, '> PLAGUE IN ROME', 130, 810, 66, { a: 'start', hiz: 1.4 });
    g += kazi(f, yr, yazi('590', 540, 1130, 280, { renk: WHITE }), 540, 1050);
    if (f >= hi) g += `<g transform="translate(540,1250) rotate(-7) scale(${(1 + .3 * (1 - EASE.dolly(ac(f, hi, 6)))).toFixed(3)})"><rect x="-370" y="-80" width="740" height="130" fill="${KHAKI}"/>${yazi('DOUBTED BY HISTORIANS', 0, 14, 70, { renk: INK })}</g>`;
    g += f >= sto ? `<path d="M130 1130 H950" stroke="${WHITE}" stroke-width="0" />` : '';
    return g;
  },
  soul(f) {
    const ar = c('soul', 'around'), so = c('soul', 'soul'), br = c('soul', 'breath'), sn = c('soul', 'sneeze'), th = c('soul', 'throw'), ev = c('soul', 'evil');
    const gx = 460, gy = 1060;
    let g = kazi(f, ar, yazi('c. 750 AD', 540, 560, 130, { renk: WHITE }), 540, 520);
    // kafa profili: daire + boyun
    g += `<circle cx="${gx}" cy="${gy}" r="240" fill="${GREEN}" stroke="${GOLD}" stroke-width="10"/><path d="M400 1290 V1420 M520 1290 V1420" stroke="${GOLD}" stroke-width="10"/><path d="M${gx + 236} ${gy - 40} L${gx + 300} ${gy + 30} L${gx + 236} ${gy + 50}" fill="none" stroke="${GOLD}" stroke-width="10" stroke-linejoin="round"/>`;
    // ruh: nefes gibi parlayan küre
    const cik = EASE.dolly(ac(f, th, 20)), don = EASE.dolly(ac(f, ev + 40, 24));
    let sx = gx - 20 + 450 * cik, sy = gy - 20 - 360 * sin(P * klamp(cik)) * .4;
    if (f >= so) { const o = klamp(ac(f, so, 8)) * (f >= th + 20 ? 1 - ac(f, ev - 20, 10) : 1); g += `<g opacity="${f2(o)}"><circle cx="${f2(sx)}" cy="${f2(sy)}" r="${f2(46 + 6 * sin(f * .2))}" fill="${WHITE}" filter="url(#parilti)"/>${[0, 1, 2].map(k => `<path d="M${f2(sx - 40 - k * 30)} ${f2(sy + (k - 1) * 14)} q-20 -10 -40 0" fill="none" stroke="${KHAKI}" stroke-width="5" opacity="${f2(f >= br ? .8 : 0)}"/>`).join('')}</g>`; }
    if (f >= sn && f < sn + 16) for (let k = 0; k < 7; k++) { const a = -.7 + k * .23, u = ac(f, sn, 14); g += `<path d="M${f2(gx + 330 + 40 * u)} ${f2(gy + 40 + 240 * sin(a) * u)} l${f2(60 * cos(a))} ${f2(60 * sin(a))}" stroke="${KHAKI}" stroke-width="8" stroke-linecap="round" opacity="${f2(1 - u)}"/>`; }
    // kötü ruh: dikenli gölge içeri girer
    if (f >= ev) { const u = EASE.dolly(ac(f, ev, 24)), ex = 1000 - 540 * u, ey = gy + 30; let d = ''; for (let k = 0; k < 16; k++) { const a = k * 22.5 * P / 180, r = k % 2 ? 40 : 76; d += `${k ? 'L' : 'M'}${f2(ex + r * cos(a))} ${f2(ey + r * sin(a))}`; } g += `<path d="${d}Z" fill="${GOLD}" stroke="${INK}" stroke-width="4"/>`; }
    g += kazi(f, br, yazi('SOUL = BREATH OF AIR', 540, 1600, 62, { ls: 2 }), 540, 1580);
    g += kazi(f, th, yazi('SNEEZE → SOUL OUT / EVIL IN', 540, 1700, 50, { renk: WHITE }), 540, 1680);
    return g;
  },
  shield(f) {
    const sh = c('shield', 'shield'), se = c('shield', 'second');
    let g = kazi(f, c('shield', 'bless'), `<path d="M540 560 C660 640 800 650 860 640 C870 960 820 1260 540 1420 C260 1260 210 960 220 640 C280 650 420 640 540 560Z" fill="${GREEN}" stroke="${KHAKI}" stroke-width="14"/><path d="M540 620 C640 690 760 700 810 692 C818 960 774 1210 540 1352 C306 1210 262 960 270 692 C320 700 440 690 540 620Z" fill="url(#izgara)" stroke="${GOLD}" stroke-width="5"/>` + yazi('BLESS', 540, 960, 170, { renk: WHITE }) + yazi('YOU', 540, 1100, 170, { renk: WHITE }), 540, 960, 12);
    if (f >= sh) g += kazi(f, sh, yazi('TINY SHIELD', 540, 500, 100, { ls: 6 }), 540, 480);
    if (f >= se) { const t = ((f - se) / 30).toFixed(2); g += kazi(f, se, yazi('< 1 SEC', 540, 1620, 150, { renk: KHAKI }) , 540, 1580); }
    return g;
  },
  today(f) {
    const no = c('today', 'nobody'), st = c('today', 'still'), ol = c('today', 'old'), ma = c('today', 'manners');
    const u = EASE.kalem(ac(f, no, ma - no + 20));
    let g = yazi('750 AD', 140, 1150, 70, { a: 'middle', renk: WHITE }) + yazi('TODAY', 940, 1150, 70, { a: 'middle', renk: WHITE });
    g += `<path d="M140 1010 H940" stroke="${GOLD}" stroke-width="8"/><path d="M140 1010 H${f2(140 + 800 * u)}" stroke="${KHAKI}" stroke-width="12" stroke-linecap="round" filter="url(#parilti)"/>`;
    for (let k = 0; k <= 8; k++) g += `<path d="M${140 + k * 100} 990 V1030" stroke="${GOLD}" stroke-width="5"/>`;
    g += `<circle cx="${f2(140 + 800 * u)}" cy="1010" r="22" fill="${WHITE}" filter="url(#parilti)"/>`;
    g += kazi(f, no, yazi('1,200+ YEARS', 540, 640, 150, { renk: WHITE }), 540, 600);
    g += kazi(f, st, yazi('STILL SAYING IT', 540, 800, 80, { ls: 3 }), 540, 780);
    g += kazi(f, ol, `<rect x="110" y="1340" width="860" height="130" fill="${KHAKI}"/>` + yazi('OLD FEAR → GOOD MANNERS', 540, 1430, 74, { renk: INK, ls: 2 }), 540, 1400);
    return g;
  },
  son(f) {
    const nt = c('son', 'saving'), li = c('son', 'like'), fo = c('son', 'follow');
    let g = `<g transform="translate(540,780) scale(.62) translate(-540,-780)">${monitor(f, { y0: 380, h: 760 })}</g>`;
    g += kazi(f, nt, yazi('NOT SAVING THEIR HEART', 540, 1290, 70, { ls: 2 }), 540, 1270);
    g += levha(f, li, 'LIKE', 540, 1500, 100) + levha(f, fo, 'FOLLOW', 540, 1700, 100);
    return g;
  },
};
const SIRA = Object.keys(SAHNE);
const aralik = ad => { const i = SIRA.indexOf(ad), b = a => a === 'hook' ? 0 : T.seg[a].start - 10; return [b(ad), SIRA[i + 1] ? b(SIRA[i + 1]) : T.total + 30]; };
const W = 14;
window.renderFrame = function (f) {
  if (!BEATS) kur();
  let g = '', clip = '', ust = '';
  SIRA.forEach((ad, i) => {
    const [b, s] = aralik(ad);
    if (f < b || f > s + W) return;
    // geçiş: tarama çubuğu yukarıdan aşağı süpürür; arkasında yeni sahne açılır
    const ui = i ? EASE.kalem(klamp((f - b) / W)) : 1, uo = EASE.kalem(klamp((f - s) / W));
    if (ui - uo <= 0) return;
    clip += `<clipPath id="c${i}"><rect x="0" y="${f2(1920 * uo)}" width="1080" height="${f2(1920 * (ui - uo))}"/></clipPath>`;
    g += `<g clip-path="url(#c${i})">${SAHNE[ad](f)}</g>`;
    if (i && ui > 0 && ui < 1) ust += `<rect x="0" y="${f2(1920 * ui - 30)}" width="1080" height="60" fill="${KHAKI}" opacity=".35" filter="url(#parilti)"/><rect x="0" y="${f2(1920 * ui - 4)}" width="1080" height="8" fill="${WHITE}" opacity=".85"/>`;
  });
  $('clips').innerHTML = clip; $('sahne').innerHTML = g; $('ust').innerHTML = ust;
  altyazi9(f, $('alt'));
};
function altyazi9(f, el) {
  const cp = T.caption(f), tt = f / FPS;
  if (!cp || tt > T.timing.voice_end + .3) { el.innerHTML = ''; return; }
  const seg = T.timing.words.find(y => y.start >= cp.start - 0.01).seg;
  const ws = T.timing.words.filter(x => x.start >= cp.start - 0.01 && x.start < cp.end && x.seg === seg);
  let i = 0;
  el.innerHTML = cp.lines.map(line => line.split(' ').map(() => {
    const x = ws[i++]; if (!x) return '';
    const st = tt < x.start ? 'opacity:.4' : tt < x.end + 0.05 ? `background:${KHAKI};color:${INK}` : '';
    return `<span style="${st}">${x.w}</span>`;
  }).join(' ')).join('<br>');
}
</script>
</body>
</html>
