<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../engine/fonts/fonts.css">
<style>
  /* STİL KARTI: canlı fotoğraf stüdyosu, sevimli Viktorya dönemi poz veren karakter + tepki veren kutu kamera, plan modu ağız şeması */
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#FFB547}
  svg{position:absolute;inset:0}
  #alt-w{position:absolute;left:0;right:0;top:100px;display:flex;justify-content:center}
  #alt{display:inline-block;max-width:940px;font:500 62px/1.22 'Fredoka';color:#FFFFFF;text-align:center;background:rgba(8,14,40,.84);border-radius:56px;padding:26px 48px 30px}
  .is{font-family:'Fredoka';font-weight:600}
  .px{font-family:'Fredoka';font-weight:500}
</style>
</head>
<body>
<svg viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <filter id="bulanik"><feGaussianBlur stdDeviation="9"/></filter>
    <g id="clips"></g>
  </defs>
  <g id="sahne"></g><g id="ust"></g>
</svg>
<div id="alt-w"><div id="alt"></div></div>
<script src="../../engine/lib.js"></script>
<script src="../../engine/cute.js"></script>
<script src="../../engine/vinyet.js"></script>
<script>
window.FONTS = ['600 60px "Fredoka"', '500 60px "Fredoka"'];
const INK = '#1B2340', CORAL = '#FF6B5E', GOLD = '#FFC94A', KHAKI = '#FFF3DC', WHITE = '#FFFFFF', TEAL = '#1E9E9A', PURP = '#7B5CFF', PINK = '#FF9E9E', SKIN = '#FFD9B8', SEPIA = '#C99A66', XR = '#8FD3FF';
const c = cue, ac = (f, f0, d = 8) => f < f0 ? 0 : klamp((f - f0) / d);
const yazi = (txt, x, y, s, o = {}) => `<text x="${f2(x)}" y="${f2(y)}" class="${o.cls || 'is'}" font-size="${s}" fill="${o.renk || KHAKI}" text-anchor="${o.a || 'middle'}" letter-spacing="${o.ls ?? 1}" opacity="${f2(o.op ?? 1)}" ${o.st ? `stroke="${o.st}" stroke-width="${s * .14}" paint-order="stroke" stroke-linejoin="round"` : ''}>${txt}</text>`;
const kazi = (f, f0, ic, x = 540, y = 960, d = 8) => f < f0 ? '' : `<g opacity="${f2(ac(f, f0, d * .6))}" transform="translate(${x},${y}) scale(${(1 + .06 * (1 - EASE.dolly(ac(f, f0, d)))).toFixed(3)}) translate(${-x},${-y})">${ic}</g>`;
const zip = (f, f0, ic, x, y) => f < f0 ? '' : `<g transform="translate(${x},${y}) scale(${backOut((f - f0) / 12).toFixed(3)}) translate(${-x},${-y})">${ic}</g>`;
const plaka = (f, f0, txt, x, y, s = 84, renk = GOLD, yr = INK, rot = 0) => f < f0 ? '' : zip(f, f0, `<g transform="rotate(${rot} ${x} ${y})"><rect x="${f2(x - txt.length * s * .27 - 40)}" y="${f2(y - s * .82)}" width="${f2(txt.length * s * .54 + 80)}" height="${f2(s * 1.15)}" rx="${s * .3}" fill="${renk}" stroke="${INK}" stroke-width="8"/>${yazi(txt, x, y + s * .06, s, { renk: yr, ls: 2 })}</g>`, x, y);
const strike = (f, f0, x0, y0, x1, y1) => f < f0 ? '' : `<path d="M${x0} ${y0} L${f2(x0 + (x1 - x0) * EASE.dolly(ac(f, f0, 8)))} ${f2(y0 + (y1 - y0) * EASE.dolly(ac(f, f0, 8)))}" stroke="${CORAL}" stroke-width="22" stroke-linecap="round"/>`;

// ---- ortak arka plan: sıcak stüdyo duvarı (ışınlar), perde, zemin, sağ üstte flaş lambası (iris merkezi) ----
function bg(f, ton = 0) {
  const A = [['#FFB547', '#FF8A3D'], ['#7FD3FF', '#3FA1E8'], ['#FF9EC7', '#FF6FA5'], ['#B6F07A', '#5FCB5A']][ton];
  let g = `<defs><radialGradient id="bg${ton}" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="${A[0]}"/><stop offset="1" stop-color="${A[1]}"/></radialGradient></defs><rect width="1080" height="1920" fill="url(#bg${ton})"/>`;
  let r = ''; for (let k = 0; k < 18; k++) { const a = k * P / 9 + f * .004; r += `M540 900 L${f2(540 + 1800 * cos(a))} ${f2(900 + 1800 * sin(a))} L${f2(540 + 1800 * cos(a + .09))} ${f2(900 + 1800 * sin(a + .09))}Z`; }
  g += `<path d="${r}" fill="${WHITE}" opacity=".10"/>`;
  g += `<path d="M0 0 H150 Q120 700 170 1500 H0Z" fill="${CORAL}"/><path d="M1080 0 H930 Q960 700 910 1500 H1080Z" fill="${CORAL}"/><path d="M60 0 Q40 700 80 1500 M1020 0 Q1040 700 1000 1500" stroke="${INK}" stroke-width="6" opacity=".25" fill="none"/>`;
  g += `<path d="M0 1500 Q540 1440 1080 1500 V1920 H0Z" fill="${TEAL}"/><path d="M0 1560 Q540 1510 1080 1560" stroke="${WHITE}" stroke-width="6" opacity=".25" fill="none"/>`;
  return g;
}
const flash = (f, burst) => burst > 0 ? `<rect width="1080" height="1920" fill="${WHITE}" opacity="${f2(.85 * (1 - burst))}"/>` : '';

// ---- ağız tipleri ----
function agiz(m) {
  if (m === 'flat') return `<path d="M-34 0 H34" stroke="${INK}" stroke-width="9" stroke-linecap="round"/>`;
  if (m === 'small') return `<path d="M-14 0 H14" stroke="${INK}" stroke-width="9" stroke-linecap="round"/>`;
  if (m === 'o') return `<circle r="13" fill="${INK}"/><circle r="6" fill="#C2465A"/>`;
  if (m === 'grin') return `<path d="M-62 -10 Q0 90 62 -10Z" fill="${INK}"/><path d="M-54 -6 H54 Q50 14 40 16 H-40 Q-50 14 -54 -6Z" fill="${WHITE}"/><path d="M-26 50 Q0 62 26 50 Q0 40 -26 50Z" fill="${CORAL}"/>`;
  if (m === 'ch') return `<rect x="-36" y="-12" width="72" height="32" rx="16" fill="${INK}"/><rect x="-30" y="-8" width="60" height="12" rx="4" fill="${WHITE}"/>`;
  if (m === 'ee') return `<path d="M-70 -8 Q0 46 70 -8 Q0 12 -70 -8Z" fill="${INK}"/><path d="M-60 -4 Q0 14 60 -4 Q0 26 -60 -4Z" fill="${WHITE}"/>`;
  return `<path d="M-40 -6 Q0 40 40 -6" fill="none" stroke="${INK}" stroke-width="9" stroke-linecap="round"/>`; // smile
}
// ---- poz veren karakter (imza öğe): yuvarlak kafa, iri göz, allık, bıyık, silindir şapka ----
function sitter(f, x, y, s, o = {}) {
  const bl = (f % 110) < 5 ? .1 : 1, sep = o.sepia;
  const sk = sep ? '#E8C9A0' : SKIN, suit = sep ? '#6B5236' : INK, hat = sep ? '#4A3824' : INK;
  let g = `<path d="M-190 330 Q-200 150 -90 120 H90 Q200 150 190 330Z" fill="${suit}"/><path d="M-40 120 L0 210 L40 120Z" fill="${WHITE}"/><path d="M-22 150 L0 175 L22 150 L0 140Z" fill="${sep ? '#8C2F2F' : CORAL}"/>`;
  g += `<circle cy="-20" r="150" fill="${sk}" stroke="${INK}" stroke-width="${sep ? 0 : 7}"/>`;
  g += `<ellipse cx="-150" cy="-10" rx="22" ry="32" fill="${sk}"/><ellipse cx="150" cy="-10" rx="22" ry="32" fill="${sk}"/>`;
  for (const sg of [-1, 1]) g += `<g transform="translate(${sg * 55},-45) scale(1,${bl})"><ellipse rx="30" ry="34" fill="${WHITE}"/><circle cx="${o.look || 0}" cy="4" r="17" fill="${INK}"/><circle cx="${(o.look || 0) - 6}" cy="-4" r="6" fill="${WHITE}"/></g>`;
  g += `<path d="M${-85} -100 l50 ${o.brow || 0} M85 -100 l-50 ${o.brow || 0}" stroke="${INK}" stroke-width="9" stroke-linecap="round"/>`;
  if (!sep) g += `<ellipse cx="-95" cy="30" rx="24" ry="14" fill="${PINK}" opacity=".8"/><ellipse cx="95" cy="30" rx="24" ry="14" fill="${PINK}" opacity=".8"/>`;
  g += `<g transform="translate(0,70)">${agiz(o.m || 'flat')}</g>`;
  if (o.must !== false) g += `<path d="M0 30 Q-40 10 -78 40 Q-40 30 0 44 Q40 30 78 40 Q40 10 0 30Z" fill="${sep ? '#4A3824' : '#5B3A22'}"/>`;
  g += `<rect x="-120" y="-175" width="240" height="22" rx="10" fill="${hat}"/><rect x="-80" y="-330" width="160" height="165" rx="14" fill="${hat}"/><rect x="-80" y="-205" width="160" height="22" fill="${sep ? '#8C2F2F' : CORAL}"/>`;
  return at(x, y, s, g);
}
// eski fotoğraf çerçevesi (sepya)
const eskiFoto = (f, x, y, s, rot, m = 'flat') => at(x, y, s, `<g transform="rotate(${rot})"><rect x="-300" y="-380" width="600" height="760" rx="18" fill="#F4E4C1" stroke="${INK}" stroke-width="8"/><rect x="-255" y="-335" width="510" height="610" fill="#D9BE8C"/><g clip-path="inset(0)">${sitter(f, 0, 30, .95, { sepia: true, m })}</g><rect x="-255" y="-335" width="510" height="610" fill="none" stroke="#8B6B3E" stroke-width="6"/></g>`);
// tepki veren yardımcı: küçük kutu kamera, balon yazısıyla
const kamera = (f, x, y, bal, s = 1.3) => {
  const b = 6 * sin(f * .12), bl = (f % 90) < 5 ? .15 : 1;
  let g = `<g transform="translate(${x},${f2(y + b)}) scale(${s})"><rect x="-70" y="-50" width="140" height="110" rx="18" fill="${CORAL}" stroke="${INK}" stroke-width="6"/><rect x="-36" y="-66" width="40" height="20" rx="6" fill="${INK}"/><circle cx="0" cy="8" r="36" fill="${INK}"/><g transform="translate(0,8) scale(1,${bl})"><circle r="24" fill="${WHITE}"/><circle r="13" fill="${INK}"/><circle cx="-5" cy="-5" r="5" fill="${WHITE}"/></g><ellipse cx="-50" cy="38" rx="11" ry="7" fill="${PINK}"/><ellipse cx="50" cy="38" rx="11" ry="7" fill="${PINK}"/></g>`;
  if (bal) g += `<g transform="translate(${x + 120},${f2(y - 110 + b)}) scale(1.3)"><rect x="-56" y="-36" width="112" height="64" rx="28" fill="${WHITE}" stroke="${INK}" stroke-width="4"/><path d="M-20 26 l-8 22 l26 -22Z" fill="${WHITE}"/>${yazi(bal, 0, 14, 44, { renk: INK })}</g>`;
  return g;
};
const KAM = { hook: '?', exposure: '...', manners: '!?' };
// kronometre
const saat = (f, x, y, s, frac, lab) => at(x, y, s, `<circle r="150" fill="${WHITE}" stroke="${INK}" stroke-width="12"/><rect x="-22" y="-196" width="44" height="40" rx="8" fill="${INK}"/><path d="M0 0 L0 -150 A150 150 0 ${frac > .5 ? 1 : 0} 1 ${f2(150 * sin(frac * 2 * P))} ${f2(-150 * cos(frac * 2 * P))}Z" fill="${CORAL}" opacity=".85"/><path d="M0 0 L${f2(120 * sin(frac * 2 * P))} ${f2(-120 * cos(frac * 2 * P))}" stroke="${INK}" stroke-width="12" stroke-linecap="round"/><circle r="16" fill="${INK}"/>`) + yazi(lab, x, y + s * 230, 76 * s, { renk: WHITE, st: INK });

const SAHNE = {
  hook(f) {
    const ho = c('hook', 'hold'), mi = c('hook', 'minutes'), no = c('hook', 'not');
    let g = bg(f, 0) + eskiFoto(f, 540, 1020, 1.0, -4 + 1.5 * sin(f * .05));
    g += yazi('NO SMILES.', 540, 520, 140, { renk: WHITE, st: INK });
    if (f >= ho && f < no) g += saat(f, 830, 1530, .7, ((f - ho) / 60) % 1, 'MINUTES?');
    g += kazi(f, mi, yazi('HELD STILL', 540, 660, 104, { renk: GOLD, st: INK }), 540, 630);
    if (f >= no) g += zip(f, no, `<g transform="rotate(-10 540 1120)"><rect x="160" y="1030" width="760" height="190" rx="30" fill="none" stroke="${CORAL}" stroke-width="18"/>${yazi('NOT REALLY', 540, 1170, 130, { renk: CORAL })}</g>`, 540, 1120);
    return g;
  },
  exposure(f) {
    const wi = c('exposure', 'within'), dr = c('exposure', 'dropped'), se = c('exposure', 'seconds'), fa = c('exposure', 'faces');
    const fr = f < dr ? .9 : kf(f, [[dr, .9], [se, .05]]);
    let g = bg(f, 1) + saat(f, 540, 820, 1.25, fr, f < se ? 'MINUTES' : 'SECONDS!');
    if (f >= se) g += plaka(f, se, '⏱ JUST SECONDS', 540, 1260, 80, GOLD, INK, -3);
    if (f >= fa) g += zip(f, fa, eskiFoto(f, 300, 1560, .42, -8) + eskiFoto(f, 780, 1580, .42, 7), 540, 1570) + yazi('STILL SERIOUS', 540, 1860, 64, { renk: WHITE, st: INK, op: ac(f, fa + 6, 8) });
    return g;
  },
  manners(f) {
    const ma = c('manners', 'manners'), bi = c('manners', 'big'), si = c('manners', 'silly'), dr = c('manners', 'drunk'), pr = c('manners', 'proper'), sm2 = c('manners', 'small');
    const m = f < bi ? 'flat' : f < pr ? 'grin' : 'small';
    let g = bg(f, 2) + sitter(f, 540, 1130, 1.35, { m, brow: f >= pr ? -8 : f >= bi ? -14 : 0, look: f >= pr ? 0 : 6 * sin(f * .1) });
    g += kazi(f, ma, yazi('MANNERS', 540, 520, 150, { renk: WHITE, st: INK }), 540, 490);
    if (f >= bi && f < pr) {
      g += plaka(f, si, 'SILLY', 230, 820, 72, GOLD, INK, -10) + plaka(f, dr, 'DRUNK?', 850, 860, 72, PURP, WHITE, 8);
      g += f >= si ? `<circle cx="540" cy="1225" r="${f2(130 * EASE.dolly(ac(f, si, 8)))}" fill="none" stroke="${CORAL}" stroke-width="14"/>` + strike(f, si + 6, 430, 1325, 650, 1125) : '';
    }
    if (f >= pr) g += plaka(f, sm2, 'KEEP IT SMALL', 540, 1720, 84, KHAKI, INK, -2);
    return g;
  },
  prunes(f) {
    const lo = c('prunes', 'london'), ri = c('prunes', 'richard'), sa = c('prunes', 'say'), pu = c('prunes', 'prunes'), ti = c('prunes', 'tight');
    let g = bg(f, 0);
    g += kazi(f, lo, `<rect x="330" y="420" width="420" height="110" rx="20" fill="${INK}"/>` + yazi('LONDON', 540, 505, 84, { renk: GOLD, ls: 6 }), 540, 470);
    g += kazi(f, ri, yazi('PHOTOGRAPHER RICHARD BEARD', 540, 610, 50, { cls: 'px', renk: WHITE, st: INK, ls: 2 }), 540, 590);
    g += sitter(f, 420, 1160, 1.05, { m: f >= pu ? 'o' : 'flat', look: f >= sa ? 14 : 0 });
    // erik karakteri
    if (f >= sa) { const by = 10 * sin(f * .15); g += zip(f, sa, `<g transform="translate(830,${f2(1240 + by)})"><ellipse rx="110" ry="125" fill="${PURP}" stroke="${INK}" stroke-width="7"/><path d="M0 -120 q20 -50 60 -60" stroke="#5B3A22" stroke-width="12" fill="none" stroke-linecap="round"/><path d="M10 -150 q40 -30 70 0 q-40 20 -70 0Z" fill="#5FCB5A" stroke="${INK}" stroke-width="5"/><circle cx="-36" cy="-10" r="14" fill="${INK}"/><circle cx="36" cy="-10" r="14" fill="${INK}"/><circle cx="-41" cy="-15" r="5" fill="${WHITE}"/><circle cx="31" cy="-15" r="5" fill="${WHITE}"/><ellipse cx="-62" cy="24" rx="16" ry="10" fill="${PINK}"/><ellipse cx="62" cy="24" rx="16" ry="10" fill="${PINK}"/><path d="M-16 30 Q0 46 16 30" stroke="${INK}" stroke-width="7" fill="none" stroke-linecap="round"/></g>`, 830, 1240); }
    g += plaka(f, pu, '“SAY PRUNES”', 540, 1690, 100, GOLD, INK, -3);
    if (f >= ti) g += `<circle cx="420" cy="1234" r="${f2(46 + 6 * sin(f * .3))}" fill="none" stroke="${CORAL}" stroke-width="10"/>` + yazi('TINY MOUTH', 420, 1430, 54, { renk: WHITE, st: INK });
    return g;
  },
  kodak(f) {
    const ch = c('kodak', 'cheap'), ko = c('kodak', 'kodak'), dol = c('kodak', 'one'), y19 = c('kodak', '1900'), fu = c('kodak', 'fun'), ad = c('kodak', 'ads'), ha = c('kodak', 'happy');
    let g = bg(f, 3);
    g += kazi(f, ch - 6, yazi('CAMERAS GOT CHEAP', 540, 520, 86, { renk: WHITE, st: INK }), 540, 490);
    // Brownie kutu kamera (büyük)
    const bz = f >= ko ? 1 + .03 * sin(f * .2) : .9, bx = f >= fu ? 300 : 540, cx = bx + (f >= fu ? 0 : 0);
    if (f >= ko - 10) g += zip(f, ko - 10, `<g transform="translate(${cx},1000) scale(${bz.toFixed(3)})"><rect x="-180" y="-150" width="360" height="300" rx="26" fill="#3B2A1E" stroke="${INK}" stroke-width="8"/><rect x="-180" y="-150" width="360" height="60" rx="20" fill="#5B4332"/><circle cx="0" cy="30" r="90" fill="${INK}"/><circle cx="0" cy="30" r="58" fill="${XR}"/><circle cx="-18" cy="10" r="16" fill="${WHITE}"/><rect x="100" y="-190" width="60" height="40" rx="8" fill="${INK}"/>${yazi('BROWNIE', 0, -104, 40, { renk: GOLD, ls: 4 })}</g>`, cx, 1000);
    g += plaka(f, dol, '$1', cx + 190, 830, 100, GOLD, INK, 12);
    g += plaka(f, y19, '1900', cx, 1300, 96, KHAKI, INK, -3);
    // anlık fotoğraflar: gülen yüzler
    if (f >= fu) for (let i = 0; i < 4; i++) { const t0 = (i < 2 ? fu : ha) + i * 5, x = 790 + (i % 2 ? 90 : -90) * (i < 2 ? .4 : 1), y = 800 + i * 230, r = [-8, 6, -4, 9][i];
      g += zip(f, t0, `<g transform="translate(${x},${y}) rotate(${r})"><rect x="-130" y="-115" width="260" height="230" rx="10" fill="${WHITE}" stroke="${INK}" stroke-width="6"/><rect x="-110" y="-95" width="220" height="160" fill="${['#FFB547', '#7FD3FF', '#FF9EC7', '#FFC94A'][i]}"/>${sitter(f, 0, 0, .26, { m: 'grin', must: i % 2 === 0 })}</g>`, x, y); }
    g += plaka(f, ad, 'ADS: HAPPY FACES', 540, 1780, 70, CORAL, WHITE, -2);
    return g;
  },
  cheese(f) {
    const y43 = c('cheese', '1943'), te = c('cheese', 'texas'), da = c('cheese', 'joseph'), ju = c('cheese', 'just'), ch = c('cheese', 'cheese'), au = c('cheese', 'automatic');
    let g = bg(f, 1);
    g += plaka(f, y43, '1943', 540, 520, 130, GOLD, INK, -3);
    // gazete kupürü
    if (f >= te) g += zip(f, te, `<g transform="translate(540,960) rotate(-3)"><path d="M-400 -260 H400 L390 -200 L405 -120 L392 -40 L404 40 L390 120 L402 200 L395 260 H-400 L-392 180 L-404 100 L-390 20 L-402 -60 L-392 -140 L-404 -220Z" fill="#F4ECD8" stroke="${INK}" stroke-width="6"/>${yazi('TEXAS NEWSPAPER', 0, -175, 58, { renk: INK, ls: 3 })}<path d="M-340 -140 H340" stroke="${INK}" stroke-width="5"/>${[0, 1, 2, 3].map(i => `<path d="M-340 ${-80 + i * 46} H${i === 3 ? 120 : 340}" stroke="#B9AE96" stroke-width="20" stroke-linecap="round"/>`).join('')}${yazi('Ambassador Joseph E. Davies', 0, 160, 46, { cls: 'px', renk: INK, op: ac(f, da, 8) })}</g>`, 540, 960);
    if (f >= ju) g += zip(f, ju, `<g transform="translate(540,1420)"><rect x="-430" y="-110" width="860" height="220" rx="50" fill="${WHITE}" stroke="${INK}" stroke-width="8"/><path d="M-80 108 l-30 60 l90 -60Z" fill="${WHITE}" stroke="${INK}" stroke-width="8" stroke-linejoin="round"/><rect x="-118" y="96" width="140" height="16" fill="${WHITE}"/>${yazi('“Just say cheese.”', 0, 0, 78, { renk: INK })}${yazi('“It’s an automatic smile.”', 0, 80, 54, { cls: 'px', renk: CORAL, op: ac(f, au - 4, 8) })}</g>`, 540, 1420);
    // peynir karakteri
    if (f >= ch) { const by = 12 * sin(f * .18); g += zip(f, ch, `<g transform="translate(850,${f2(1740 + by)}) scale(.9)"><path d="M-120 60 L120 60 L120 -40 L-120 -80Z" fill="${GOLD}" stroke="${INK}" stroke-width="7" stroke-linejoin="round"/><path d="M-120 -80 L120 -40 L60 -110Z" fill="#FFE08A" stroke="${INK}" stroke-width="7" stroke-linejoin="round"/><circle cx="70" cy="20" r="14" fill="#E0A82E"/><circle cx="-80" cy="30" r="10" fill="#E0A82E"/><circle cx="-30" cy="-10" r="11" fill="${INK}"/><circle cx="30" cy="-6" r="11" fill="${INK}"/><path d="M-26 18 Q0 46 26 20" stroke="${INK}" stroke-width="7" fill="none" stroke-linecap="round"/></g>`, 850, 1740); }
    return g;
  },
  why(f) {
    const chh = c('why', 'ch'), li = c('why', 'lips'), ee = c('why', 'ee'), st = c('why', 'stretches'), tr = c('why', 'try');
    // plan modu: lacivert ızgara + büyük ağız şeması
    let g = `<rect width="1080" height="1920" fill="#0F2A5C"/><path d="${Array.from({ length: 28 }, (_, k) => `M${k * 40} 0V1920`).join('')}${Array.from({ length: 48 }, (_, k) => `M0 ${k * 40}H1080`).join('')}" stroke="${XR}" stroke-width="1.5" opacity=".14"/>`;
    const m = f < chh ? 'flat' : f < ee ? 'ch' : 'ee', sc = f < ee ? 5 : 5 + .4 * EASE.dolly(ac(f, st, 14));
    g += `<g transform="translate(540,1020) scale(${sc.toFixed(2)})" opacity=".95"><g stroke="${XR}" stroke-width="2.2" fill="none">${agiz(m).replace(/fill="[^"]+"/g, 'fill="none"').replace(/stroke="[^"]+"/g, '').replace(/<(path|rect|circle)/g, `<$1 stroke="${XR}" stroke-width="2.4"`)}</g></g>`;
    g += yazi(f < ee ? '“CH”' : '“EE”', 540, 560, 200, { renk: f < ee ? GOLD : CORAL });
    if (f >= li && f < ee) g += yazi('↑ LIPS APART ↓', 540, 1360, 66, { cls: 'px', renk: WHITE, op: ac(f, li, 8) });
    if (f >= st) { const k = EASE.dolly(ac(f, st, 12)); g += `<path d="M${f2(330 - 120 * k)} 1020 H140 M140 1020 l40 -30 M140 1020 l40 30 M${f2(750 + 120 * k)} 1020 H940 M940 1020 l-40 -30 M940 1020 l-40 30" stroke="${GOLD}" stroke-width="12" stroke-linecap="round" fill="none"/>` + yazi('STRETCHED WIDE', 540, 1360, 66, { cls: 'px', renk: GOLD }); }
    if (f >= tr) g += plaka(f, tr, 'TRY IT NOW', 540, 1640, 96, GOLD, INK, -3);
    return g;
  },
  son(f) {
    const wo = c('son', 'word'), ca = c('son', 'cameras'), fo = c('son', 'follow');
    if (f >= fo - 6) return kapanis(f, fo - 6);
    let g = bg(f, 0) + sitter(f, 540, 1180, 1.3, { m: f >= ca ? 'grin' : 'smile' });
    g += kazi(f, wo, yazi('NOT THE WORD…', 540, 520, 110, { renk: WHITE, st: INK }), 540, 490);
    g += kazi(f, ca, yazi('THE CAMERAS.', 540, 660, 130, { renk: GOLD, st: INK }), 540, 630);
    return g + flash(f, f >= ca ? ac(f, ca, 14) : 0) + kamera(f, 170, 1720, ':)');
  },
};

// kanal kapanış kartı: profil resmi zıplar, Follow'a dokunulur, kalp dolar (sabit, her videoda aynı)
const TAP_F = () => c('son', 'daily') + 10;
function kapanis(f, f0) {
  const t = f - f0, k = backOut(t / 22), tap = TAP_F(), td = f - tap;
  const sc = (.15 + .85 * k) * (1 + .015 * sin(t * .15)), rot = (1 - klamp(t / 24)) * -14 + 2.5 * sin(t * .1);
  let g = `<defs><radialGradient id="tg" cx="50%" cy="42%" r="75%"><stop offset="0" stop-color="#2AB3B1"/><stop offset="1" stop-color="#0C5667"/></radialGradient></defs><rect width="1080" height="1920" fill="url(#tg)"/>`;
  g += `<g transform="translate(540,1000) rotate(${rot.toFixed(2)}) scale(${sc.toFixed(3)})"><image href="img/pp.png" x="-380" y="-380" width="760" height="760" clip-path="inset(0 round 160px)"/></g>`;
  g += kazi(f, f0 + 14, yazi('Follow for a weird', 540, 520, 84, { renk: WHITE }) + yazi('everyday truth daily.', 540, 620, 84, { renk: GOLD }), 540, 560);
  const pr = td > 0 && td < 8 ? .9 : 1, on = td >= 4, bx = 400, by = 1560;
  if (f >= f0 + 30) g += `<g opacity="${f2(ac(f, f0 + 30, 8))}" transform="translate(${bx},${by}) scale(${pr})"><rect x="-210" y="-62" width="420" height="124" rx="62" fill="${on ? WHITE : '#FF6B5E'}"/>${yazi(on ? 'Following ✓' : 'Follow', 0, 24, 66, { renk: on ? '#0C5667' : WHITE })}</g>`;
  const hs = on ? 1 + .35 * Math.max(0, 1 - (td - 4) / 10) : 1, hx = 790, hy = 1560;
  if (f >= f0 + 30) g += `<g opacity="${f2(ac(f, f0 + 30, 8))}" transform="translate(${hx},${hy}) scale(${(1.6 * hs).toFixed(3)})"><path d="M0 28 C-60 -10 -34 -46 0 -18 C34 -46 60 -10 0 28Z" fill="${on ? '#FF6B5E' : 'none'}" stroke="${WHITE}" stroke-width="7" stroke-linejoin="round"/></g>`;
  if (td >= 4 && td < 16) for (let i = 0; i < 6; i++) { const a = i * P / 3, r = 80 + td * 9; g += `<circle cx="${f2(hx + r * cos(a))}" cy="${f2(hy + r * sin(a))}" r="${f2(10 - td * .5)}" fill="${GOLD}"/>`; }
  return g;
}
const SIRA = Object.keys(SAHNE);
const aralik = ad => { const i = SIRA.indexOf(ad), b = a => a === 'hook' ? 0 : T.seg[a].start - 10; return [b(ad), SIRA[i + 1] ? b(SIRA[i + 1]) : T.total + 30]; };
const W = 16;
window.renderFrame = function (f) {
  let g = '', clip = '', ust = '';
  SIRA.forEach((ad, i) => {
    const [b, s] = aralik(ad);
    if (f < b || f > s + W) return;
    // geçiş: ay konumundan büyüyen daire (iris); eski sahne altta kalır
    const ui = i ? EASE.dolly(klamp((f - b) / W)) : 1;
    if (ui <= 0) return;
    const sonraki = SIRA[i + 1] && f > s;
    const r = ui * 1900;
    clip += `<clipPath id="c${i}"><circle cx="870" cy="300" r="${f2(r)}"/></clipPath>`;
    g += `<g clip-path="url(#c${i})">${SAHNE[ad](f)}${KAM[ad] ? kamera(f, 170, 1720, KAM[ad]) : ''}</g>`;
    if (i && ui > 0 && ui < 1) ust += `<circle cx="870" cy="300" r="${f2(r)}" fill="none" stroke="${GOLD}" stroke-width="14"/><circle cx="870" cy="300" r="${f2(Math.max(0, r - 26))}" fill="none" stroke="${KHAKI}" stroke-width="4" opacity=".6"/>`;
  });
  $('clips').innerHTML = clip; $('sahne').innerHTML = g; $('ust').innerHTML = ust;
  altyazi2(f, $('alt'));
};
function altyazi2(f, el) {
  const cp = T.caption(f), tt = f / FPS;
  if (!cp) { el.innerHTML = ''; el.style.display = 'none'; return; }
  el.style.display = 'inline-block';
  const seg = T.timing.words.find(y => y.start >= cp.start - 0.01).seg;
  const ws = T.timing.words.filter(x => x.start >= cp.start - 0.01 && x.start < cp.end && x.seg === seg);
  let i = 0;
  el.innerHTML = cp.lines.map(line => line.split(' ').map(() => {
    const x = ws[i++]; if (!x) return '';
    const col = tt < x.start ? '#8A93AD' : tt < x.end + 0.05 ? '#FFC94A' : '#FFFFFF';
    return `<span style="color:${col}">${x.w}</span>`;
  }).join(' ')).join('<br>');
}
