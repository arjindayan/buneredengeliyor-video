<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../engine/fonts/fonts.css">
<style>
  /* STİL KARTI: oyun tahtası masası, sevimli Lizzie ve Darrow karakterleri + tepki veren küçük ev */
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#FFB547}
  svg{position:absolute;inset:0}
  #alt-w{position:absolute;left:0;right:0;top:100px;display:flex;justify-content:center}
  #alt{display:inline-block;max-width:940px;font:500 62px/1.22 'Fredoka';color:#FFFFFF;text-align:center;background:rgba(8,14,40,.84);border-radius:56px;padding:26px 48px 30px}
  .is{font-family:'Fredoka';font-weight:600}
  .px{font-family:'Fredoka';font-weight:500}
</style>
</head>
<body>
<svg viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <filter id="bulanik"><feGaussianBlur stdDeviation="9"/></filter>
    <g id="clips"></g>
  </defs>
  <g id="sahne"></g><g id="ust"></g>
</svg>
<div id="alt-w"><div id="alt"></div></div>
<script src="../../engine/lib.js"></script>
<script src="../../engine/cute.js"></script>
<script src="../../engine/vinyet.js"></script>
<script>
window.FONTS = ['600 60px "Fredoka"', '500 60px "Fredoka"'];
const INK = '#1B2340', CORAL = '#FF6B5E', GOLD = '#FFC94A', KHAKI = '#FFF3DC', WHITE = '#FFFFFF', TEAL = '#1E9E9A', PURP = '#7B5CFF', PINK = '#FF9E9E', SKIN = '#FFD9B8', SEPIA = '#C99A66', XR = '#8FD3FF';
const c = cue, ac = (f, f0, d = 8) => f < f0 ? 0 : klamp((f - f0) / d);
const yazi = (txt, x, y, s, o = {}) => `<text x="${f2(x)}" y="${f2(y)}" class="${o.cls || 'is'}" font-size="${s}" fill="${o.renk || KHAKI}" text-anchor="${o.a || 'middle'}" letter-spacing="${o.ls ?? 1}" opacity="${f2(o.op ?? 1)}" ${o.st ? `stroke="${o.st}" stroke-width="${s * .14}" paint-order="stroke" stroke-linejoin="round"` : ''}>${txt}</text>`;
const kazi = (f, f0, ic, x = 540, y = 960, d = 8) => f < f0 ? '' : `<g opacity="${f2(ac(f, f0, d * .6))}" transform="translate(${x},${y}) scale(${(1 + .06 * (1 - EASE.dolly(ac(f, f0, d)))).toFixed(3)}) translate(${-x},${-y})">${ic}</g>`;
const zip = (f, f0, ic, x, y) => f < f0 ? '' : `<g transform="translate(${x},${y}) scale(${backOut((f - f0) / 12).toFixed(3)}) translate(${-x},${-y})">${ic}</g>`;
const plaka = (f, f0, txt, x, y, s = 84, renk = GOLD, yr = INK, rot = 0) => f < f0 ? '' : zip(f, f0, `<g transform="rotate(${rot} ${x} ${y})"><rect x="${f2(x - txt.length * s * .27 - 40)}" y="${f2(y - s * .82)}" width="${f2(txt.length * s * .54 + 80)}" height="${f2(s * 1.15)}" rx="${s * .3}" fill="${renk}" stroke="${INK}" stroke-width="8"/>${yazi(txt, x, y + s * .06, s, { renk: yr, ls: 2 })}</g>`, x, y);
const strike = (f, f0, x0, y0, x1, y1) => f < f0 ? '' : `<path d="M${x0} ${y0} L${f2(x0 + (x1 - x0) * EASE.dolly(ac(f, f0, 8)))} ${f2(y0 + (y1 - y0) * EASE.dolly(ac(f, f0, 8)))}" stroke="${CORAL}" stroke-width="22" stroke-linecap="round"/>`;

// ---- ağız tipleri ----
function agiz(m) {
  if (m === 'flat') return `<path d="M-34 0 H34" stroke="${INK}" stroke-width="9" stroke-linecap="round"/>`;
  if (m === 'small') return `<path d="M-14 0 H14" stroke="${INK}" stroke-width="9" stroke-linecap="round"/>`;
  if (m === 'o') return `<circle r="13" fill="${INK}"/><circle r="6" fill="#C2465A"/>`;
  if (m === 'grin') return `<path d="M-62 -10 Q0 90 62 -10Z" fill="${INK}"/><path d="M-54 -6 H54 Q50 14 40 16 H-40 Q-50 14 -54 -6Z" fill="${WHITE}"/><path d="M-26 50 Q0 62 26 50 Q0 40 -26 50Z" fill="${CORAL}"/>`;
  if (m === 'ch') return `<rect x="-36" y="-12" width="72" height="32" rx="16" fill="${INK}"/><rect x="-30" y="-8" width="60" height="12" rx="4" fill="${WHITE}"/>`;
  if (m === 'ee') return `<path d="M-70 -8 Q0 46 70 -8 Q0 12 -70 -8Z" fill="${INK}"/><path d="M-60 -4 Q0 14 60 -4 Q0 26 -60 -4Z" fill="${WHITE}"/>`;
  return `<path d="M-40 -6 Q0 40 40 -6" fill="none" stroke="${INK}" stroke-width="9" stroke-linecap="round"/>`; // smile
}
// ---- poz veren karakter (imza öğe): yuvarlak kafa, iri göz, allık, bıyık, silindir şapka ----
function sitter(f, x, y, s, o = {}) {
  const bl = (f % 110) < 5 ? .1 : 1, sep = o.sepia;
  const sk = sep ? '#E8C9A0' : SKIN, suit = sep ? '#6B5236' : INK, hat = sep ? '#4A3824' : INK;
  let g = `<path d="M-190 330 Q-200 150 -90 120 H90 Q200 150 190 330Z" fill="${suit}"/><path d="M-40 120 L0 210 L40 120Z" fill="${WHITE}"/><path d="M-22 150 L0 175 L22 150 L0 140Z" fill="${sep ? '#8C2F2F' : CORAL}"/>`;
  g += `<circle cy="-20" r="150" fill="${sk}" stroke="${INK}" stroke-width="${sep ? 0 : 7}"/>`;
  g += `<ellipse cx="-150" cy="-10" rx="22" ry="32" fill="${sk}"/><ellipse cx="150" cy="-10" rx="22" ry="32" fill="${sk}"/>`;
  for (const sg of [-1, 1]) g += `<g transform="translate(${sg * 55},-45) scale(1,${bl})"><ellipse rx="30" ry="34" fill="${WHITE}"/><circle cx="${o.look || 0}" cy="4" r="17" fill="${INK}"/><circle cx="${(o.look || 0) - 6}" cy="-4" r="6" fill="${WHITE}"/></g>`;
  g += `<path d="M${-85} -100 l50 ${o.brow || 0} M85 -100 l-50 ${o.brow || 0}" stroke="${INK}" stroke-width="9" stroke-linecap="round"/>`;
  if (!sep) g += `<ellipse cx="-95" cy="30" rx="24" ry="14" fill="${PINK}" opacity=".8"/><ellipse cx="95" cy="30" rx="24" ry="14" fill="${PINK}" opacity=".8"/>`;
  g += `<g transform="translate(0,70)">${agiz(o.m || 'flat')}</g>`;
  if (o.must !== false) g += `<path d="M0 30 Q-40 10 -78 40 Q-40 30 0 44 Q40 30 78 40 Q40 10 0 30Z" fill="${sep ? '#4A3824' : '#5B3A22'}"/>`;
  g += o.bowler ? `<ellipse cx="0" cy="-160" rx="135" ry="20" fill="${hat}"/><path d="M-88 -160 Q-88 -295 0 -295 Q88 -295 88 -160Z" fill="${hat}"/><rect x="-88" y="-205" width="176" height="22" fill="${CORAL}"/>` : `<rect x="-120" y="-175" width="240" height="22" rx="10" fill="${hat}"/><rect x="-80" y="-330" width="160" height="165" rx="14" fill="${hat}"/><rect x="-80" y="-205" width="160" height="22" fill="${sep ? '#8C2F2F' : CORAL}"/>`;
  return at(x, y, s, g);
}
const FELT = 0;
const PROP = ['#8B5A2B', '#9FD8F5', '#E259A8', '#FF9A2E', '#E5453A', '#FFD84A', '#2EB872', '#2F6FDE'];
function bg(f, ton = 0) {
  const A = [['#2BB673', '#0E6B49'], ['#4F8DF0', '#1D4DB0'], ['#F0675B', '#A9261E'], ['#9B6BEA', '#5B2DAE']][ton];
  let g = `<defs><radialGradient id="bg${ton}" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="${A[0]}"/><stop offset="1" stop-color="${A[1]}"/></radialGradient></defs><rect width="1080" height="1920" fill="url(#bg${ton})"/>`;
  for (let k = 0; k < 12; k++) { const y = 70 + k * 150, col = PROP[(k + ton) % 8]; g += `<rect x="0" y="${y}" width="46" height="130" rx="8" fill="${col}" stroke="${INK}" stroke-width="5"/><rect x="1034" y="${y}" width="46" height="130" rx="8" fill="${col}" stroke="${INK}" stroke-width="5"/>`; }
  for (let k = 0; k < 16; k++) { const x = 100 + rastgele(k * 5) * 880, y = (rastgele(k * 5 + 1) * 1900 + f * (.4 + rastgele(k * 5 + 2))) % 1900; g += `<circle cx="${f2(x)}" cy="${f2(y)}" r="${f2(5 + rastgele(k * 5 + 3) * 7)}" fill="${WHITE}" opacity=".16"/>`; }
  return g + `<path d="M46 1560 Q540 1500 1034 1560 V1920 H46Z" fill="#0A1B3A" opacity=".28"/>`;
}
const flash = (f, burst) => burst > 0 ? `<rect width="1080" height="1920" fill="${WHITE}" opacity="${f2(.85 * (1 - burst))}"/>` : '';
function lizzie(f, x, y, s, o = {}) {
  const bl = (f % 100) < 5 ? .1 : 1, HAIR = '#7A4A2A';
  let g = `<path d="M-175 330 Q-190 150 -85 120 H85 Q190 150 175 330Z" fill="${WHITE}" stroke="${INK}" stroke-width="6"/><path d="M-60 120 Q0 190 60 120" fill="none" stroke="${INK}" stroke-width="6"/><circle cy="176" r="16" fill="${CORAL}" stroke="${INK}" stroke-width="5"/>`;
  g += `<circle cy="-190" r="64" fill="${HAIR}" stroke="${INK}" stroke-width="6"/><circle cy="-20" r="160" fill="${HAIR}"/><circle cy="-5" r="140" fill="${SKIN}" stroke="${INK}" stroke-width="7"/><path d="M-140 -40 Q-120 -150 0 -150 Q120 -150 140 -40 Q90 -100 0 -95 Q-90 -100 -140 -40Z" fill="${HAIR}"/>`;
  for (const sg of [-1, 1]) g += `<g transform="translate(${sg * 52},-28) scale(1,${bl})"><ellipse rx="22" ry="26" fill="${WHITE}"/><circle cx="${o.look || 0}" cy="3" r="13" fill="${INK}"/><circle cx="${(o.look || 0) - 5}" cy="-4" r="5" fill="${WHITE}"/></g><circle cx="${sg * 52}" cy="-28" r="44" fill="none" stroke="${INK}" stroke-width="6"/>`;
  g += `<path d="M-8 -28 H8" stroke="${INK}" stroke-width="6"/><ellipse cx="-92" cy="32" rx="22" ry="13" fill="${PINK}" opacity=".8"/><ellipse cx="92" cy="32" rx="22" ry="13" fill="${PINK}" opacity=".8"/><g transform="translate(0,62)">${agiz(o.m || 'smile')}</g>`;
  return at(x, y, s, g);
}
// tepki veren yardımcı: küçük ev, balon yazısıyla
const evim = (f, x, y, bal, s = 1.3) => {
  const b = 6 * sin(f * .12), bl = (f % 90) < 5 ? .15 : 1;
  let g = `<g transform="translate(${x},${f2(y + b)}) scale(${s})"><path d="M-66 -8 L0 -78 L66 -8Z" fill="${CORAL}" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/><rect x="-52" y="-8" width="104" height="82" rx="8" fill="${KHAKI}" stroke="${INK}" stroke-width="6"/><g transform="translate(0,22) scale(1,${bl})"><circle cx="-20" r="11" fill="${INK}"/><circle cx="20" r="11" fill="${INK}"/><circle cx="-24" cy="-4" r="4" fill="${WHITE}"/><circle cx="16" cy="-4" r="4" fill="${WHITE}"/></g><ellipse cx="-36" cy="46" rx="11" ry="7" fill="${PINK}"/><ellipse cx="36" cy="46" rx="11" ry="7" fill="${PINK}"/><path d="M-12 44 Q0 56 12 44" stroke="${INK}" stroke-width="5" fill="none" stroke-linecap="round"/></g>`;
  if (bal) g += `<g transform="translate(${x + 120},${f2(y - 110 + b)}) scale(1.3)"><rect x="-56" y="-36" width="112" height="64" rx="28" fill="${WHITE}" stroke="${INK}" stroke-width="4"/><path d="M-20 26 l-8 22 l26 -22Z" fill="${WHITE}"/>${yazi(bal, 0, 14, 44, { renk: INK })}</g>`;
  return g;
};
const EV = { hook: '?', lizzie: '!', rules: 'vs', darrow: '!?', lost: '...' };
const BAG = `<path d="M-200 250 Q-300 0 -110 -90 L-70 -170 Q0 -130 70 -170 L110 -90 Q300 0 200 250Z" fill="#2EB872" stroke="${INK}" stroke-width="9"/><rect x="-80" y="-190" width="160" height="40" rx="14" fill="${GOLD}" stroke="${INK}" stroke-width="7"/>` + yazi('$', 0, 150, 260, { renk: WHITE, st: INK });
const bills = f => Array.from({ length: 6 }, (_, k) => `<g transform="translate(${140 + k * 160},${f2((f * 5 + k * 330) % 2000 - 100)}) rotate(${f2(20 * sin(f * .05 + k))})"><rect x="-56" y="-30" width="112" height="60" rx="8" fill="#7FD68F" stroke="${INK}" stroke-width="5"/><circle r="16" fill="#2EB872" stroke="${INK}" stroke-width="4"/></g>`).join('');
const face = (x, y, s, col, m) => at(x, y, s, `<circle r="60" fill="${col}" stroke="${INK}" stroke-width="6"/><circle cx="-20" cy="-8" r="8" fill="${INK}"/><circle cx="20" cy="-8" r="8" fill="${INK}"/><g transform="translate(0,24) scale(.6)">${agiz(m)}</g>`);
const board = (x, y, s, rot) => at(x, y, s, `<g transform="rotate(${rot})"><rect x="-150" y="-150" width="300" height="300" rx="16" fill="#CDE9D2" stroke="${INK}" stroke-width="8"/>` + [0, 1, 2, 3, 4, 5].map(i => `<rect x="${-150 + i * 50}" y="-150" width="50" height="50" fill="${PROP[i]}" stroke="${INK}" stroke-width="3"/><rect x="${-150 + i * 50}" y="100" width="50" height="50" fill="${PROP[(i + 3) % 8]}" stroke="${INK}" stroke-width="3"/>`).join('') + [1, 2, 3, 4].map(i => `<rect x="-150" y="${-150 + i * 50}" width="50" height="50" fill="${PROP[(i + 5) % 8]}" stroke="${INK}" stroke-width="3"/><rect x="100" y="${-150 + i * 50}" width="50" height="50" fill="${PROP[(i + 1) % 8]}" stroke="${INK}" stroke-width="3"/>`).join('') + yazi('$', 0, 40, 130, { renk: '#2EB872', st: INK }) + `</g>`);
const stack = (x, y, h) => Array.from({ length: Math.max(1, Math.round(h / 22)) }, (_, i) => `<ellipse cx="${x}" cy="${y - i * 22}" rx="70" ry="16" fill="${GOLD}" stroke="${INK}" stroke-width="5"/>`).join('');
const SAHNE = {
  hook(f) {
    const ce = c('hook', 'celebrate'), no = c('hook', 'not'), pr = c('hook', 'protest');
    let g = bg(f, 0);
    if (f < pr) {
      const k = f < no ? 1 : 1 - .3 * EASE.dolly(ac(f, no, 10));
      g += bills(f) + `<g transform="translate(540,1060) scale(${k.toFixed(3)})">${BAG}</g>`;
      g += f < no ? yazi('GET RICH!', 540, 560, 170, { renk: GOLD, st: INK }) : '';
      if (f >= no) g += strike(f, no, 300, 800, 780, 1300) + zip(f, no, `<g transform="rotate(-8 540 1470)"><rect x="170" y="1380" width="740" height="170" rx="40" fill="${WHITE}" stroke="${INK}" stroke-width="9"/>${yazi('NOT REALLY', 540, 1500, 120, { renk: CORAL })}</g>`, 540, 1470);
    } else {
      g += yazi('A PROTEST!', 540, 560, 160, { renk: GOLD, st: INK });
      g += zip(f, pr, `<g transform="translate(540,1250) rotate(-6)"><rect x="-14" y="0" width="28" height="560" fill="#8B5A2B" stroke="${INK}" stroke-width="6"/><rect x="-340" y="-320" width="680" height="320" rx="24" fill="${WHITE}" stroke="${INK}" stroke-width="9"/>${yazi('NO LANDLORD', 0, -185, 108, { renk: CORAL })}${yazi('MONOPOLIES!', 0, -65, 108, { renk: INK })}</g>`, 540, 1250);
    }
    return g;
  },
  lizzie(f) {
    const y4 = c('lizzie', '1904'), wo = c('lizzie', 'woman'), pa = c('lizzie', 'patented'), ll = c('lizzie', 'landlords'), ri = c('lizzie', 'richer'), re = c('lizzie', 'renters'), st = c('lizzie', 'stuck');
    let g = bg(f, 1);
    g += zip(f, y4, `<g transform="rotate(-3 540 520)"><rect x="300" y="430" width="480" height="150" rx="30" fill="${GOLD}" stroke="${INK}" stroke-width="8"/>${yazi('1904', 540, 548, 120, { renk: INK })}</g>`, 540, 500);
    g += zip(f, wo, lizzie(f, 470, 960, 1.0, { m: f >= ll ? 'flat' : 'smile' }), 470, 960);
    g += zip(f, pa, `<g transform="translate(850,820) rotate(8)"><rect x="-190" y="-130" width="380" height="260" rx="14" fill="#F4ECD8" stroke="${INK}" stroke-width="7"/>${yazi('PATENT', 0, -50, 64, { renk: INK, ls: 3 })}${yazi('No. 748,626', 0, 20, 46, { cls: 'px', renk: INK })}${[0, 1].map(i => `<path d="M-140 ${62 + i * 34} H140" stroke="#B9AE96" stroke-width="14" stroke-linecap="round"/>`).join('')}</g>`, 850, 820);
    if (f >= ll) {
      const k = EASE.dolly(ac(f, ll, 12)), h = 30 + 280 * EASE.dolly(ac(f, ri, 26));
      g += `<g opacity="${f2(k)}">` + stack(150, 1600, h) + sitter(f, 420, 1440, .5, { m: f >= ri ? 'grin' : 'smile' }) + yazi('LANDLORD', 430, 1760, 56, { renk: WHITE, st: INK });
      g += sitter(f, 800, 1470, .5, { m: 'flat', brow: f >= re ? 12 : 0 }) + yazi('RENTER', 800, 1760, 56, { renk: WHITE, st: INK }) + `</g>`;
      if (f >= st) g += plaka(f, st, 'STUCK', 800, 1260, 76, CORAL, WHITE, -6);
    }
    return g;
  },
  rules(f) {
    const tw = c('rules', 'two'), ev = c('rules', 'everybody'), ot = c('rules', 'other'), cr = c('rules', 'crushing');
    let g = bg(f, 2) + kazi(f, tw - 4, yazi('TWO RULE SETS', 540, 560, 92, { renk: WHITE, st: INK }), 540, 520);
    const card = (x, t, col) => `<rect x="${x}" y="700" width="450" height="760" rx="40" fill="${WHITE}" stroke="${INK}" stroke-width="9"/><rect x="${x}" y="700" width="450" height="110" rx="40" fill="${col}" stroke="${INK}" stroke-width="9"/>${yazi(t, x + 225, 782, 58, { renk: WHITE, ls: 2 })}`;
    g += zip(f, ev - 6, card(60, 'PROSPERITY', '#2EB872'), 285, 1080);
    if (f >= ev) g += [0, 1, 2].map(i => zip(f, ev + i * 4, face(150 + i * 135, 1020 - (i === 1 ? 40 : 0), .9, GOLD, 'grin'), 285, 1000)).join('') + zip(f, ev + 12, yazi('EVERYBODY WINS', 285, 1330, 42, { renk: '#1B8A55' }), 285, 1330);
    g += zip(f, ot - 6, card(570, 'MONOPOLIST', CORAL), 795, 1080);
    if (f >= ot) {
      const sq = f >= cr ? 1 - .6 * EASE.dolly(ac(f, cr, 10)) : 1;
      g += zip(f, ot, face(795, 1000, 1.5, GOLD, 'grin') + `<path d="M730 905 L750 850 L775 890 L795 840 L815 890 L840 850 L860 905Z" fill="${GOLD}" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/>`, 795, 1000);
      for (const [x, d] of [[680, 0], [910, 4]]) g += `<g transform="translate(${x},${1200 + (1 - sq) * 40}) scale(1,${sq.toFixed(2)})">${face(0, 0, .75, PINK, f >= cr ? 'o' : 'smile')}</g>`;
      g += zip(f, ot + 12, yazi('YOU WIN', 795, 1330, 52, { renk: CORAL }), 795, 1330);
    }
    return g;
  },
  spread(f) {
    const ho = c('spread', 'homemade'), co = c('spread', 'copies'), cl = c('spread', 'colleges'), qu = c('spread', 'quakers'), st = c('spread', 'streets'), at2 = c('spread', 'atlantic');
    let g = bg(f, 3) + kazi(f, ho, yazi('HOMEMADE COPIES', 540, 560, 84, { renk: WHITE, st: INK }), 540, 520);
    [[250, 880, .6, -8], [540, 800, .65, 5], [830, 900, .6, 9], [330, 1170, .6, 6], [750, 1170, .65, -6], [540, 1420, .75, 3]].forEach(([x, y, s, r], i) => { g += zip(f, co + i * 5, board(x, y, s, r), x, y); });
    if (f >= cl && f < qu) g += plaka(f, cl, 'COLLEGES', 540, 1720, 96, GOLD, INK, -3);
    if (f >= qu && f < st) g += plaka(f, qu, 'QUAKERS', 540, 1720, 96, KHAKI, INK, -3);
    if (f >= st) g += zip(f, st, `<g transform="translate(540,1650)"><rect x="-300" y="-70" width="600" height="140" rx="16" fill="#2F6FDE" stroke="${WHITE}" stroke-width="8"/>${yazi('BOARDWALK', 0, 26, 92, { renk: WHITE, ls: 4 })}</g>`, 540, 1650) + plaka(f, at2, 'ATLANTIC CITY', 540, 1850, 70, GOLD, INK, -2);
    return g;
  },
  darrow(f) {
    const y5 = c('darrow', '1935'), pa = c('darrow', 'parker'), ch = c('darrow', 'charles'), inv = c('darrow', 'invented'), li = c('darrow', 'lizzie'), fi = c('darrow', 'five'), nr = c('darrow', 'royalties');
    let g = bg(f, 0);
    g += zip(f, y5, `<g transform="rotate(-3 540 520)"><rect x="300" y="430" width="480" height="150" rx="30" fill="${GOLD}" stroke="${INK}" stroke-width="8"/>${yazi('1935', 540, 548, 120, { renk: INK })}</g>`, 540, 500);
    g += zip(f, pa, `<rect x="250" y="620" width="580" height="90" rx="14" fill="#E5453A" stroke="${INK}" stroke-width="7"/>` + yazi('PARKER BROTHERS', 540, 686, 56, { renk: WHITE, ls: 2 }), 540, 660);
    g += zip(f, ch, sitter(f, 620, 1130, .95, { m: f >= inv ? 'grin' : 'smile', bowler: true, brow: f >= inv ? -10 : 0 }), 620, 1130);
    if (f >= inv) g += zip(f, inv, `<g transform="translate(800,820) rotate(6)"><rect x="-190" y="-70" width="380" height="140" rx="50" fill="${WHITE}" stroke="${INK}" stroke-width="7"/>${yazi('I INVENTED IT!', 0, 16, 46, { renk: INK })}</g>`, 800, 820);
    if (f >= li) g += zip(f, li, lizzie(f, 230, 1250, .5, { m: f >= nr ? 'o' : 'smile' }), 230, 1250);
    g += f >= fi ? plaka(f, fi, '$500', 540, 1640, 124, GOLD, INK, -3) : '';
    g += f >= nr ? zip(f, nr, `<g transform="rotate(-6 540 1810)"><rect x="170" y="1740" width="740" height="130" rx="20" fill="none" stroke="${CORAL}" stroke-width="14"/>${yazi('NO ROYALTIES', 540, 1830, 90, { renk: CORAL })}</g>`, 540, 1800) : '';
    return g;
  },
  lost(f) {
    const de = c('lost', 'decades'), fo = c('lost', 'forgotten'), y73 = c('lost', '1973'), an = c('lost', 'anti'), du = c('lost', 'dug');
    let g = bg(f, 1);
    g += f < y73 ? yazi('THE “INVENTOR”', 540, 560, 88, { renk: WHITE, st: INK }) : plaka(f, y73, '1973', 540, 570, 130, GOLD, INK, -3);
    g += sitter(f, 300, 1150, .9, { m: 'grin', bowler: true, brow: -10 });
    g += zip(f, de, `<g transform="translate(400,1600)"><path d="M-70 -60 H70 L50 20 Q0 50 -50 20Z" fill="${GOLD}" stroke="${INK}" stroke-width="7"/><rect x="-40" y="20" width="80" height="30" fill="${GOLD}" stroke="${INK}" stroke-width="6"/><rect x="-80" y="50" width="160" height="40" rx="8" fill="#8B5A2B" stroke="${INK}" stroke-width="6"/></g>`, 400, 1600);
    const lo = f < du ? (f >= fo ? .3 : 1) : .3 + .7 * EASE.dolly(ac(f, du, 16));
    g += zip(f, de + 24, `<g opacity="${f2(lo)}">${lizzie(f, 790, 1150, .9, { m: f >= du ? 'smile' : 'flat' })}</g>`, 790, 1150);
    if (f >= fo && f < du) g += yazi('FORGOTTEN', 790, 1600, 66, { renk: WHITE, st: INK });
    if (f >= an) g += zip(f, an, `<g transform="translate(540,830) rotate(-4)"><rect x="-300" y="-70" width="600" height="140" rx="20" fill="${CORAL}" stroke="${INK}" stroke-width="8"/>${yazi('ANTI-MONOPOLY', 0, 24, 76, { renk: WHITE })}</g>`, 540, 830);
    if (f >= du) g += plaka(f, du, 'HER STORY', 790, 1680, 80, GOLD, INK, 3);
    return g;
  },
  son(f) {
    const ne = c('son', 'never'), wa = c('son', 'warning'), fo = c('son', 'follow');
    if (f >= fo - 6) return kapanis(f, fo - 6);
    let g = bg(f, 2) + lizzie(f, 540, 1180, 1.25, { m: f >= wa ? 'smile' : 'flat' });
    g += kazi(f, ne, yazi('NOT A LOVE LETTER', 540, 560, 78, { renk: WHITE, st: INK }), 540, 530);
    g += kazi(f, wa, yazi('A WARNING.', 540, 700, 140, { renk: GOLD, st: INK }), 540, 670);
    return g + flash(f, f >= wa ? ac(f, wa, 14) : 0) + evim(f, 170, 1720, f >= wa ? '!' : '');
  },
};

// kanal kapanış kartı: profil resmi zıplar, Follow'a dokunulur, kalp dolar (sabit, her videoda aynı)
const TAP_F = () => c('son', 'daily') + 10;
function kapanis(f, f0) {
  const t = f - f0, k = backOut(t / 22), tap = TAP_F(), td = f - tap;
  const sc = (.15 + .85 * k) * (1 + .015 * sin(t * .15)), rot = (1 - klamp(t / 24)) * -14 + 2.5 * sin(t * .1);
  let g = `<defs><radialGradient id="tg" cx="50%" cy="42%" r="75%"><stop offset="0" stop-color="#2AB3B1"/><stop offset="1" stop-color="#0C5667"/></radialGradient></defs><rect width="1080" height="1920" fill="url(#tg)"/>`;
  g += `<g transform="translate(540,1000) rotate(${rot.toFixed(2)}) scale(${sc.toFixed(3)})"><image href="img/pp.png" x="-380" y="-380" width="760" height="760" clip-path="inset(0 round 160px)"/></g>`;
  g += kazi(f, f0 + 14, yazi('Follow for a weird', 540, 520, 84, { renk: WHITE }) + yazi('everyday truth daily.', 540, 620, 84, { renk: GOLD }), 540, 560);
  const pr = td > 0 && td < 8 ? .9 : 1, on = td >= 4, bx = 400, by = 1560;
  if (f >= f0 + 30) g += `<g opacity="${f2(ac(f, f0 + 30, 8))}" transform="translate(${bx},${by}) scale(${pr})"><rect x="-210" y="-62" width="420" height="124" rx="62" fill="${on ? WHITE : '#FF6B5E'}"/>${yazi(on ? 'Following ✓' : 'Follow', 0, 24, 66, { renk: on ? '#0C5667' : WHITE })}</g>`;
  const hs = on ? 1 + .35 * Math.max(0, 1 - (td - 4) / 10) : 1, hx = 790, hy = 1560;
  if (f >= f0 + 30) g += `<g opacity="${f2(ac(f, f0 + 30, 8))}" transform="translate(${hx},${hy}) scale(${(1.6 * hs).toFixed(3)})"><path d="M0 28 C-60 -10 -34 -46 0 -18 C34 -46 60 -10 0 28Z" fill="${on ? '#FF6B5E' : 'none'}" stroke="${WHITE}" stroke-width="7" stroke-linejoin="round"/></g>`;
  if (td >= 4 && td < 16) for (let i = 0; i < 6; i++) { const a = i * P / 3, r = 80 + td * 9; g += `<circle cx="${f2(hx + r * cos(a))}" cy="${f2(hy + r * sin(a))}" r="${f2(10 - td * .5)}" fill="${GOLD}"/>`; }
  return g;
}
const SIRA = Object.keys(SAHNE);
const aralik = ad => { const i = SIRA.indexOf(ad), b = a => a === 'hook' ? 0 : T.seg[a].start - 10; return [b(ad), SIRA[i + 1] ? b(SIRA[i + 1]) : T.total + 30]; };
const W = 16;
window.renderFrame = function (f) {
  let g = '', clip = '', ust = '';
  SIRA.forEach((ad, i) => {
    const [b, s] = aralik(ad);
    if (f < b || f > s + W) return;
    // geçiş: ay konumundan büyüyen daire (iris); eski sahne altta kalır
    const ui = i ? EASE.dolly(klamp((f - b) / W)) : 1;
    if (ui <= 0) return;
    const sonraki = SIRA[i + 1] && f > s;
    const r = ui * 1900;
    clip += `<clipPath id="c${i}"><circle cx="870" cy="300" r="${f2(r)}"/></clipPath>`;
    g += `<g clip-path="url(#c${i})">${SAHNE[ad](f)}${EV[ad] ? evim(f, 170, 1720, EV[ad]) : ''}</g>`;
    if (i && ui > 0 && ui < 1) ust += `<circle cx="870" cy="300" r="${f2(r)}" fill="none" stroke="${GOLD}" stroke-width="14"/><circle cx="870" cy="300" r="${f2(Math.max(0, r - 26))}" fill="none" stroke="${KHAKI}" stroke-width="4" opacity=".6"/>`;
  });
  $('clips').innerHTML = clip; $('sahne').innerHTML = g; $('ust').innerHTML = ust;
  altyazi2(f, $('alt'));
};
function altyazi2(f, el) {
  const cp = T.caption(f), tt = f / FPS;
  if (!cp) { el.innerHTML = ''; el.style.display = 'none'; return; }
  el.style.display = 'inline-block';
  const seg = T.timing.words.find(y => y.start >= cp.start - 0.01).seg;
  const ws = T.timing.words.filter(x => x.start >= cp.start - 0.01 && x.start < cp.end && x.seg === seg);
  let i = 0;
  el.innerHTML = cp.lines.map(line => line.split(' ').map(() => {
    const x = ws[i++]; if (!x) return '';
    const col = tt < x.start ? '#8A93AD' : tt < x.end + 0.05 ? '#FFC94A' : '#FFFFFF';
    return `<span style="color:${col}">${x.w}</span>`;
  }).join(' ')).join('<br>');
}
