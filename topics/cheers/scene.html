<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../engine/fonts/fonts.css">
<style>
  /* STİL KARTI: linol baskı meyhane afişi; yalnız Arjin paleti + beyaz. Bkz. style.md */
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#D2CF9A}
  #kagit{position:absolute;inset:0;width:1080px;height:1920px}
  svg{position:absolute;inset:0}
  #alt{position:absolute;left:80px;right:80px;top:120px;font:700 64px/1.25 'Bitter';color:#28301C}
  #alt span{padding:0 6px;border-radius:4px}
  .as{font-family:'Alfa Slab One'}
  .bt{font-family:'Bitter';font-weight:700}
</style>
</head>
<body>
<img id="kagit" src="img/paper.jpg">
<svg viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <filter id="linol" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="5" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="5"/></filter>
    <pattern id="tara" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)"><rect width="14" height="14" fill="#9A7E3B"/><rect width="14" height="3" fill="#28301C" opacity=".55"/></pattern>
    <g id="clips"></g>
  </defs>
  <g id="sahne" filter="url(#linol)"></g><g id="rulo"></g>
</svg>
<div id="alt"></div>
<script src="../../engine/lib.js"></script>
<script src="../../engine/cute.js"></script>
<script src="../../engine/vinyet.js"></script>
<script>
window.FONTS = ['400 60px "Alfa Slab One"', '700 60px Bitter'];
// Arjin paleti (2026-11-21): yalnız bu dört renk + beyaz
const INK = '#28301C', GREEN = '#323D25', GOLD = '#9A7E3B', KHAKI = '#D2CF9A', WHITE = '#FFFFFF';
const c = cue, ac = (f, f0, d = 8) => f < f0 ? 0 : klamp((f - f0) / d);
const yazi = (txt, x, y, s, o = {}) => `<text x="${x}" y="${y}" class="${o.cls || 'as'}" font-size="${s}" fill="${o.renk || INK}" text-anchor="${o.a || 'middle'}" letter-spacing="${o.ls || 0}" opacity="${f2(o.op ?? 1)}">${txt}</text>`;
// linol baskı: blok tek karede basılır, 3 karede hafif büyüklükten oturur
const bas = (f, f0, ic, x = 540, y = 960) => f < f0 ? '' : `<g transform="translate(${x},${y}) scale(${(1 + .06 * (1 - ac(f, f0, 4))).toFixed(3)}) translate(${-x},${-y})">${ic}</g>`;
let CID = 0;

// kadeh (imza öğe): rot derece, sıvı her zaman yatay kalır
function kadeh(x, y, s, rot, seviye = .6, cal = 0) {
  const id = 'k' + (CID++);
  const kase = 'M-90 -260 C-96 -120 -62 -36 0 -30 C62 -36 96 -120 90 -260 Z';
  const yy = -260 + 230 * (1 - seviye);
  const egim = -rot + cal;
  let g = `<clipPath id="${id}"><path d="${kase}"/></clipPath>`;
  g += `<path d="${kase}" fill="${WHITE}" opacity=".35"/>`;
  g += `<g clip-path="url(#${id})"><g transform="rotate(${f2(egim)} 0 ${f2(yy)})"><rect x="-200" y="${f2(yy)}" width="400" height="400" fill="url(#tara)"/><path d="M-200 ${f2(yy)} H200" stroke="${INK}" stroke-width="6"/></g></g>`;
  g += `<path d="${kase}" fill="none" stroke="${INK}" stroke-width="12" stroke-linejoin="round"/>`;
  g += `<path d="M-62 -230 C-66 -150 -50 -90 -24 -66" fill="none" stroke="${WHITE}" stroke-width="9" stroke-linecap="round"/>`;
  g += `<rect x="-11" y="-34" width="22" height="160" fill="${INK}"/><ellipse cx="0" cy="130" rx="82" ry="20" fill="${INK}"/><ellipse cx="0" cy="124" rx="60" ry="8" fill="${GOLD}" opacity=".7"/>`;
  return at(x, y, s, g, rot);
}
// tokuşma: oyma bıçağı çizgileri ışın gibi açılır
function tik(f, f0, x, y, s = 1) {
  if (f < f0 || f > f0 + 18) return '';
  const u = ac(f, f0, 10), o = 1 - ac(f, f0 + 10, 8);
  let g = '';
  for (let k = 0; k < 9; k++) { const a = -P / 2 + (k - 4) * .32, r1 = 40 * s, r2 = (70 + 90 * u) * s; g += `<path d="M${f2(x + r1 * cos(a))} ${f2(y + r1 * sin(a))} L${f2(x + r2 * cos(a))} ${f2(y + r2 * sin(a))}" stroke="${k % 2 ? GOLD : INK}" stroke-width="10" stroke-linecap="round" opacity="${f2(o)}"/>`; }
  return g + `<circle cx="${x}" cy="${y}" r="${f2(18 * s * (1 - u) + 6)}" fill="${WHITE}" opacity="${f2(o)}"/>`;
}
// iki kadeh yaklaşır, t0'da değer
function ikili(f, t0, cx, cy, s, ac0 = 170) {
  const yak = EASE.dolly(ac(f, t0 - 12, 12)), geri = EASE.dolly(ac(f, t0 + 4, 16));
  const d = ac0 - (ac0 - 128 * s) * yak + 30 * geri, rot = 9 * yak - 4 * geri, cal = 10 * sin((f - t0) * .5) * Math.exp(-Math.max(0, f - t0) / 14) * (f >= t0);
  return kadeh(cx - d, cy, s, rot, .6, cal) + kadeh(cx + d, cy, s, -rot, .6, -cal) + tik(f, t0, cx, cy - 250 * s, s);
}
const damga = (f, f0, txt, x, y, s = 80, r = -7) => f < f0 ? '' : at(x, y, 1 + .25 * (1 - EASE.dolly(ac(f, f0, 6))), `<rect x="${-txt.length * s * .36 - 30}" y="${-s * .9}" width="${txt.length * s * .72 + 60}" height="${s * 1.4}" rx="8" fill="${GREEN}"/>` + yazi(txt, 0, s * .3, s, { renk: WHITE, ls: 2 }), r);

const SAHNE = {
  hook(f) {
    const cl = c('hook', 'clink'), sl = c('hook', 'slosh'), po = c('hook', 'poison'), ze = c('hook', 'zero');
    let g = ikili(f, cl + 4, 540, 1120, 1.25);
    // efsane: damlalar kadehler arasında gidip gelir
    if (f >= sl && f < po + 30) for (let k = 0; k < 3; k++) { const u = ((f - sl) / 22 + k / 3) % 1, x = 420 + 240 * u, y = 760 - 120 * sin(u * P); g += `<path d="M${f2(x)} ${f2(y - 16)} q-14 22 0 30 q14 -8 0 -30Z" fill="${GOLD}" stroke="${INK}" stroke-width="4"/>`; }
    // zehir şişesi
    g += bas(f, po, at(540, 560, 1, `<path d="M-50 -20 Q-50 -60 -20 -70 V-110 H20 V-70 Q50 -60 50 -20 V90 Q50 110 30 110 H-30 Q-50 110 -50 90Z" fill="${INK}"/><circle cx="0" cy="20" r="26" fill="${KHAKI}"/><rect x="-14" y="36" width="28" height="18" fill="${KHAKI}"/><circle cx="-9" cy="18" r="6" fill="${INK}"/><circle cx="9" cy="18" r="6" fill="${INK}"/>`), 540, 560);
    g += damga(f, ze, 'ZERO EVIDENCE', 540, 1560, 76);
    return g;
  },
  physics(f) {
    const cl = c('physics', 'clink'), si = c('physics', 'single'), hi = c('physics', 'historians'), so = c('physics', 'source');
    let g = ikili(f, cl + 2, 540, 1160, 1.6, 260);
    g += bas(f, si, yazi('DROPS SWAPPED: 0', 540, 620, 78), 540, 600);
    if (f >= hi) g += bas(f, hi, at(540, 1600, 1, `<path d="M-200 -70 Q-100 -100 0 -70 Q100 -100 200 -70 V70 Q100 40 0 70 Q-100 40 -200 70Z" fill="${WHITE}" stroke="${INK}" stroke-width="8"/><path d="M0 -70 V70" stroke="${INK}" stroke-width="6"/>${[0, 1, 2].map(k => `<path d="M-170 ${-36 + k * 32} H-30 M30 ${-36 + k * 32} H170" stroke="${GOLD}" stroke-width="6"/>`).join('')}`), 540, 1600);
    g += damga(f, so, 'NO SOURCE', 760, 1500, 56, 8);
    return g;
  },
  toast(f) {
    const tw = c('toast', 'toast'), y6 = c('toast', '1600s'), dr = c('toast', 'dropped'), sp = c('toast', 'spiced'), wi = c('toast', 'wine'), fl = c('toast', 'flavor');
    let g = bas(f, tw, yazi('TOAST', 540, 660, 190, { renk: GREEN }), 540, 600);
    g += bas(f, y6, yazi('1600s', 540, 760, 70, { renk: GOLD }), 540, 740);
    // maşrapa
    const m = `<rect x="-150" y="-150" width="300" height="330" rx="20" fill="${INK}"/><rect x="-126" y="-110" width="252" height="270" rx="10" fill="url(#tara)"/><path d="M150 -90 Q260 -90 260 10 Q260 110 150 110" fill="none" stroke="${INK}" stroke-width="34"/>${[0, 1, 2].map(k => `<rect x="-150" y="${-120 + k * 120}" width="300" height="14" fill="${GREEN}"/>`).join('')}`;
    g += at(540, 1250, 1, m);
    // ekmek dilimi düşer
    if (f >= dr - 14) {
      const u = EASE.terk(ac(f, dr - 14, 18)), y = 760 + 360 * u;
      const ek = `<path d="M-80 -60 Q-110 -110 -60 -120 Q0 -150 60 -120 Q110 -110 80 -60 V60 H-80Z" fill="${GOLD}" stroke="${INK}" stroke-width="10"/><path d="M-50 -60 V40 M0 -80 V40 M50 -60 V40" stroke="${INK}" stroke-width="4" opacity=".5"/>` + (f >= sp ? [[-40, -20], [30, 0], [-10, 30], [40, -50], [-50, 20]].map(([a, b]) => `<circle cx="${a}" cy="${b}" r="7" fill="${INK}"/>`).join('') : '');
      if (u < 1) g += at(540, y, .8, ek, 25 * u);
      else for (let k = 0; k < 6; k++) { const t = f - dr - 4; if (t < 16) g += `<circle cx="${540 + (k - 2.5) * 40}" cy="${f2(1120 - 60 * sin(t / 16 * P) * (1 + k % 2))}" r="10" fill="${WHITE}"/>`; }
    }
    g += bas(f, sp, yazi('spiced', 830, 1000, 56, { cls: 'bt', renk: GREEN }), 830, 990);
    g += bas(f, wi, yazi('wine or ale', 540, 1560, 64, { cls: 'bt' }), 540, 1540);
    g += damga(f, fl, 'FOR FLAVOR', 540, 1660, 54, -4);
    return g;
  },
  lady(f) {
    const pe = c('lady', 'person'), ca = c('lady', 'called'), fl = c('lady', 'flavored'), tw = c('lady', 'town');
    let g = bas(f, pe, at(540, 900, 1, `<ellipse rx="230" ry="290" fill="${GREEN}" stroke="${GOLD}" stroke-width="16"/><clipPath id="kameo"><ellipse rx="214" ry="274"/></clipPath><g clip-path="url(#kameo)"><path d="M-200 300 Q-190 130 -60 110 L-40 40 H40 L60 110 Q190 130 200 300Z" fill="${WHITE}"/><circle cy="-60" r="115" fill="${WHITE}"/><circle cx="30" cy="-150" r="80" fill="${GOLD}"/><circle cx="110" cy="-120" r="52" fill="${GOLD}"/></g>`), 540, 900);
    g += damga(f, ca, 'THE TOAST', 540, 1300, 84, 0);
    g += bas(f, fl, kadeh(860, 1250, .55, -10, .6), 860, 1200);
    if (f >= tw) {
      let s = ''; const bin = [[120, 100], [200, 150], [290, 120], [370, 170], [470, 130], [560, 190], [660, 140], [750, 160], [840, 110], [920, 150]];
      bin.forEach(([x, h], i) => { s += `<rect x="${x - 40}" y="${1700 - h}" width="80" height="${h}" fill="${INK}"/><path d="M${x - 46} ${1700 - h} L${x} ${1700 - h - 50} L${x + 46} ${1700 - h}Z" fill="${i % 3 ? INK : GREEN}"/><rect x="${x - 12}" y="${1700 - h + 30}" width="24" height="30" fill="${GOLD}"/>`; });
      g += `<g opacity="${f2(ac(f, tw, 6))}" transform="translate(0,${f2(40 * (1 - EASE.dolly(ac(f, tw, 10))))})">${s}</g>` + bas(f, tw, yazi('of the town', 540, 1420, 60, { cls: 'bt', renk: GREEN }), 540, 1420);
    }
    return g;
  },
  senses(f) {
    const nb = c('senses', 'nobody'), th = c('senses', 'theory'), fv = c('senses', 'five');
    let g = bas(f, nb, yazi('NOBODY KNOWS FOR SURE', 540, 610, 60, { renk: GREEN }), 540, 590);
    g += bas(f, th, yazi('the favorite theory', 540, 700, 52, { cls: 'bt', renk: GOLD }), 540, 690);
    const ik = {
      eye: `<path d="M-50 0 Q0 -40 50 0 Q0 40 -50 0Z" fill="${WHITE}" stroke="${INK}" stroke-width="7"/><circle r="15" fill="${INK}"/>`,
      nose: `<path d="M-6 -50 Q-10 -10 -34 20 Q-30 38 -6 34 Q4 44 20 34" fill="none" stroke="${INK}" stroke-width="9" stroke-linecap="round"/>`,
      tongue: `<path d="M-46 -12 Q0 30 46 -12" fill="none" stroke="${INK}" stroke-width="9" stroke-linecap="round"/><path d="M-20 6 Q0 48 20 6Z" fill="${WHITE}" stroke="${INK}" stroke-width="6"/>`,
      hand: `<rect x="-34" y="-6" width="68" height="56" rx="18" fill="${WHITE}" stroke="${INK}" stroke-width="6"/>${[-24, -8, 8, 24].map(x => `<rect x="${x - 7}" y="-48" width="14" height="50" rx="7" fill="${WHITE}" stroke="${INK}" stroke-width="5"/>`).join('')}`,
      ear: `<path d="M-20 40 Q-38 0 -20 -30 Q0 -56 24 -36 Q42 -16 24 10 Q12 22 14 40 Q10 54 -6 50" fill="${WHITE}" stroke="${INK}" stroke-width="8" stroke-linecap="round"/>`,
    };
    const ad = ['eye', 'nose', 'tongue', 'hand', 'ear'], kw = ['eyes', 'nose', 'tongue', 'hand', 'ears'];
    ad.forEach((a, i) => {
      const t = c('senses', kw[i]), x = 140 + i * 200, y = 1020, son = i === 4;
      g += bas(f, t, at(x, y, 1, `<circle r="86" fill="${son ? GREEN : GOLD}" stroke="${INK}" stroke-width="8"/>` + at(0, 0, 1.15, ik[a])), x, y);
      if (son && f >= t) for (let k = 0; k < 3; k++) { const u = ((f - t) / 30 + k / 3) % 1; g += `<path d="M${f2(x + 100 + 60 * u)} ${y - 50} Q${f2(x + 130 + 60 * u)} ${y} ${f2(x + 100 + 60 * u)} ${y + 50}" fill="none" stroke="${INK}" stroke-width="6" opacity="${f2(1 - u)}"/>`; }
    });
    g += bas(f, c('senses', 'clink', 1), yazi('+ clink', 940, 1180, 46, { cls: 'bt', renk: GREEN }), 940, 1170);
    g += bas(f, fv, yazi('5 / 5', 540, 1480, 170, { renk: GREEN }), 540, 1420);
    return g;
  },
  table(f) {
    const to = c('table', 'touching'), hu = c('table', 'hug');
    let g = `<circle cx="540" cy="1080" r="360" fill="${GREEN}"/><circle cx="540" cy="1080" r="330" fill="none" stroke="${GOLD}" stroke-width="6" stroke-dasharray="4 18"/>`;
    const yak = EASE.dolly(ac(f, to - 6, 18));
    for (let k = 0; k < 6; k++) {
      const a = k * P / 3 - P / 2, r = 260 - 165 * yak, x = 540 + r * cos(a), y = 1080 + r * sin(a);
      g += `<circle cx="${f2(x)}" cy="${f2(y)}" r="56" fill="${WHITE}" stroke="${INK}" stroke-width="9"/><circle cx="${f2(x)}" cy="${f2(y)}" r="38" fill="url(#tara)"/>`;
    }
    g += tik(f, to + 12, 540, 1080, 1.2);
    g += bas(f, hu, yazi('a group hug', 540, 1620, 96, { renk: GREEN }), 540, 1590);
    return g;
  },
  son(f) {
    const po = c('son', 'poison'), cl = c('son', 'clink'), re = c('son', 'real');
    let g = ikili(f, cl + 4, 540, 1140, 1.25);
    if (f >= po) g += `<g opacity="${f2(.9 * (1 - ac(f, cl, 8)))}">${yazi('poison story', 540, 640, 76, { renk: GREEN })}<path d="M220 615 L860 610" stroke="${INK}" stroke-width="12"/></g>`;
    g += damga(f, re, 'THE REAL ONE', 540, 640, 76, -4);
    return g;
  },
  cta(f) {
    const f0 = sec(T.timing.voice_end) - 4;
    let g = bas(f, f0, yazi('Enjoyed this?', 540, 640, 96), 540, 620) + bas(f, f0 + 4, yazi('Cheers!', 540, 760, 80, { renk: GOLD }), 540, 740);
    g += damga(f, f0 + 12, 'LIKE', 540, 960, 96, 0) + damga(f, f0 + 22, 'FOLLOW', 540, 1150, 96, 0);
    g += ikili(f, f0 + 30, 540, 1520, .7);
    return g;
  },
};
const SIRA = Object.keys(SAHNE);
function aralik(ad) {
  const i = SIRA.indexOf(ad), sn = SIRA[i + 1];
  const b = a => a === 'hook' ? 0 : a === 'cta' ? sec(T.timing.voice_end) - 4 - 14 : T.seg[a].start - 8;
  return [b(ad), sn ? b(sn) : T.total + 30];
}
const W = 14;
window.renderFrame = function (f) {
  CID = 0;
  let g = '', clip = '', r = '';
  SIRA.forEach((ad, i) => {
    const [b, s] = aralik(ad);
    if (f < b || f > s + W) return;
    // geçiş: mürekkep merdanesi soldan sağa geçer; arkasında yeni sahne basılı kalır
    const xb = i ? -100 + 1300 * EASE.dolly(klamp((f - b) / W)) : 1300, xs = -100 + 1300 * EASE.dolly(klamp((f - s) / W));
    clip += `<clipPath id="c${i}"><rect x="${f2(xs)}" y="0" width="${f2(Math.max(0, xb - xs))}" height="1920"/></clipPath>`;
    g += `<g clip-path="url(#c${i})">${SAHNE[ad](f)}</g>`;
    if (i) { const u = (f - b) / W; if (u > 0 && u < 1) { const x = -100 + 1300 * EASE.dolly(u); r += `<rect x="${f2(x - 60)}" y="0" width="120" height="1920" fill="${GREEN}"/><rect x="${f2(x - 30)}" y="0" width="18" height="1920" fill="${WHITE}" opacity=".35"/><rect x="${f2(x + 60)}" y="0" width="10" height="1920" fill="${INK}" opacity=".4"/>`; } }
  });
  $('clips').innerHTML = clip;
  $('sahne').innerHTML = g;
  $('rulo').innerHTML = r;
  altyazi7(f, $('alt'));
};
// altyazı: mürekkep rengi, kontur yok; söylenen kelime yeşil kutuda beyaz
function altyazi7(f, el) {
  const cp = T.caption(f), tt = f / FPS;
  if (!cp || f >= sec(T.timing.voice_end) - 4) { el.innerHTML = ''; return; }
  const seg = T.timing.words.find(y => y.start >= cp.start - 0.01).seg;
  const ws = T.timing.words.filter(x => x.start >= cp.start - 0.01 && x.start < cp.end && x.seg === seg);
  let i = 0;
  el.innerHTML = cp.lines.map(line => line.split(' ').map(() => {
    const x = ws[i++]; if (!x) return '';
    const st = tt < x.start ? 'opacity:.35' : tt < x.end + 0.05 ? `background:${GREEN};color:${WHITE}` : '';
    return `<span style="${st}">${x.w}</span>`;
  }).join(' ')).join('<br>');
}
</script>
</body>
</html>
