<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../engine/fonts/fonts.css">
<style>
  /* STİL KARTI: yağmur ormanı yeşili, dala asılı tembel hayvan + hızlı sinekkuşu tepkici, mide tarama modu. Bkz. style.md */
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#0E3328}
  svg{position:absolute;inset:0}
  #altyazi{position:absolute;left:60px;right:60px;top:200px;text-align:center;font:400 92px/1.08 'Patrick Hand';color:#FFF3DC;text-shadow:0 4px 0 rgba(6,30,20,.65)}
  .lbl{font-family:'Fredoka';font-weight:600;paint-order:stroke;stroke-linejoin:round}
</style>
</head>
<body>
<svg viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <linearGradient id="orman" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E3328"/><stop offset=".55" stop-color="#1F5E43"/><stop offset="1" stop-color="#5FA36A"/></linearGradient>
    <linearGradient id="isin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF4C2" stop-opacity=".35"/><stop offset="1" stop-color="#FFF4C2" stop-opacity="0"/></linearGradient>
    <linearGradient id="su" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4FC3D9" stop-opacity=".85"/><stop offset="1" stop-color="#1B6E8C" stop-opacity=".95"/></linearGradient>
    <pattern id="izgara" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#5FD3A0" stroke-opacity=".22" stroke-width="2"/></pattern>
  </defs>
  <g id="arka"></g>
  <g id="tarama"></g>
  <g id="dunya"></g>
  <g id="ust"></g>
</svg>
<div id="altyazi"></div>
<script src="../../engine/lib.js"></script>
<script src="../../engine/cute.js"></script>
<script>
window.FONTS = ['400 80px "Patrick Hand"', '600 80px Fredoka'];

function yaprak(x, y, s, r, renk) {
  return `<g transform="translate(${f2(x)},${f2(y)}) rotate(${f2(r)}) scale(${s})"><path d="M0 0 C30 -40 90 -40 120 0 C90 40 30 40 0 0Z" fill="${renk}"/><path d="M4 0 H112" stroke="rgba(0,0,0,.18)" stroke-width="4"/></g>`;
}

// tembel hayvan: dala asılı (kollar yukarı), merkez gövde
function tembel(o, t) {
  // o: x y s, xr (tarama 0..1), yosun 0..1, bas (baş dönüş derecesi), blink, sur, cig (çiğneme), wink, mide (0..1 yaprak ilerleme)
  const fur = mix(mix('#A88866', '#7FA36A', o.yosun || 0), '#0E2A3A', o.xr), fur2 = mix(mix('#8A6A4E', '#5E8A50', o.yosun || 0), '#0E2A3A', o.xr);
  const cizgi = o.xr > .5 ? '#7FF0C0' : '#4A3426', sw = 6;
  const sal = sin(t * 0.045) * 4;
  let g = `<g transform="translate(${f2(o.x)},${f2(o.y)}) scale(${o.s}) rotate(${f2(sal + (o.don || 0))})">`;
  // kollar dala (y=0) uzanır; gövde aşağıda
  const kol = (x0, x1) => `<path d="M${x0} 150 C${x0} 80 ${x1} 60 ${x1} 6" stroke="${fur2}" stroke-width="46" fill="none" stroke-linecap="round"/>` +
    `<path d="M${x1 - 14} 10 q-6 -26 14 -34 M${x1} 10 q-2 -28 18 -32 M${x1 + 14} 10 q2 -26 20 -26" stroke="${o.xr > .5 ? cizgi : '#F2E6CF'}" stroke-width="7" fill="none" stroke-linecap="round"/>`;
  g += kol(-70, -110) + kol(70, 110);
  // gövde
  g += `<ellipse cx="0" cy="270" rx="150" ry="175" fill="${fur}" stroke="${o.xr > .5 ? cizgi : 'none'}" stroke-width="${sw}"/>`;
  if (o.xr < .5) for (let k = 0; k < 9; k++) { const a = -1.2 + k * 0.3; g += `<path d="M${f2(cos(a + 1.57) * 120)} ${f2(260 + sin(a + 1.57) * 140)} q10 22 -4 40" stroke="${fur2}" stroke-width="6" fill="none" stroke-linecap="round" opacity=".7"/>`; }
  // bacaklar
  g += `<path d="M-80 400 q-20 60 10 90 M80 400 q20 60 -10 90" stroke="${fur2}" stroke-width="40" fill="none" stroke-linecap="round"/>`;
  // mide (tarama)
  if (o.xr > .02) {
    g += `<g opacity="${f2(o.xr)}"><path d="M-90 230 C-120 160 -20 140 10 190 C60 140 130 190 100 260 C90 330 -40 360 -80 300 C-110 280 -100 250 -90 230Z" fill="rgba(127,240,192,.12)" stroke="#7FF0C0" stroke-width="5"/>` +
      `<path d="M-30 195 q30 30 0 70 M40 200 q-20 40 20 80" stroke="#7FF0C0" stroke-width="3" fill="none" stroke-dasharray="8 8" opacity=".7"/>`;
    for (let k = 0; k < 6; k++) { const u = ((o.mide || 0) * 0.25 + k / 6) % 1, a = u * P * 2; g += yaprak(-30 + cos(a) * 70, 245 + sin(a) * 50, .32, a * 57, '#9BE38A'); }
    g += '</g>';
  }
  // baş
  g += `<g transform="translate(0,105) rotate(${f2(o.bas || 0)})">`;
  g += `<circle r="98" fill="${fur}" stroke="${o.xr > .5 ? cizgi : 'none'}" stroke-width="${sw}"/>`;
  g += `<ellipse cx="0" cy="12" rx="78" ry="64" fill="${mix('#F1E3C8', '#0E2A3A', o.xr)}"/>`;
  const gb = (x, d) => `<path d="M${x} -2 C${x + d * 34} -16 ${x + d * 52} 8 ${x + d * 40} 24 C${x + d * 20} 34 ${x} 18 ${x} -2Z" fill="${mix('#5A4030', '#0E2A3A', o.xr)}"/>`;
  g += gb(-12, -1) + gb(12, 1);
  const goz = (x) => (o.blink || o.uyku) ? `<path d="M${x - 10} 8 q10 8 20 0" stroke="#F1E3C8" stroke-width="5" fill="none" stroke-linecap="round"/>` :
    `<circle cx="${x}" cy="8" r="${o.sur ? 13 : 11}" fill="#1E140E"/><circle cx="${x - 3}" cy="4" r="4" fill="#fff"/>`;
  if (o.xr < .6) {
    g += goz(-34) + (o.wink ? `<path d="M24 8 q10 8 20 0" stroke="#F1E3C8" stroke-width="5" fill="none" stroke-linecap="round"/>` : goz(34));
    g += `<ellipse cx="0" cy="36" rx="16" ry="11" fill="#3A281C"/>`;
    const cg = o.cig ? sin(t * 0.25) * 4 : 0;
    g += o.sur ? `<ellipse cx="0" cy="62" rx="9" ry="12" fill="#3A281C"/>` : `<path d="M-22 ${54 + cg} q22 ${18 - cg} 44 0" stroke="#3A281C" stroke-width="5" fill="none" stroke-linecap="round"/>`;
    g += `<ellipse cx="-58" cy="44" rx="14" ry="8" fill="#FF9F9F" opacity=".55"/><ellipse cx="58" cy="44" rx="14" ry="8" fill="#FF9F9F" opacity=".55"/>`;
  }
  if (o.agiz) g += yaprak(10, 60, .6, -10 + sin(t * .2) * 6, '#6CC36A');
  g += '</g></g>';
  return g;
}

// sinekkuşu tepkici
function kus(x, y, s, sur, t, yon = -1) {
  const b = sin(t * 0.3) * 8, kanat = sin(t * 2.6) * 30;
  let g = `<g transform="translate(${f2(x)},${f2(y + b)}) scale(${yon * s},${s})">`;
  g += `<ellipse cx="-10" cy="-40" rx="30" ry="50" fill="#BDF3E4" opacity=".55" transform="rotate(${f2(-20 + kanat)})"/>`;
  g += `<path d="M30 10 L90 40 L70 0Z" fill="#2E8C78"/>`;
  g += `<ellipse cx="0" cy="0" rx="46" ry="34" fill="#36B39A"/><ellipse cx="-6" cy="14" rx="30" ry="18" fill="#E8FFF7"/>`;
  g += `<circle cx="-40" cy="-20" r="26" fill="#2FA38C"/><path d="M-62 -22 L-130 -30 L-62 -14Z" fill="#2A1F1A"/>`;
  g += `<circle cx="-46" cy="-24" r="${sur ? 9 : 7}" fill="#1A1410"/><circle cx="-48" cy="-27" r="3" fill="#fff"/><ellipse cx="-30" cy="-10" rx="7" ry="4" fill="#FF8FA3" opacity=".7"/>`;
  return g + '</g>';
}

function pil(x, y, s, oran, renk, yazi) {
  return `<g transform="translate(${x},${y}) scale(${f2(s)})"><rect x="-130" y="-60" width="260" height="120" rx="26" fill="#103A2C" stroke="#FFF3DC" stroke-width="8"/><rect x="130" y="-24" width="22" height="48" rx="8" fill="#FFF3DC"/>` +
    `<rect x="-116" y="-46" width="${f2(232 * oran)}" height="92" rx="16" fill="${renk}"/>` +
    `<text class="lbl" y="125" text-anchor="middle" font-size="58" fill="#FFF3DC" stroke="#0E3328" stroke-width="10">${yazi}</text></g>`;
}

let K = null;
function kur() {
  const S = T.seg, E = T.total;
  K = {
    cam: [[0, [540, 1150, 1]], [S.leaves.start, [540, 1150, 1]], [S.leaves.start + 16, [540, 1080, 1.35]], [S.stomach.start, [540, 1080, 1.35]], [S.stomach.start + 16, [540, 1260, 1.25]],
      [S.poop.start, [540, 1260, 1.25]], [S.poop.start + 20, [540, 1250, .9]], [S.algae.start, [540, 1250, .9]], [S.algae.start + 18, [540, 1150, 1.1]],
      [S.neck.start, [540, 1150, 1.1]], [S.neck.start + 14, [540, 1040, 1.5]], [S.swim.start, [540, 1040, 1.5]], [S.swim.start + 16, [540, 1250, 1]], [E, [540, 1150, 1]]],
    xr: [[0, 0], [S.stomach.start - 4, 0], [S.stomach.start + 8, 1], [S.poop.start - 2, 1], [S.poop.start + 10, 0]],
    su: [[0, 0], [S.swim.start - 4, 0], [S.swim.start + 14, 1], [S.son.start, 1], [S.son.start + 14, 0]],
  };
}

window.renderFrame = function (f) {
  if (!K) kur();
  const S = T.seg, c = cue, t = f;
  const [cx, cy, s] = kf(f, K.cam);
  const X = kf(f, K.xr), W = kf(f, K.su);
  const yavas = f >= S.leaves.start && f < S.stomach.start ? 0.35 : 1; // yavaş çekim hissi: arka plan hareketi yavaşlar

  // ----- arka plan -----
  let a = `<rect width="1080" height="1920" fill="url(#orman)"/>`;
  for (let k = 0; k < 4; k++) a += `<path d="M${120 + k * 260} 0 L${40 + k * 260} 0 L${-160 + k * 300} 1920 L${60 + k * 300} 1920Z" fill="url(#isin)" opacity="${f2(.5 + .3 * sin(t * .02 * yavas + k))}"/>`;
  // arka katman yaprakları
  for (let k = 0; k < 22; k++) { const x = rastgele(k) * 1180 - 50, y = rastgele(k + 40) * 1900, r = rastgele(k + 80) * 360; a += yaprak(x + sin(t * .015 * yavas + k) * 8, y, .9 + rastgele(k + 9), r, k % 2 ? '#1A5139' : '#24684A'); }
  for (let k = 0; k < 18; k++) { const u = (rastgele(k + 3) + t * .0015 * yavas) % 1; a += `<circle cx="${f2(rastgele(k + 7) * 1080 + sin(t * .02 + k) * 30)}" cy="${f2(1900 - u * 1900)}" r="${f2(3 + rastgele(k) * 4)}" fill="#FFF4C2" opacity=".45"/>`; }
  $('arka').innerHTML = a;
  $('tarama').innerHTML = X > .01 ? `<g opacity="${X.toFixed(3)}"><rect width="1080" height="1920" fill="#06231D"/><rect width="1080" height="1920" fill="url(#izgara)"/></g>` : '';

  // ----- dünya -----
  let w = '';
  // gövde ağaç + dal
  w += `<rect x="830" y="-200" width="120" height="2400" rx="40" fill="${mix('#5B3E2A', '#0B2A22', X)}"/><path d="M850 300 q20 40 0 80 M900 900 q-20 40 0 90 M860 1500 q18 30 0 70" stroke="#3E2A1C" stroke-width="8" fill="none" opacity="${f2(1 - X)}"/>`;
  const dalY = 900;
  w += `<path d="M-60 ${dalY + 10} C300 ${dalY - 20} 600 ${dalY + 20} 890 ${dalY - 10}" stroke="${mix('#6B4A32', '#0B2A22', X)}" stroke-width="54" fill="none" stroke-linecap="round"/>`;
  if (X < .5) for (let k = 0; k < 7; k++) w += yaprak(60 + k * 130, dalY - 26 + (k % 2) * 40, .7, (k % 2 ? 30 : -150) + sin(t * .03 + k) * 6, k % 3 ? '#4FA35A' : '#6CC36A');
  // tembel hayvanın konumu: kaka sahnesinde yere iner, yüzme sahnesinde suya
  const inis = kf(f, [[0, 0], [c('poop', 'climb'), 0], [c('poop', 'climb') + 40, 1], [S.algae.start, 1], [S.algae.start + 20, 0]]);
  const sy = dalY - 4 + inis * 560;
  const blink = [70, 300, 520, 800, 1100].some(b => f >= b && f < b + 7);
  const sur = (f >= c('hook', 'well') && f < c('hook', 'well') + 26) || (f >= c('stomach', 'weeks') && f < c('stomach', 'weeks') + 22);
  const bas = kf(f, [[0, 0], [c('neck', 'turn'), 0], [c('neck', '270') + 20, -135], [c('neck', '270') + 40, 135], [S.swim.start - 6, 135], [S.swim.start + 8, 0]]);
  const yosun = kf(f, [[0, 0], [c('algae', 'algae'), 0], [c('algae', 'green'), .85], [S.neck.start + 10, .85], [S.neck.start + 30, .25]]);
  const yuzO = W;
  if (yuzO < .99) {
    const tx = 540 + inis * 300 * 0 - 0, ty = sy;
    w += `<g opacity="${f2(1 - yuzO)}">${tembel({ x: 540 + inis * 230, y: ty, s: 1, xr: X, yosun, bas, blink, sur, cig: f >= S.leaves.start && f < S.stomach.start, agiz: f >= c('leaves', 'leaves') && f < S.stomach.start, wink: f >= c('son', 'leaf') && f < T.total - 6, mide: (f - S.stomach.start) / 30, don: 0 }, t * (f >= S.leaves.start && f < S.poop.start ? .4 : 1))}</g>`;
  }
  // kaka: yerde küçük sevimli yığın + takvim
  if (f >= c('poop', 'poop') - 4 && f < S.algae.start + 10) {
    const p = backOut((f - c('poop', 'poop') + 4) / 12) * (1 - klamp((f - S.algae.start) / 10));
    w += `<g transform="translate(560,1740) scale(${f2(p)})"><path d="M-60 30 q0 -30 30 -30 q-10 -30 30 -40 q-6 -26 20 -40 q10 30 20 40 q30 6 20 40 q30 4 30 30Z" fill="#8A5A3A" stroke="#4A2E1E" stroke-width="6"/><circle cx="-12" cy="10" r="6" fill="#1E140E"/><circle cx="20" cy="10" r="6" fill="#1E140E"/><path d="M-6 24 q10 8 20 0" stroke="#1E140E" stroke-width="4" fill="none"/></g>`;
    for (let k = 0; k < 4; k++) { const u = (t * .03 + k / 4) % 1; w += `<path d="M${560 + (k - 1.5) * 60} ${1680 - u * 120} l6 -12 l6 12 l12 6 l-12 6 l-6 12 l-6 -12 l-12 -6Z" fill="#FFE27A" opacity="${f2(p * (1 - u))}"/>`; }
  }
  // zemin
  w += `<path d="M-50 1780 Q540 1730 1130 1780 V2100 H-50Z" fill="${mix('#2F6B3E', '#0B2A22', X)}"/>`;
  // su ve yüzen tembel hayvan
  if (W > .01) {
    const yuz = 1350 - W * 120;
    w += `<rect x="-50" y="${f2(yuz)}" width="1180" height="900" fill="url(#su)" opacity="${f2(W)}"/>`;
    w += `<path d="M-50 ${f2(yuz)} ${Array.from({ length: 12 }, (_, k) => `q50 ${k % 2 ? 18 : -18} 100 0`).join(' ')}" stroke="#E6FBFF" stroke-width="10" fill="none" opacity="${f2(W * .8)}" transform="translate(${f2(-(t * 2) % 200)},0)"/>`;
    const sx = 540 + sin(t * .02) * 60;
    w += `<g opacity="${f2(W)}">${tembel({ x: sx, y: yuz - 60, s: .85, xr: 0, yosun: .25, bas: 0, blink, sur: false, don: 90 + sin(t * .15) * 8 }, t)}</g>`;
    for (let k = 0; k < 4; k++) { const u = (t * .05 + k / 4) % 1; w += `<path d="M${f2(sx + 220 + u * 240)} ${f2(yuz + 40 + k * 30)} h${f2(80 - u * 60)}" stroke="#E6FBFF" stroke-width="8" stroke-linecap="round" opacity="${f2(W * (1 - u))}"/>`; }
  }
  // yaprak sahnesi: ağır çekim etiketi + enerji neredeyse sıfır
  w += etiket('0.5x', 220, 600, f, c('leaves', 'slow'), S.stomach.start - 2, 70, '#FFE27A', 'middle', '#0E3328');
  // tarama: takvim
  if (f >= c('stomach', 'weeks') - 2 && f < S.poop.start + 6) {
    const p = backOut((f - c('stomach', 'weeks') + 2) / 12) * (1 - klamp((f - S.poop.start) / 8)), hf = 1 + Math.min(3, Math.floor((f - c('stomach', 'weeks')) / 14));
    w += `<g transform="translate(250,1080) scale(${f2(p)})"><rect x="-90" y="-80" width="180" height="170" rx="18" fill="#E8FFF4" stroke="#7FF0C0" stroke-width="6"/><rect x="-90" y="-80" width="180" height="50" rx="18" fill="#2FB57E"/><text class="lbl" y="50" text-anchor="middle" font-size="76" fill="#06231D">wk ${Math.max(1, hf)}</text></g>`;
  }
  $('dunya').setAttribute('transform', `translate(540,1150) scale(${s.toFixed(4)}) translate(${f2(-cx)},${f2(-cy)})`);
  $('dunya').innerHTML = w;

  // ----- ekran katmanı -----
  let u = '';
  // sinekkuşu: hızlı, yan karakter
  const kusO = (1 - X) * (1 - W * .3);
  const kx = kf(f, [[0, 900], [S.leaves.start, 900], [S.leaves.start + 12, 860], [S.poop.start, 860], [S.poop.start + 14, 260], [S.algae.start + 10, 260], [S.algae.start + 24, 880], [E_(f), 880]]);
  const ky = 1340 + kf(f, [[0, 0], [S.swim.start, 0], [S.swim.start + 14, -280], [S.son.start, -280], [S.son.start + 12, 0]]);
  const kSur = sur || (f >= c('swim', 'faster') && f < c('swim', 'faster') + 24) || (f >= c('neck', '270') && f < c('neck', '270') + 30);
  if (kusO > .01) u += `<g opacity="${f2(kusO)}">${kus(kx, ky, .9, kSur, t, kx < 540 ? 1 : -1)}</g>`;
  // kanca: LAZY? çizilir, pil belirir
  u += etiket('LAZY?', 540, 560, f, c('hook', 'lazy'), c('hook', 'saving') - 2, 110, '#FFE27A', 'middle', '#0E3328');
  if (f >= c('hook', 'well') && f < c('hook', 'saving') - 2) { const p = klamp((f - c('hook', 'well')) / 10); u += `<path d="M380 560 L${f2(380 + 320 * p)} 560" stroke="#FF6F6F" stroke-width="16" stroke-linecap="round"/>`; }
  if (f >= c('hook', 'saving') - 2 && f < S.leaves.start + 30) { const p = backOut((f - c('hook', 'saving') + 2) / 12) * (1 - klamp((f - S.leaves.start - 22) / 8)); u += pil(540, 560, p, .25 + .05 * sin(t * .2), '#FFD166', 'energy saver'); }
  if (f >= c('leaves', 'almost') && f < S.stomach.start + 4) { const p = backOut((f - c('leaves', 'almost')) / 12) * (1 - klamp((f - S.stomach.start + 4) / 8)); u += `<g transform="translate(780,560) scale(${f2(p)})">${yaprak(-70, 0, 1.1, 0, '#6CC36A')}<text class="lbl" y="120" text-anchor="middle" font-size="56" fill="#FFF3DC" stroke="#0E3328" stroke-width="10">≈ 0 energy</text></g>`; }
  u += etiket('weeks', 540, 560, f, c('stomach', 'weeks'), S.poop.start - 2, 100, '#7FF0C0', 'middle', '#06231D');
  u += etiket('1× a week', 540, 560, f, c('poop', 'once'), S.algae.start - 2, 96, '#FFE27A', 'middle', '#0E3328');
  u += etiket('algae', 540, 560, f, c('algae', 'algae'), S.neck.start - 2, 100, '#9BE38A', 'middle', '#0E3328');
  u += etiket('camouflage', 540, 680, f, c('algae', 'hide'), S.neck.start - 2, 64, '#FFF3DC', 'middle', '#0E3328');
  // boyun: yay + 270°
  if (f >= c('neck', 'turn') && f < S.swim.start + 4) {
    const o = klamp((f - c('neck', 'turn')) / 8) * (1 - klamp((f - S.swim.start) / 6)), p = klamp((f - c('neck', 'turn')) / 40), r = 230, a1 = -P / 2 + p * P * 1.5;
    u += `<g opacity="${f2(o)}" transform="translate(540,1180)"><path d="M0 ${-r} A${r} ${r} 0 ${p > .66 ? 1 : 0} 1 ${f2(cos(a1) * r)} ${f2(sin(a1) * r)}" stroke="#FFE27A" stroke-width="14" fill="none" stroke-linecap="round" stroke-dasharray="2 26"/></g>`;
    u += etiket('270°', 540, 600, f, c('neck', '270'), S.swim.start - 2, 120, '#FFE27A', 'middle', '#0E3328');
  }
  u += etiket('faster in water', 540, 600, f, c('swim', 'faster'), S.son.start - 2, 76, '#E6FBFF', 'middle', '#0E3328');
  if (f >= c('son', 'running') - 2) { const p = backOut((f - c('son', 'running') + 2) / 12), dol = kf(f, [[0, .2], [c('son', 'leaf'), .2], [c('son', 'leaf') + 24, 1]]); u += pil(540, 600, p, dol, '#6CC36A', 'leaf power'); }
  $('ust').innerHTML = u;
  altyazi(f, $('altyazi'));
};
function E_(f) { return T.total; }
</script>
</body>
</html>
