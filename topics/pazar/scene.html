<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../engine/fonts/fonts.css">
<style>
  /* STİL KARTI: 1930'lar duvar takvimi. Kırık beyaz kâğıt + takvim kırmızısı + mürekkep siyahı + hardal; yapraklı takvim maskotu, gün kartları; IBM Plex Sans + Mono. Bkz. style.md */
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#EFE6D2}
  svg{position:absolute;inset:0}
  #altyazi{position:absolute;left:60px;right:60px;top:1500px;text-align:center;font:500 70px/1.18 'IBM Plex Sans';color:#F6EFE0}
  .lbl{paint-order:stroke;stroke-linejoin:round;font-weight:600}
  .mono{font-family:'IBM Plex Mono';font-weight:600}
</style>
</head>
<body>
<svg viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <pattern id="kagit" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#EFE6D2"/><circle cx="8" cy="12" r="1.5" fill="#C9B894" opacity=".5"/><circle cx="28" cy="30" r="1" fill="#C9B894" opacity=".5"/></pattern>
    <linearGradient id="altband" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1E1A16" stop-opacity="0"/><stop offset=".22" stop-color="#1E1A16" stop-opacity=".9"/><stop offset="1" stop-color="#14110E" stop-opacity=".97"/></linearGradient>
  </defs>
  <g id="arka"></g><g id="sahne"></g><g id="ust"></g>
</svg>
<div id="altyazi"></div>
<script src="../../engine/lib.js"></script>
<script src="../../engine/tr.js"></script>
<script src="../../engine/vinyet.js"></script>
<script>
window.FONTS = ['500 70px "IBM Plex Sans"', '600 40px "IBM Plex Mono"'];
window.ETIKET_FONT = 'IBM Plex Mono';
window.ALT = { soluk: 'rgba(246,239,224,.32)', aktif: '#F2B53A', normal: '#F6EFE0' };
const c = cue, INK = '#1E1A16', KIR = '#D23A2A', HAR = '#E2A92E';
const L = (txt, x, y, f, f0, f1, s = 76, r = KIR) => etiket(txt, x, y, f, f0, f1, s, r, 'middle', '#EFE6D2');
const GUN = ['Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt', 'Paz'];

// hafta şeridi; tatil: {gün indeksi: 0..1 doluluk}; yarim: cumartesi yarım
function hafta(f, t, tatil, o = {}) {
  let g = '';
  GUN.forEach((d, i) => {
    const x = 90 + i * 135, v = tatil[i] || 0, h = o.yarim && i === 5 ? o.yarim : 0;
    const zp = v > .5 ? sin(t * .15 + i) * 4 : 0;
    g += `<g transform="translate(${x},${f2(o.y || 1000)}) translate(0,${f2(-zp)})"><rect x="-58" y="-90" width="116" height="180" rx="14" fill="#FBF6EA" stroke="${INK}" stroke-width="6"/>`;
    if (v > 0) g += `<rect x="-58" y="-90" width="116" height="${f2(180 * v)}" rx="14" fill="${KIR}"/>`;
    if (h > 0) g += `<rect x="-58" y="0" width="116" height="${f2(90 * h)}" rx="0" fill="${HAR}"/>`;
    g += `<rect x="-58" y="-90" width="116" height="44" rx="14" fill="${INK}"/><text class="mono" text-anchor="middle" y="-58" font-size="30" fill="#FBF6EA">${d}</text>`;
    g += `<text class="mono" text-anchor="middle" y="40" font-size="56" fill="${v > .5 ? '#FBF6EA' : INK}">${i + 1}</text></g>`;
  });
  return g;
}
// yapraklı takvim maskotu
function takvim(t, gun, renk, o = {}) {
  let g = `<rect x="-200" y="-220" width="400" height="440" rx="30" fill="#FBF6EA" stroke="${INK}" stroke-width="9"/><rect x="-200" y="-220" width="400" height="120" rx="30" fill="${renk}"/><rect x="-200" y="-130" width="400" height="30" fill="${renk}"/>`;
  g += `<circle cx="-110" cy="-230" r="20" fill="${INK}"/><circle cx="110" cy="-230" r="20" fill="${INK}"/>`;
  g += `<text class="mono" text-anchor="middle" y="-140" font-size="60" fill="#FBF6EA">${gun}</text>`;
  return g + yuz(0, 60, 1, t, { seed: o.seed || 0, sur: o.sur, kapali: o.kapali, uzgun: o.uzgun, cizgi: INK });
}
function dunya(t, o = {}) { return `<circle r="160" fill="#7FC6D0" stroke="${INK}" stroke-width="8"/><path d="M-120 -60 q40 -60 100 -30 q30 40 -20 60 q-40 20 -80 -30Z M20 40 q60 -40 110 10 q-10 60 -60 70 q-40 -10 -50 -80Z M-60 80 q30 10 40 40 q-30 20 -50 -10Z" fill="#8FB86A" stroke="${INK}" stroke-width="5"/>` + yuz(0, 0, .7, t, { seed: 5, sur: o.sur, uzgun: o.uzgun, cizgi: INK }); }

const SAHNE = {
  hook(f, S, t) {
    let g = hafta(f, t, { 5: gir(f, c('hook', 'cumartesi'), 10), 6: gir(f, c('hook', 'pazar'), 10) }, { y: 1050 });
    const x = gir(f, c('hook', 'değildi'), 12);
    if (x > 0) g += `<path d="M720 940 L1010 1160 M1010 940 L720 1160" stroke="${INK}" stroke-width="${f2(18 * x)}" stroke-linecap="round"/>`;
    g += L('hafta sonu = ?', 540, 720, f, c('hook', 'hafta'), S.s2.start - 2, 84, INK);
    return g;
  },
  s2(f, S, t) {
    let g = hafta(f, t, { 4: gir(f, c('s2', 'cumaydı'), 14) }, { y: 1160 });
    // kanun belgesi
    g += at(540, 720, pop(f, c('s2', '1924')), `<rect x="-300" y="-150" width="600" height="300" rx="10" fill="#FBF6EA" stroke="${INK}" stroke-width="7"/><text class="mono" text-anchor="middle" y="-70" font-size="40" fill="${INK}">HAFTA TATİLİ KANUNU</text><text class="mono" text-anchor="middle" y="20" font-size="80" fill="${KIR}">1924</text><text class="mono" text-anchor="middle" y="100" font-size="44" fill="${INK}">tatil: CUMA</text>`);
    return g;
  },
  s3(f, S, t) {
    let g = at(540, 820, 1, dunya(t, { seed: 2 }));
    // dünya saatleri: kapalı tabelaları
    const sehir = ['Londra', 'Paris', 'Berlin', 'Roma'];
    sehir.forEach((s, k) => { const x = 180 + k * 240; g += at(x, 1200, pop(f, c('s3', 'pazar') + k * 5), `<rect x="-105" y="-60" width="210" height="120" rx="12" fill="${INK}"/><text class="mono" text-anchor="middle" y="-10" font-size="30" fill="#FBF6EA">${s}</text><text class="mono" text-anchor="middle" y="34" font-size="34" fill="${KIR}">KAPALI</text><path d="M-40 -60 L0 -100 L40 -60" stroke="${INK}" stroke-width="5" fill="none"/>`, sin(t * .05 + k) * 4); });
    g += L('PAZAR', 540, 560, f, c('s3', 'pazar'), S.s4.start - 2, 96, KIR);
    return g;
  },
  s4(f, S, t) {
    let g = '';
    // banka + liman + ortaklar; Türkiye ile Avrupa arasında kopan ip
    g += at(230, 820, pop(f, c('s4', 'bankalar')) * .9, `<path d="M-130 -60 L0 -140 L130 -60Z" fill="${HAR}" stroke="${INK}" stroke-width="6"/><rect x="-120" y="-60" width="240" height="160" fill="#FBF6EA" stroke="${INK}" stroke-width="6"/>${[0, 1, 2, 3].map(i => `<rect x="${-96 + i * 56}" y="-40" width="24" height="120" fill="#C9B894"/>`).join('')}<text class="mono" text-anchor="middle" y="150" font-size="34" fill="${INK}">BANKA</text>`);
    g += at(540, 820, pop(f, c('s4', 'limanlar')) * .9, `<path d="M-130 40 H130 L100 100 H-110Z" fill="${KIR}" stroke="${INK}" stroke-width="6"/><rect x="-70" y="-20" width="120" height="60" fill="#FBF6EA" stroke="${INK}" stroke-width="5"/><rect x="-10" y="-90" width="34" height="70" fill="${INK}"/><text class="mono" text-anchor="middle" y="150" font-size="34" fill="${INK}">LİMAN</text>`);
    g += at(850, 820, pop(f, c('s4', 'ticaret')) * .9, `<rect x="-90" y="-80" width="180" height="140" rx="10" fill="#C9A06A" stroke="${INK}" stroke-width="6"/><path d="M-90 -20 H90 M0 -80 V60" stroke="${INK}" stroke-width="5"/><text class="mono" text-anchor="middle" y="150" font-size="34" fill="${INK}">TİCARET</text>`);
    const p = gir(f, c('s4', 'cuma'), 20), k = gir(f, c('s4', 'kopuyordu'), 16);
    g += `<text class="mono" x="230" y="1250" text-anchor="middle" font-size="44" fill="${INK}">TÜRKİYE</text><text class="mono" x="850" y="1250" text-anchor="middle" font-size="44" fill="${INK}">AVRUPA</text>`;
    g += `<path d="M300 1240 Q${f2(420)} ${f2(1240 + k * 60)} ${f2(540 - k * 30)} ${f2(1240 + k * 80)}" stroke="${INK}" stroke-width="8" fill="none" opacity="${f2(p)}"/><path d="M780 1240 Q660 ${f2(1240 + k * 60)} ${f2(540 + k * 30)} ${f2(1240 + k * 80)}" stroke="${INK}" stroke-width="8" fill="none" opacity="${f2(p)}"/>`;
    if (k > 0) g += `<text class="mono" x="540" y="1180" text-anchor="middle" font-size="40" fill="${KIR}" opacity="${f2(k)}">2 gün kopuk</text>`;
    return g;
  },
  s5(f, S, t) {
    const p = gir(f, c('s5', 'pazardı'), 16);
    let g = hafta(f, t, { 4: 1 - p, 6: p }, { y: 1160 });
    g += at(540, 720, pop(f, c('s5', '1935')), `<rect x="-300" y="-150" width="600" height="300" rx="10" fill="#FBF6EA" stroke="${INK}" stroke-width="7"/><text class="mono" text-anchor="middle" y="-70" font-size="40" fill="${INK}">YENİ KANUN</text><text class="mono" text-anchor="middle" y="20" font-size="80" fill="${KIR}">1935</text><text class="mono" text-anchor="middle" y="100" font-size="44" fill="${INK}">tatil: PAZAR</text>`, -2);
    if (p > 0) g += `<path d="M630 1290 C640 1360 860 1360 900 1290" stroke="${KIR}" stroke-width="8" fill="none" opacity="${f2(p)}" stroke-dasharray="14 10"/>`;
    return g;
  },
  s6(f, S, t) {
    const y = gir(f, c('s6', 'öğleden'), 20);
    let g = hafta(f, t, { 6: 1 }, { y: 1160, yarim: y });
    // saat: 13.00
    g += at(540, 760, pop(f, c('s6', 'öğleden')), `<circle r="150" fill="#FBF6EA" stroke="${INK}" stroke-width="9"/>${[...Array(12)].map((_, i) => `<path d="M${f2(cos(i * P / 6) * 120)} ${f2(sin(i * P / 6) * 120)} L${f2(cos(i * P / 6) * 136)} ${f2(sin(i * P / 6) * 136)}" stroke="${INK}" stroke-width="6"/>`).join('')}<path d="M0 0 V-100" stroke="${INK}" stroke-width="10" stroke-linecap="round"/><path d="M0 0 L60 -24" stroke="${KIR}" stroke-width="12" stroke-linecap="round"/><circle r="10" fill="${INK}"/><path d="M0 0 L0 -136 A136 136 0 0 1 136 0Z" fill="${HAR}" opacity=".35"/>`);
    g += L('Cmt öğleden sonra: tatil', 540, 560, f, c('s6', 'tatil'), S.s7.start - 2, 60, KIR);
    return g;
  },
  s7(f, S, t) {
    let g = '';
    // gazete manşetleri tartışma + iki takvim çarkı hizalanır
    if (f < c('s7', 'ama') + 10) g += at(540, 760, pop(f, c('s7', 'tartışma')) * (1 - gir(f, c('s7', 'ama'), 10)), `<rect x="-320" y="-180" width="640" height="360" fill="#FBF6EA" stroke="${INK}" stroke-width="7"/><text class="mono" text-anchor="middle" y="-100" font-size="52" fill="${INK}">PAZAR MI?!</text>${[0, 1, 2, 3].map(i => `<rect x="-280" y="${-40 + i * 46}" width="${560 - (i % 2) * 120}" height="16" fill="${INK}" opacity=".2"/>`).join('')}`, -3);
    const a = gir(f, c('s7', 'aynı'), 40);
    const cark = (x, rot, renk, yazi) => at(x, 1060, 1, `<g transform="rotate(${f2(rot)})"><circle r="170" fill="#FBF6EA" stroke="${INK}" stroke-width="8"/>${GUN.map((d, i) => `<g transform="rotate(${i * 360 / 7})"><text class="mono" text-anchor="middle" y="-110" font-size="32" fill="${i === 6 ? KIR : INK}">${d}</text></g>`).join('')}</g><circle r="40" fill="${renk}" stroke="${INK}" stroke-width="6"/><text class="mono" text-anchor="middle" y="230" font-size="40" fill="${INK}">${yazi}</text>`);
    g += cark(300, -2 * 360 / 7 * (1 - a) - 360 * 6 / 7, KIR, 'TÜRKİYE') + cark(780, -360 * 6 / 7, '#4A7AC2', 'DÜNYA');
    if (a > .95) g += at(540, 1060, pop(f, c('s7', 'aynı') + 40), `<circle r="50" fill="#5CB85C" stroke="${INK}" stroke-width="6"/><path d="M-22 0 l14 16 30 -32" stroke="#fff" stroke-width="10" fill="none" stroke-linecap="round"/>`);
    return g;
  },
  s8(f, S, t) {
    const p = gir(f, c('s8', 'cumartesi'), 20);
    let g = hafta(f, t, { 5: p, 6: 1 }, { y: 1100 });
    if (f >= c('s8', 'doğdu')) g += at(820, 860, pop(f, c('s8', 'doğdu')), `<path d="M-80 0 C-80 -60 80 -60 80 0" stroke="${KIR}" stroke-width="10" fill="none"/><text class="mono" text-anchor="middle" y="-80" font-size="48" fill="${KIR}">HAFTA SONU</text>`);
    g += L('tamamen tatil', 540, 700, f, c('s8', 'tamamen'), S.s9.start - 2, 72, INK);
    return g;
  },
  s9(f, S, t) {
    let g = at(540, 1020, 1, takvim(t, 'PAZAR', KIR, { seed: 3 }));
    // hesap makinesi şeritleri: ticaret takvimi
    if (f >= c('s9', 'ticaret')) g += at(860, 700, pop(f, c('s9', 'ticaret')) * .8, `<rect x="-110" y="-150" width="220" height="300" rx="20" fill="${INK}"/><rect x="-80" y="-120" width="160" height="70" rx="8" fill="#BFD8A0"/><text class="mono" x="70" y="-70" text-anchor="end" font-size="44" fill="${INK}">+2</text>${[0, 1, 2].map(r => [0, 1, 2].map(k => `<rect x="${-80 + k * 56}" y="${-30 + r * 56}" width="44" height="44" rx="8" fill="${r === 2 && k === 2 ? KIR : '#C9B894'}"/>`).join('')).join('')}`);
    g += L('pazar keyfi', 540, 640, f, c('s9', 'pazar'), c('s9', 'ticaret') - 2, 80, KIR);
    return g;
  },
  son(f, S, t) {
    let g = '';
    const sec = Math.floor(Math.max(0, f - c('son', 'hangi')) / 20) % 2;
    g += at(320, 1040, .8, takvim(t, 'CMT', sec === 0 ? HAR : '#C9B894', { seed: 4, sur: sec === 0 }));
    g += at(760, 1040, .8, takvim(t, 'PAZ', sec === 1 ? KIR : '#C9B894', { seed: 5, sur: sec === 1, kapali: f > T.total - 20 }));
    g += L('hangisi?', 540, 640, f, c('son', 'hangi'), T.total, 92, KIR);
    return g;
  },
};

window.renderFrame = function (f) {
  let a = `<rect width="1080" height="1920" fill="url(#kagit)"/>`;
  // duvardaki çivi + ince çizgi düzeni
  for (let k = 0; k < 6; k++) a += `<path d="M0 ${480 + k * 180} H1080" stroke="#D9CBAA" stroke-width="2" opacity=".6"/>`;
  a += `<rect x="40" y="420" width="1000" height="1000" fill="none" stroke="${INK}" stroke-width="3" opacity=".25"/>`;
  $('arka').innerHTML = a;
  vinyetler(f, SAHNE, $('sahne'));
  $('sahne').setAttribute('transform', 'translate(540,1000) scale(1.12) translate(-540,-1000)');
  a = `<rect x="300" y="230" width="480" height="110" fill="${KIR}"/><text class="mono" x="540" y="305" text-anchor="middle" font-size="56" fill="#FBF6EA">HAFTA TATİLİ</text>`;
  $('arka').innerHTML += a;
  $('ust').innerHTML = `<rect y="1420" width="1080" height="500" fill="url(#altband)"/>`;
  altyazi(f, $('altyazi'));
};
</script>
</body>
</html>
